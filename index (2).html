<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>to the unknown</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --cream: #f0ece3;
  --dark:  #0d0d0d;
  --accent: #c8a96e;
  --muted: #8a8070;
  --footer-h: 500px;
}

html, body {
  background: #000;
  font-family: 'DM Sans', sans-serif;
  overflow-x: hidden;
}

/* ════════════════════════════════════
   FIXED BG LAYERS
   ════════════════════════════════════ */
.bg-layer {
  position: fixed;
  inset: 0;
  background-size: cover;
  background-position: center;
  z-index: 0;
  opacity: 0;
  transition: opacity 0.9s ease;
}
.bg-layer.active { opacity: 1; }

#bg-hero {
  background-image: url('https://images.unsplash.com/photo-1614730321146-b6fa6a46bcb4?q=80&w=2000&auto=format&fit=crop');
  opacity: 1;
}
#bg-odyssey {
  background-image: url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2000&auto=format&fit=crop');
}
#bg-believe {
  background-image: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=2000&auto=format&fit=crop');
}
/* ── Earth globe layer — extracted from simple parallax code ── */
#bg-earth {
  background-image: url('https://images.unsplash.com/photo-1614730321146-b6fa6a46bcb4?q=80&w=2000&auto=format&fit=crop');
  background-position: center 50%;
}

.bg-layer::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.3);
}

/* ════════════════════════════════════
   HERO TEXT
   ════════════════════════════════════ */
.hero {
  position: fixed;
  inset: 0;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.2rem;
  pointer-events: none;
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.hero.hidden { opacity: 0; transform: translateY(-28px); }

.hero-eyebrow {
  font-size: 0.65rem;
  font-weight: 300;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.45);
}
.hero-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(4.5rem, 13vw, 10rem);
  font-weight: 300;
  font-style: italic;
  color: #fff;
  line-height: 0.88;
  letter-spacing: -0.02em;
  text-align: center;
}
.scroll-hint {
  margin-top: 1.5rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.scroll-hint span {
  font-size: 0.6rem;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.35);
}
.scroll-line {
  width: 1px;
  height: 50px;
  background: linear-gradient(to bottom, rgba(255,255,255,0.5), transparent);
  animation: blink 2s ease-in-out infinite;
}
@keyframes blink {
  0%,100% { opacity: 0.25; }
  50%      { opacity: 1; }
}

/* ════════════════════════════════════
   SCROLL BODY
   ════════════════════════════════════ */
.scroll-body {
  position: relative;
  z-index: 2;
  margin-top: 100vh;
  margin-bottom: var(--footer-h);
}

/* Solid cream panels */
.panel {
  background: var(--cream);
  position: relative;
  box-shadow: 0 -20px 60px rgba(0,0,0,0.35);
}
.panel:first-child::before {
  content: '';
  display: block;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
}

/* ── Image window strips ── */
.window-strip {
  width: 100%;
  height: 68vh;
  min-height: 400px;
  position: relative;
  overflow: hidden;
  background-size: cover;
  background-position: center 50%;
}

#win-odyssey { background-image: url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2000&auto=format&fit=crop'); }
#win-believe  { background-image: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=2000&auto=format&fit=crop'); }
#win-depth    { background-image: url('https://images.unsplash.com/photo-1446776899648-aa78eefe8ed0?q=80&w=2000&auto=format&fit=crop'); }
#win-signal { background-image: url('https://images.unsplash.com/photo-1502134249126-9f3755a50d78?q=80&w=2000&auto=format&fit=crop'); }
#win-velocity { background-image: url('https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?q=80&w=2000&auto=format&fit=crop'); }
#win-shield { background-image: url('https://images.unsplash.com/photo-1531366936337-7c912a4589a7?q=80&w=2000&auto=format&fit=crop'); }
#win-eternity { background-image: url('https://images.unsplash.com/photo-1464802686167-b939a6910659?q=80&w=2000&auto=format&fit=crop'); }
#win-quantum { background-image: url('https://images.unsplash.com/photo-1518066000714-58c45f1a2c0a?q=80&w=2000&auto=format&fit=crop'); }
#win-observer { background-image: url('https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?q=80&w=2000&auto=format&fit=crop'); }
#win-dark { background-image: url('https://images.unsplash.com/photo-1538370965046-79c0d6907d47?q=80&w=2000&auto=format&fit=crop'); }
#win-wormhole { background-image: url('https://images.unsplash.com/photo-1462332420958-a05d1e002413?q=80&w=2000&auto=format&fit=crop'); }
/* ── Earth strip: the exact same image + parallax from the simple code ── */
#win-earth {
  background-image: url('https://images.unsplash.com/photo-1614730321146-b6fa6a46bcb4?q=80&w=2000&auto=format&fit=crop');
  height: 100vh; /* full viewport — matches original hero treatment */
  min-height: 500px;
}

.window-strip::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.55));
  z-index: 1;
}

.window-text {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  text-align: center;
  padding: 2rem;
}
.win-label {
  font-size: 0.6rem;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.4);
}
.win-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(3rem, 9vw, 7.5rem);
  font-weight: 300;
  font-style: italic;
  color: #fff;
  line-height: 0.9;
  letter-spacing: -0.02em;
}

/* ── Section prose ── */
.section {
  max-width: 860px;
  margin: 0 auto;
  padding: 5rem 2rem 6rem;
}
.section-label {
  font-size: 0.6rem;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 1.2rem;
}
.section-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(2rem, 5vw, 4.2rem);
  font-weight: 300;
  color: var(--dark);
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin-bottom: 1.5rem;
}
.section-body {
  font-size: 1rem;
  font-weight: 300;
  color: var(--muted);
  line-height: 1.9;
  max-width: 560px;
}

.two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4rem;
  align-items: start;
}
@media (max-width: 640px) {
  .two-col { grid-template-columns: 1fr; gap: 2rem; }
}

.stat-row {
  display: flex;
  gap: 3rem;
  flex-wrap: wrap;
  margin-top: 3rem;
  padding-top: 2.5rem;
  border-top: 1px solid rgba(0,0,0,0.07);
}
.stat { display: flex; flex-direction: column; gap: 0.2rem; }
.stat-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2.8rem;
  font-weight: 300;
  color: var(--dark);
  line-height: 1;
}
.stat-label {
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
}

.quote-block {
  border-left: 2px solid var(--accent);
  padding: 0.4rem 0 0.4rem 1.8rem;
  margin-top: 2.5rem;
}
.quote-block p {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.5rem;
  font-weight: 300;
  font-style: italic;
  color: var(--dark);
  line-height: 1.45;
}
.quote-block cite {
  display: block;
  margin-top: 0.5rem;
  font-size: 0.62rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--muted);
  font-style: normal;
}

.stat-col {
  display: flex;
  flex-direction: column;
  gap: 2.2rem;
  padding-top: 1rem;
}

/* ════════════════════════════════════
   FIXED CURTAIN FOOTER
   ════════════════════════════════════ */
.parallax-footer {
  position: fixed;
  bottom: 0; left: 0;
  width: 100%;
  height: var(--footer-h);
  z-index: 1;
  background-image:
    linear-gradient(rgba(0,0,0,0.52), rgba(0,0,0,0.52)),
    url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2000&auto=format&fit=crop');
  background-size: cover;
  background-position: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.2rem;
  text-align: center;
  padding: 2rem;
  
  /* ADD THESE 3 LINES: Hide it by default */
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}

/* ADD THIS NEW BLOCK RIGHT BELOW IT */
.parallax-footer.unhide {
  opacity: 1;
  pointer-events: auto;
}
.footer-eyebrow {
  font-size: 0.6rem;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.35);
}
.footer-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(2.5rem, 7vw, 6rem);
  font-weight: 300;
  font-style: italic;
  color: #fff;
  line-height: 0.92;
  letter-spacing: -0.02em;
}
.footer-sub {
  font-size: 0.9rem;
  font-weight: 300;
  color: rgba(255,255,255,0.45);
  max-width: 420px;
  line-height: 1.7;
}
.footer-cta {
  margin-top: 0.5rem;
  padding: 0.75rem 2.8rem;
  border: 1px solid rgba(200,169,110,0.6);
  color: var(--accent);
  font-size: 0.65rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  cursor: pointer;
  background: transparent;
  font-family: 'DM Sans', sans-serif;
  transition: background 0.3s, color 0.3s;
}
.footer-cta:hover { background: var(--accent); color: #000; }
.footer-copy {
  position: absolute;
  bottom: 1.2rem;
  font-size: 0.58rem;
  color: rgba(255,255,255,0.18);
  letter-spacing: 0.15em;
}
#asteroid-canvas {
  position: fixed;
  inset: 0;
  z-index: 1; /* Above the footer, but strictly behind the white content panels! */
  pointer-events: none; 
  opacity: 0;
  transition: opacity 1.2s ease;
}
#asteroid-canvas.visible { opacity: 0.55; }
#cursor-glow {
  position: fixed;
  width: 320px; height: 320px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(200,169,110,0.07) 0%, transparent 70%);
  pointer-events: none;
  z-index: 9998;
  transform: translate(-50%, -50%);
  transition: opacity 0.4s ease;
  opacity: 0;
}
#chapter-tracker {  
  position: fixed;  
  right: 1.8rem;  
  top: 50%;  
  transform: translateY(-50%);  
  z-index: 9000;  
  display: flex;  
  flex-direction: column;  
  gap: 15px; /* Spaced out slightly more for easier clicking */ 
  opacity: 0;  
  transition: opacity 0.5s ease;
}
#chapter-tracker.visible { 
  opacity: 1; 
}

.chapter-dot {  
  width: 10px; /* Doubled the size */
  height: 10px;  
  border-radius: 50%;  
  background: rgba(200,169,110,0.5);  
  border: 1px solid rgba(0,0,0,0.15); /* Adds contrast on cream backgrounds */
  box-shadow: 0 2px 5px rgba(0,0,0,0.4); /* Adds depth over images */
  transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);  
  cursor: pointer;
}
.chapter-dot:hover {
  transform: scale(1.3);
  background: #c8a96e;
}
.chapter-dot.active {  
  background: #c8a96e;  
  border-color: #c8a96e;
  transform: scale(1.6);
  box-shadow: 0 0 12px rgba(200,169,110,0.8); /* Premium golden glow */
}
#starfield-canvas {
  position: fixed;
  inset: 0;
  z-index: 1; /* This pulls the stars in front of the background images */
  pointer-events: none;
  transition: opacity 1.4s ease;
}
/* ── Interactive Reveal Element ── */
.interactive-reveal {
  position: relative;
  width: 100%;
  max-width: 560px;
  height: 280px;
  margin: 3rem auto 0;
  overflow: hidden;
  cursor: crosshair; /* Gives a technical, targeting feel */
}
.reveal-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94), filter 1.2s ease;
  /* Starts out cold and grayscale */
  filter: grayscale(100%) contrast(1.1) brightness(0.7);
}
.interactive-reveal:hover .reveal-img {
  transform: scale(1.08);
  /* Darkens significantly on hover to let the text pop */
  filter: grayscale(40%) contrast(1.2) brightness(0.2); 
}
.reveal-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  opacity: 0;
  transition: opacity 0.8s ease;
}
.interactive-reveal:hover .reveal-overlay {
  opacity: 1;
}
.reveal-text {
  color: #c8a96e; /* Golden accent */
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.6rem;
  font-style: italic;
  text-align: center;
  line-height: 1.4;
  /* Starts slightly lower to create a rising effect */
  transform: translateY(15px);
  transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
.interactive-reveal:hover .reveal-text {
  transform: translateY(0);
}
/* ── Dark Matter Scanner ── */
.dark-panel {
  background: #050505; /* Pitch black */
  position: relative;
  cursor: crosshair;
}
/* Force text bright inside the dark panel */
.dark-mode-text { color: #f0ece3 !important; }
.dark-panel .section-body.dark-mode-text { color: #8a8070 !important; }

.flashlight-cover {
  position: absolute;
  inset: 0;
  background: #050505;
  z-index: 5;
  pointer-events: none;
  /* The hole-punch effect. Transitions smoothly as the mouse moves. */
  -webkit-mask-image: radial-gradient(circle 220px at var(--mouse-x, -1000px) var(--mouse-y, -1000px), transparent 0%, black 100%);
  mask-image: radial-gradient(circle 220px at var(--mouse-x, -1000px) var(--mouse-y, -1000px), transparent 0%, black 100%);
  transition: -webkit-mask-image 0.1s ease-out, mask-image 0.1s ease-out;
}

.scan-prompt {
  position: absolute;
  top: 50%; width: 100%; text-align: center;
  color: rgba(200,169,110,0.3);
  font-size: 0.6rem;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  z-index: 10;
  pointer-events: none;
  transition: opacity 0.4s;
}
/* Hide the prompt once the user starts scanning */
.dark-panel:hover .scan-prompt {
  opacity: 0;
}
/* ── Wormhole Warp Button ── */
.warp-btn {
  margin-top: 3rem;
  padding: 1rem 3rem;
  border: 1px solid #c8a96e;
  color: #c8a96e;
  background: transparent;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.7rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.3s ease;
}
.warp-btn:hover {
  background: #c8a96e;
  color: #000;
  box-shadow: 0 0 25px rgba(200,169,110,0.6);
  transform: scale(1.05);
}

/* ── Hyperspace Jump Animation Classes ── */
body.warping {
  overflow: hidden; /* Locks scrolling during the jump */
}
body.warping .scroll-body {
  /* Stretches the UI to extreme lengths and blurs it like moving at lightspeed */
  transform: scaleY(4) scaleX(0.5) translateY(-10vh);
  filter: blur(15px) contrast(1.5);
  opacity: 0;
  transition: all 0.7s cubic-bezier(0.5, 0, 0.2, 1);
}
body.warping .bg-layer {
  /* Zooms the background stars past the camera */
  transform: scale(3);
  filter: blur(20px);
  transition: all 0.7s cubic-bezier(0.5, 0, 0.2, 1);
}

/* ── The Blinding Whiteout Flash ── */
#warp-flash {
  position: fixed;
  inset: 0;
  background: #fff;
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease-in;
}
#warp-flash.active {
  opacity: 1;
}
/* ── Chapter II Upgrades: Nebula Fog & Gravity ── */

/* Nebula Fog Effect */
.nebula-quote-block {
  position: relative;
  cursor: crosshair;
}
.nebula-text {
  transition: filter 0.8s ease, opacity 0.8s ease, transform 0.8s ease;
  filter: blur(6px);
  opacity: 0.3;
  transform: translateX(-10px); /* Drifts slightly to the right when cleared */
}
.nebula-quote-block:hover .nebula-text {
  filter: blur(0px);
  opacity: 1;
  transform: translateX(0);
}
.nebula-fog {
  position: absolute;
  inset: 0;
  /* Shifting pink & gold gas overlay */
  background: linear-gradient(45deg, rgba(232, 178, 193, 0.4), rgba(200, 169, 110, 0.4));
  filter: blur(10px);
  pointer-events: none;
  transition: opacity 0.8s ease;
  animation: fog-drift 4s infinite alternate ease-in-out;
  z-index: 1;
}
.nebula-quote-block:hover .nebula-fog {
  opacity: 0; /* Fog burns away on hover */
}
@keyframes fog-drift {
  0% { transform: translateX(-5px) scale(1.05); }
  100% { transform: translateX(5px) scale(1.05); }
}

/* Magnetic Gravity Stats */
.gravity-well {
  padding: 1rem;
  margin: -1rem; /* Invisible catch-area expansion for the mouse */
  border-radius: 8px;
  transition: background 0.4s ease;
}
.magnetic-target {
  display: inline-block;
  /* High-end spring physics transition for snapping back into place */
  transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.4s ease, text-shadow 0.4s ease;
  will-change: transform;
}
.gravity-well:hover .magnetic-target {
  color: #c8a96e;
  text-shadow: 0 5px 20px rgba(200, 169, 110, 0.4); /* Glows when caught in gravity */
}
/* ── Chapter III Upgrades: Radio Signal Visualizer ── */
.signal-container {
  position: relative;
  margin-top: 3rem;
  padding-top: 2.5rem;
  border-top: 1px solid rgba(0,0,0,0.07);
  cursor: ew-resize; /* Gives the user a "tuning dial" hint */
}
#signal-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: -1; /* Sits directly behind the stats */
  opacity: 0.5;
  pointer-events: none;
}
.wow-glitch {
  position: relative;
  display: inline-block;
}
.wow-glitch::before, .wow-glitch::after {
  content: attr(data-text);
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  opacity: 0;
}
/* Triggers the glitch when you tune the signal zone */
.signal-container:hover .wow-glitch::before {
  left: 2px;
  text-shadow: -2px 0 red;
  animation: noise-anim-1 0.2s infinite linear alternate-reverse;
  opacity: 1;
}
.signal-container:hover .wow-glitch::after {
  left: -2px;
  text-shadow: -2px 0 blue;
  animation: noise-anim-2 0.3s infinite linear alternate-reverse;
  opacity: 1;
}

@keyframes noise-anim-1 {
  0% { clip-path: inset(20% 0 80% 0); }
  20% { clip-path: inset(60% 0 10% 0); }
  40% { clip-path: inset(40% 0 50% 0); }
  60% { clip-path: inset(80% 0 5% 0); }
  80% { clip-path: inset(10% 0 60% 0); }
  100% { clip-path: inset(30% 0 20% 0); }
}
@keyframes noise-anim-2 {
  0% { clip-path: inset(10% 0 60% 0); }
  20% { clip-path: inset(30% 0 20% 0); }
  40% { clip-path: inset(70% 0 10% 0); }
  60% { clip-path: inset(20% 0 50% 0); }
  80% { clip-path: inset(90% 0 5% 0); }
  100% { clip-path: inset(40% 0 30% 0); }
}
/* ── Chapter VI Upgrade: Slipstream Typography ── */
#panel-velocity {
  cursor: ew-resize; 
}
.live-velo {
  /* Tabular-nums keeps the width of numbers identical so they don't jump left/right while spinning */
  font-variant-numeric: tabular-nums; 
  display: inline-block;
}
#velo-stats {
  display: flex;
  gap: 3rem;
  will-change: transform, text-shadow;
  /* Gives the numbers a smooth, ghostly motion blur when fighting wind resistance */
  color: var(--dark);

/* ── Chapter VII Upgrade: Aurora Deflection Engine ── */
#panel-shield {
  position: relative;
  overflow: hidden; /* Keeps the aurora flare inside the panel */

/* The invisible radiation flare tracking your mouse */
.aurora-flare {
  position: absolute;
  width: 500px;
  height: 500px;

  background: radial-gradient(circle, rgba(46, 204, 113, 0.12) 0%, rgba(155, 89, 182, 0.08) 40%, transparent 70%);

  pointer-events: none;
  transform: translate(-50%, -50%);
  opacity: 0;
  transition: opacity 0.5s ease;
  mix-blend-mode: multiply; /* Blends elegantly into the cream background */

/* The text targets that push back against you */
.shield-target {
  display: inline-block;
  will-change: transform;

/* ── Chapter VIII Upgrade: The Heat Death Engine ── */
#panel-eternity {

    calc(236 - (var(--entropy) * 231)),
    calc(227 - (var(--entropy) * 222))

    calc(128 - (var(--entropy) * 43)),
    calc(112 - (var(--entropy) * 27))
  ) !important;
}

/* ── Entropy Transformations ── */

/* 100T Stars dissolving into nothing */
.stat-dying-star {
  opacity: calc(1 - (var(--entropy) * 0.95));

.stat-fading {

.stat-consciousness .stat-num {

.time-line-progress {

        el.style.maxWidth = `${Math.ceil(perfectWidth)}px`;
        // Center the newly shrink-wrapped block
        el.style.marginInline = 'auto'; 
      });
    }

    // Run immediately on load
    shrinkwrapText();
    
    // Rerun instantly on resize. Because of pretext, this costs ~0.0002ms 
    // and causes zero layout lag.
    window.addEventListener('resize', shrinkwrapText, { passive: true });
  })();
</script>
</body>
</html>
