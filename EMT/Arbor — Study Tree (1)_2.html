<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arbor — Study Tree</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#f5f4ed;--mute:#a1b899;--glass:rgba(8,20,13,.72);--glass-card:linear-gradient(148deg,rgba(13,32,20,.84),rgba(6,18,11,.92));--line:rgba(180,240,108,.16);--line-soft:rgba(255,255,255,.09);--acc:#b4f06c;--emerald:#06140c;--gold:#f2c46d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:#dfe7e4;font:15px/1.65 Inter,system-ui,sans-serif;color:var(--ink);overflow-x:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
#track{height:800vh}
#brand,#bar,#rail,#hint,#foot,#side{z-index:3}
#brand{position:fixed;top:calc(20px + env(safe-area-inset-top,0px));left:5vw;display:flex;align-items:center;gap:14px;font:300 13px Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#18281e;transition:color .4s}
#brand b{font-weight:700;color:inherit}
#burger{width:34px;height:20px;display:flex;flex-direction:column;justify-content:space-between;background:none;border:0;padding:0;cursor:pointer;color:inherit}
#burger i{display:block;height:2px;background:currentColor;border-radius:2px;transition:.3s}
#burger i:nth-child(2){width:70%}
#burger:hover i:nth-child(2){width:100%}
#menu{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:5vw;min-width:280px;padding:12px;background:var(--glass-card);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:6px 28px 6px 28px;opacity:0;transform:translateY(-8px);pointer-events:none;transition:.35s cubic-bezier(.16,1,.3,1);box-shadow:0 24px 60px rgba(0,0,0,.45);z-index:5}
#menu.on{opacity:1;transform:none;pointer-events:auto}
#menu button{display:flex;gap:12px;width:100%;align-items:baseline;background:none;border:0;color:var(--ink);font:400 13px Inter,sans-serif;padding:9px 12px;border-radius:8px;cursor:pointer;text-align:left;transition:.2s}
#menu button:hover{background:rgba(255,255,255,.08);color:var(--acc)}
#menu em{font:normal 600 10px Inter,sans-serif;color:var(--acc);letter-spacing:.14em}
#rail{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:14px}
#rail::before{content:"";position:absolute;right:4px;top:-24px;bottom:-24px;width:1px;background:linear-gradient(var(--acc) calc(var(--p,0)*100%),rgba(255,255,255,.3) 0)}
#rail button{position:relative;width:9px;height:9px;border-radius:50%;border:1px solid #fff;background:rgba(12,25,16,.45);padding:0;cursor:pointer;box-shadow:0 0 0 1px rgba(0,0,0,.35);transition:.3s cubic-bezier(.16,1,.3,1)}
#rail button.on{background:var(--acc);border-color:var(--acc);transform:scale(1.55);box-shadow:0 0 12px var(--acc)}
#rail button.hit{box-shadow:0 0 0 3px rgba(242,196,109,.7)}
#rail button .tip{position:absolute;right:22px;top:50%;transform:translateY(-50%) translateX(6px);background:var(--glass-card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);color:var(--ink);padding:4px 10px;border-radius:6px;font:500 11px Inter,sans-serif;white-space:nowrap;letter-spacing:.04em;opacity:0;pointer-events:none;transition:.2s cubic-bezier(.16,1,.3,1);box-shadow:0 8px 20px rgba(0,0,0,.4)}
#rail button:hover .tip{opacity:1;transform:translateY(-50%)}
#hint{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font:600 11px Inter,sans-serif;letter-spacing:.25em;text-transform:uppercase;color:#18281e;transition:opacity .5s}
#cards{position:fixed;inset:0;pointer-events:none}
.card{position:absolute;top:50%;width:min(440px,38vw);max-height:78vh;overflow:auto;padding:30px 32px;background:var(--glass-card);backdrop-filter:blur(24px) saturate(1.35);-webkit-backdrop-filter:blur(24px) saturate(1.35);border:1px solid var(--line);border-radius:6px 54px 6px 54px;opacity:0;transform:translateY(-45%) scale(.96);transition:opacity .5s cubic-bezier(.16,1,.3,1),transform .65s cubic-bezier(.16,1,.3,1);box-shadow:0 30px 70px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12),0 0 0 1px rgba(0,0,0,.4)}
.card.on{opacity:1;transform:translateY(-50%) scale(1);pointer-events:auto}
.card.r{right:calc(5vw + 18px)}.card.l{left:5vw;border-radius:54px 6px 54px 6px}
.meta-chip{display:inline-flex;align-items:center;gap:6px;font:600 9px/1 Inter,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);margin-bottom:8px;padding:4px 8px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line-soft)}
.meta-chip i{width:4px;height:4px;border-radius:50%;background:var(--acc);display:inline-block}
.k{font:600 11px Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--acc);margin-bottom:2px}
.num{font:800 clamp(44px,5vw,68px)/1 Inter,sans-serif;letter-spacing:-.03em;color:var(--acc);text-shadow:0 0 24px rgba(180,240,108,.25);margin-bottom:4px}
.card:not(.hero) h2{font:700 clamp(20px,2vw,28px)/1.15 Fraunces,Georgia,serif;letter-spacing:.01em;color:#fff;margin:4px 0 14px}
.card p{color:var(--mute);margin-bottom:12px;font-size:14px;line-height:1.7}
.card ul{padding-left:18px;color:var(--mute);font-size:14px}.card li{margin-bottom:8px}
.card b{color:var(--ink);font-weight:600}
.card .eq{font:italic 16px Fraunces,Georgia,serif;color:var(--ink);padding:12px 16px;border-left:2px solid var(--acc);background:rgba(255,255,255,.06);border-radius:0 10px 10px 0;margin:12px 0}
.card table{width:100%;border-collapse:collapse;font-size:13px;color:var(--mute);margin:12px 0}
.card td,.card th{padding:8px 10px;border-bottom:1px solid var(--line-soft);text-align:left;font-weight:400}
.card.hero{background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;width:min(540px,90vw)}
.hero h2{margin-bottom:14px}
.hero h2 .lt{display:block;font:300 clamp(38px,5.5vw,72px)/1 Inter,sans-serif;letter-spacing:.04em;color:#18281e}
.hero h2 b{display:block;font:800 clamp(44px,6.8vw,86px)/.95 Fraunces,Georgia,serif;letter-spacing:-.02em;color:#122418}
.hero p{color:#24362a;font-size:17px;line-height:1.6}
.hero .k{color:#8a5a12}
.rule{display:flex;align-items:center;gap:12px;margin:0 0 16px;font:500 12px Inter,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#24362a}.rule i{width:56px;height:1px;background:currentColor}
[data-m=tl] .rule{color:#e8d2a6}
.leafimg{position:relative;height:148px;margin:0 0 18px;background-size:cover;background-position:center;border-radius:6px 54px 6px 54px;cursor:zoom-in;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 12px 30px rgba(0,0,0,.35);transition:transform .4s ease,box-shadow .4s ease}
.card.l .leafimg{border-radius:54px 6px 54px 6px}
.leafimg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.12) 0%,rgba(0,0,0,0) 45%,rgba(0,18,10,.5) 100%);pointer-events:none}
.leafimg:hover{transform:scale(1.02);box-shadow:inset 0 0 0 1px var(--acc),0 18px 40px rgba(0,0,0,.5)}
.leafimg .zoom-pill{position:absolute;bottom:10px;right:12px;z-index:2;font:600 9px Inter,sans-serif;letter-spacing:.15em;text-transform:uppercase;padding:4px 8px;border-radius:99px;background:rgba(8,18,12,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--ink);border:1px solid rgba(255,255,255,.2);opacity:0;transform:translateY(4px);transition:.25s}
.leafimg:hover .zoom-pill{opacity:1;transform:none}
#wm{position:fixed;left:2.5vw;bottom:0;z-index:0;font:900 clamp(80px,18vh,185px)/.8 Fraunces,Georgia,serif;letter-spacing:.03em;color:rgba(18,45,26,.06);writing-mode:vertical-rl;transform:rotate(180deg);pointer-events:none;user-select:none;transition:color .5s,transform .4s ease-out}
[data-m=tl] #wm{color:rgba(255,170,90,.08)}
#bar{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:calc(18px + env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center}
#q{width:140px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--glass-card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--ink);font:13px Inter,sans-serif;outline:none;transition:width .3s}
#q:focus{width:200px}#q::placeholder{color:var(--mute)}
#modes{display:flex;gap:2px;padding:3px;border-radius:99px;background:var(--glass-card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line)}
#modes button{border:0;background:none;color:var(--mute);font:600 11px Inter,sans-serif;letter-spacing:.06em;padding:5px 12px;border-radius:99px;cursor:pointer;transition:.25s}
#modes button.on{background:var(--acc);color:#101a12}
#side{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));writing-mode:vertical-rl;font:600 9px Inter,sans-serif;letter-spacing:.32em;text-transform:uppercase;color:#f4f1ea;text-shadow:0 1px 6px rgba(0,0,0,.5)}
#foot{position:fixed;left:5vw;bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:18px;font:500 12px Inter,sans-serif;letter-spacing:.16em;color:#f4f1ea;text-shadow:0 1px 6px rgba(0,0,0,.5)}
#foot button{display:flex;gap:8px;align-items:center;background:none;border:0;color:inherit;font:inherit;letter-spacing:.14em;cursor:pointer;text-transform:uppercase;padding:4px 6px;border-radius:6px;transition:background .2s}
#foot button:hover{background:rgba(255,255,255,.12)}
.key-hint{display:inline-flex;gap:4px;align-items:center;opacity:.65;font-size:11px}
.key-hint kbd{display:inline-block;padding:1px 5px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:4px;font:600 10px monospace}
#load{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:#dfe7e4;color:#18281e;font:500 15px Fraunces,Georgia,serif;letter-spacing:.14em;transition:opacity .8s}
#load.x{opacity:0;pointer-events:none}
#lightbox{position:fixed;inset:0;z-index:100;background:rgba(4,14,8,.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .35s;padding:24px}
#lightbox.on{opacity:1;pointer-events:auto}
#lightbox-img{max-width:min(920px,88vw);max-height:76vh;border-radius:12px;border:1px solid var(--line);box-shadow:0 30px 90px rgba(0,0,0,.6);object-fit:cover}
#lightbox-cap{margin-top:14px;text-align:center;font:500 12px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
#lightbox-close{position:absolute;top:24px;right:28px;background:none;border:1px solid var(--line);color:var(--ink);width:38px;height:38px;border-radius:50%;cursor:pointer;display:grid;place-items:center;font-size:18px;transition:.25s}
#lightbox-close:hover{background:var(--acc);color:#0a160d}
[data-m=tl]{--acc:#ff9a2e;--glass-card:linear-gradient(148deg,rgba(32,15,40,.84),rgba(16,8,22,.92))}
[data-m=tl] #brand,[data-m=tl] #hint{color:#f2d9a0}
[data-m=tl] .hero h2 .lt{color:#fff2d6}[data-m=tl] .hero h2 b{color:#ffe4b5}
[data-m=tl] .hero p{color:#e8d2a6}[data-m=tl] .hero .k{color:var(--acc)}
[data-m=autumn]{--acc:#f2a73b}
[data-m=spring]{--acc:#88e060}
@media(max-width:760px){.card{left:4vw!important;right:4vw!important;width:auto;top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-height:46vh;transform:translateY(24px);padding:22px}.card.on{transform:none}.card.hero{top:18vh;bottom:auto}#rail,#foot,#side,#wm{display:none}#menu{left:4vw}#bar{left:4vw;right:4vw;top:calc(44px + env(safe-area-inset-top,0px));justify-content:space-between}#q{width:110px}#modes button{padding:5px 8px;font-size:11px}}
</style></head>
<body>
<canvas id="cv"></canvas>
<div id="track"></div>
<div id="wm" aria-hidden="true">NATURE</div>
<div id="brand"><button id="burger" aria-label="Menu" aria-expanded="false"><i></i><i></i><i></i></button><span>Arbor <b>Study Tree</b></span></div>
<div id="menu"></div>
<div id="bar"><input id="q" type="search" placeholder="Search notes" aria-label="Search notes"><div id="modes"></div></div>
<div id="load">Growing the tree…</div>
<div id="rail"></div>
<div id="cards"></div>
<div id="hint">Scroll to climb</div>
<div id="side">Follow the branches</div>
<div id="foot"><button id="share" aria-label="Share"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.6l6.8-4M8.6 13.4l6.8 4"/></svg>Share</button><button id="audio-btn" aria-label="Toggle ambient chimes"><svg id="audio-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M23 9l-6 6M17 9l6 6"/></svg><span id="audio-txt">Sound</span></button><span class="key-hint"><kbd>↓</kbd><kbd>↑</kbd> Climb</span><span id="cnt">01 / 08</span></div>
<div id="lightbox" aria-hidden="true" role="dialog"><button id="lightbox-close" aria-label="Close modal">✕</button><div style="text-align:center"><img id="lightbox-img" src="" alt="Botanical Photography Plate"><div id="lightbox-cap"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/babylonjs@7.30.0/babylon.js"></script>
<script>
/* ===== EDIT HERE: each note's `h` accepts any HTML (lists, tables, images, formulas) ===== */
const NOTES=[
{k:"Note 01",t:"Photosynthesis",h:'<p>Plants turn light energy into chemical energy stored as glucose.</p><p class="eq">6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂</p><ul><li><b>Light reactions</b> — thylakoids; make ATP and NADPH</li><li><b>Calvin cycle</b> — stroma; fixes CO₂ into sugar</li></ul>'},
{k:"Note 02",t:"Cellular Respiration",h:'<p>Cells release the energy in glucose as ATP.</p><table><tr><th>Stage</th><th>Where</th><th>ATP</th></tr><tr><td>Glycolysis</td><td>Cytoplasm</td><td>2</td></tr><tr><td>Krebs cycle</td><td>Matrix</td><td>2</td></tr><tr><td>Electron transport</td><td>Inner membrane</td><td>~28</td></tr></table>'},
{k:"Note 03",t:"DNA Replication",h:'<p>Semi-conservative: each new molecule keeps one original strand.</p><ul><li><b>Helicase</b> unwinds the double helix</li><li><b>Primase</b> lays down RNA primers</li><li><b>DNA polymerase III</b> extends the new strand 5’→3’</li><li><b>Ligase</b> seals Okazaki fragments</li></ul>'},
{k:"Note 04",t:"Natural Selection",h:'<p>Heritable variation plus differential survival changes populations over time.</p><ul><li>Variation exists within a population</li><li>Some traits improve survival and reproduction</li><li>Those traits become more common</li></ul>'},
{k:"Note 05",t:"Ecosystem Energy Flow",h:'<p>Energy moves one way; nutrients cycle.</p><p class="eq">Only ≈10% of energy passes to the next trophic level.</p><p>Producers → primary consumers → secondary consumers → decomposers.</p>'},
{k:"Note 06",t:"Homeostasis",h:'<p>Maintaining stable internal conditions through negative feedback.</p><ul><li><b>Sensor</b> detects a change</li><li><b>Control centre</b> compares to the set point</li><li><b>Effector</b> reverses the change</li></ul>'}
];
const CARDS=[{k:"Study tree",t:"Climb the tree.",h:"<p>Every branch holds a note. Scroll to travel from the roots to the canopy, one branch at a time.</p>"},...NOTES,{k:"Canopy",t:"All branches visited.",h:"<p>Scroll back up to revisit any branch, or use the dots on the right.</p>"}];

const B=BABYLON,V=B.Vector3,cv=document.getElementById("cv");
const R=(()=>{let a=11;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}})();
const LOW=/Mobi|Android/i.test(navigator.userAgent)||(navigator.hardwareConcurrency||8)<=4||(navigator.deviceMemory||8)<=4,RM=matchMedia("(prefers-reduced-motion:reduce)").matches,LEAFN=LOW?5:10;
const eng=new B.Engine(cv,false,{powerPreference:"high-performance",stencil:false}),sc=new B.Scene(eng);
const BASE=1/Math.min(devicePixelRatio||1,LOW?1.25:1.75);let lvl=BASE,groundM;eng.setHardwareScalingLevel(lvl);eng.enableOfflineSupport=false;sc.skipPointerMovePicking=true;sc.autoClear=false;
sc.performancePriority=B.ScenePerformancePriority.Intermediate;
const FOG=new B.Color3(.875,.906,.894);
sc.clearColor=B.Color4.FromColor3(FOG);sc.fogMode=B.Scene.FOGMODE_EXP2;sc.fogDensity=.012;sc.fogColor=FOG;
const cam=new B.FreeCamera("c",new V(0,6,19),sc);cam.minZ=.1;cam.maxZ=600;cam.fov=.8;cam.inputs.clear();

/* lighting — low-angle golden sun peeking through canopy */
const SUN_DIR=new V(-.68,-.56,-.48).normalize();
const hemi=new B.HemisphericLight("h",new V(0,1,0),sc);hemi.intensity=.78;hemi.diffuse=new B.Color3(.86,.93,1);hemi.groundColor=new B.Color3(.24,.22,.16);
const sun=new B.DirectionalLight("s",SUN_DIR,sc);sun.position=SUN_DIR.scale(-26);sun.intensity=1.22;sun.diffuse=new B.Color3(1,.92,.76);
const sg=new B.ShadowGenerator(LOW?1024:2048,sun);sg.usePercentageCloserFiltering=true;sg.filteringQuality=LOW?B.ShadowGenerator.QUALITY_LOW:B.ShadowGenerator.QUALITY_MEDIUM;sg.bias=.0008;

/* sky */
const skyT=(()=>{const t=new B.DynamicTexture("sk",{width:512,height:256},sc,true),c=t.getContext(),g=c.createLinearGradient(0,0,0,256);
g.addColorStop(0,"#4f86c0");g.addColorStop(.42,"#b9d3e6");g.addColorStop(.5,"#dfe7e4");g.addColorStop(1,"#dfe7e4");c.fillStyle=g;c.fillRect(0,0,8,256);t.update();
const m=new B.StandardMaterial("skm",sc);m.disableLighting=true;m.emissiveTexture=t;m.backFaceCulling=false;m.fogEnabled=false;
const s=B.MeshBuilder.CreateSphere("sky",{diameter:500,segments:16,sideOrientation:B.Mesh.BACKSIDE},sc);s.material=m;s.infiniteDistance=true;return t})();

/* ground */
(()=>{const t=new B.DynamicTexture("gt",{width:512,height:512},sc,true),c=t.getContext();c.fillStyle="#52703c";c.fillRect(0,0,512,512);
for(let i=0;i<9000;i++){const v=R();c.fillStyle=v<.5?`rgba(30,50,20,${.1+R()*.2})`:`rgba(150,170,90,${.08+R()*.15})`;c.fillRect(R()*512,R()*512,1+R()*2,2+R()*4)}t.update();
t.uScale=t.vScale=16;const m=groundM=new B.StandardMaterial("gm",sc);m.diffuseTexture=t;m.specularColor=B.Color3.Black();
const g=B.MeshBuilder.CreateDisc("g",{radius:70,tessellation:64},sc);g.rotation.x=Math.PI/2;g.material=m;g.receiveShadows=true})();
/* drifting cloud shadow dappling */
const cldShadowT=(()=>{const t=new B.DynamicTexture("cst",{width:512,height:512},sc,true),c=t.getContext();
c.fillStyle="#ffffff";c.fillRect(0,0,512,512);
for(let i=0;i<24;i++){const cx=R()*512,cy=R()*512,rad=55+R()*95;
for(const ox of[-512,0,512])for(const oy of[-512,0,512]){
const g=c.createRadialGradient(cx+ox,cy+oy,0,cx+ox,cy+oy,rad);
g.addColorStop(0,"rgba(110,130,115,.65)");g.addColorStop(.6,"rgba(175,190,175,.3)");g.addColorStop(1,"rgba(255,255,255,0)");
c.fillStyle=g;c.fillRect(cx+ox-rad,cy+oy-rad,rad*2,rad*2)}}t.update();
t.uScale=t.vScale=3.5;t.wrapU=t.wrapV=B.Texture.WRAP_ADDRESSMODE;return t})();
groundM.lightmapTexture=cldShadowT;groundM.useLightmapAsShadowmap=true;

/* bark + leaf materials */
const barkT=(()=>{const t=new B.DynamicTexture("bk",{width:512,height:512},sc,true),c=t.getContext();c.fillStyle="#4a3a2c";c.fillRect(0,0,512,512);
for(let i=0;i<1600;i++){const x=R()*512,w=1+R()*5,l=40+R()*220,y=R()*512,d=R()<.55;c.fillStyle=`rgba(${d?"20,14,10":"130,108,84"},${.08+R()*.22})`;c.fillRect(x,y,w,l)}t.update();t.uScale=2;t.vScale=3;return t})();
const barkM=new B.StandardMaterial("bm",sc);barkM.diffuseTexture=barkT;barkM.specularColor=new B.Color3(.04,.04,.04);

/* ambient micro-sound synthesis (Web Audio API) */
let audioOn=false,actx=null;
function chime(idx){
 if(!audioOn)return;
 try{
  if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
  if(actx.state==="suspended")actx.resume();
  const osc=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
  const freqs=[293.66,329.63,392.00,440.00,523.25,587.33,659.25,783.99];
  osc.frequency.setValueAtTime(freqs[idx%freqs.length]||440,t);
  osc.type="sine";
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(.045,t+.03);
  g.gain.exponentialRampToValueAtTime(.0001,t+.5);
  osc.connect(g);g.connect(actx.destination);
  osc.start(t);osc.stop(t+.52);
 }catch(e){}
}

 };
