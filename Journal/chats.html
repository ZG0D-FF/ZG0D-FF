<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dibyajyotee's Journal — Chats</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Josefin+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #f5f0e8;
  --warm: #c9a96e;
  --deep: #0d0a08;
  --muted: #8a7a6a;
  --rose: #d4a0a0;
  --glow: rgba(201, 169, 110, 0.15);
}
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Cormorant Garamond', serif;
  background: radial-gradient(circle at center, #1a1510 0%, var(--deep) 100%);
  color: var(--cream);
  min-height: 100vh;
  overflow: hidden; /* Hide main scroll, use horizontal canvas */
}

/* ── CINEMATIC VIGNETTE ── */
body::after {
  content: "";
  position: fixed; inset: 0;
  background: radial-gradient(circle, transparent 40%, rgba(13,10,8,0.8) 120%);
  pointer-events: none; z-index: 50;
}

/* ── AUTH OVERLAY ── */
#auth-overlay {
  position:fixed; inset:0; z-index:1000;
  display:flex; align-items:center; justify-content:center;
  background: rgba(13,10,8,0.9);
  backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  transition: opacity 0.8s ease, visibility 0.8s ease;
}
#auth-overlay.hidden { opacity:0; visibility:hidden; pointer-events:none; }
.auth-box { text-align:center; max-width:340px; width:90%; position: relative; z-index: 2; }
.auth-box h2 { font-weight:300; font-size:2rem; letter-spacing:0.15em; color:var(--warm); margin-bottom:0.2em; }
.auth-box p { font-size:1rem; color:var(--muted); margin-bottom:2.5em; font-style:italic; }
.auth-box input {
  width:100%; padding:1em; background:rgba(255,255,255,0.03);
  border: 1px solid rgba(201,169,110,0.2); border-radius:6px;
  color:var(--cream); font-family:'Josefin Sans', sans-serif; font-size:0.9rem;
  letter-spacing:0.08em; outline:none; transition: all 0.4s ease;
}
.auth-box input:focus { border-color:var(--warm); box-shadow: 0 0 15px var(--glow); background:rgba(255,255,255,0.06); }
.auth-box input::placeholder { color:var(--muted); opacity:0.5; }
.auth-box button {
  margin-top:1.5em; padding:0.8em 3em; background:transparent;
  border: 1px solid var(--warm); color:var(--warm);
  font-family:'Josefin Sans', sans-serif; font-size:0.85rem; letter-spacing:0.2em;
  text-transform:uppercase; cursor:pointer; border-radius:4px;
  transition: all 0.4s ease;
}
.auth-box button:hover { background:var(--warm); color:var(--deep); box-shadow: 0 0 20px var(--glow); }
.auth-box button:disabled { opacity:0.4; cursor:not-allowed; }
#auth-error { color:var(--rose); font-size:0.85rem; margin-top:1em; min-height:1.2em; font-family:'Josefin Sans', sans-serif; }

/* ── MAIN CONTENT ── */
#app { opacity:0; transition:opacity 1.2s ease; height: 100vh; display: flex; flex-direction: column; }
#app.visible { opacity:1; }

.header-area { padding: 3em 2em 1em; text-align: center; position: relative; z-index: 10; }
.page-title { font-weight:300; font-size:2.8rem; letter-spacing:0.2em; color:var(--warm); margin-bottom:0.1em; text-shadow: 0 0 20px rgba(201,169,110,0.2); }
.page-subtitle { font-style:italic; color:var(--muted); font-size:1.1rem; letter-spacing:0.08em; margin-bottom: 0.6em; }
.viewer-badge { font-family:'Josefin Sans',sans-serif; font-size:0.65rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--warm); opacity:0.75; margin-bottom:2.2em; }

/* ── TABS ── */
.tabs { display:flex; flex-wrap:wrap; justify-content:center; gap:0.8em; margin-bottom: 1em; }
.tab-btn {
  padding:0.6em 1.5em; background:rgba(255,255,255,0.02);
  border: 1px solid rgba(201,169,110,0.15); color:var(--muted);
  font-family:'Josefin Sans', sans-serif; font-size:0.75rem; letter-spacing:0.15em;
  text-transform:uppercase; cursor:pointer; border-radius:30px; transition:all 0.4s ease;
}
.tab-btn:hover, .tab-btn.active { border-color:var(--warm); color:var(--cream); box-shadow: 0 0 15px var(--glow); }
.tab-btn.active { background:rgba(201,169,110,0.1); }

/* ── HORIZONTAL FLOATING CANVAS ── */
.canvas-wrapper {
  flex: 1; display: flex; align-items: center; width: 100vw;
  overflow-x: auto; overflow-y: hidden; padding: 0 5vw;
  scrollbar-width: thin; scrollbar-color: var(--warm) transparent;
}
.canvas-wrapper::-webkit-scrollbar { height: 6px; }
.canvas-wrapper::-webkit-scrollbar-thumb { background: rgba(201,169,110,0.3); border-radius: 10px; }

.cards-track { display: flex; gap: 4vw; padding: 2em 0; align-items: center; }

/* ── MEMORY CARD (SCRAPBOOK AESTHETIC) ── */
.card-wrapper {
  perspective: 1000px;
  animation: float 6s ease-in-out infinite;
}
.card-wrapper:nth-child(even) { animation-delay: -3s; }
.card-wrapper:nth-child(3n) { animation-delay: -1.5s; }

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

.memory-card {
  width: 360px; height: 50vh; min-height: 400px;
  background: rgba(18, 14, 11, 0.45);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(201, 169, 110, 0.2);
  border-radius: 8px; padding: 2em; overflow: hidden;
  box-shadow: 0 15px 35px rgba(0,0,0,0.6);
  cursor: pointer; position: relative;
  transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
}

/* Organic Rotations */
.card-wrapper:nth-child(odd) .memory-card { transform: rotate(-1.5deg); }
.card-wrapper:nth-child(even) .memory-card { transform: rotate(2deg); }
.card-wrapper:nth-child(3n) .memory-card { transform: rotate(-0.5deg); }

.card-wrapper:hover .memory-card {
  transform: translateY(-10px) rotate(0deg) scale(1.03);
  border-color: rgba(201, 169, 110, 0.6);
  box-shadow: 0 25px 50px rgba(0,0,0,0.8), 0 0 30px rgba(201, 169, 110, 0.15);
}

/* ── CARD INTERNALS ── */
.card-content-fade {
  position: absolute; bottom: 0; left: 0; right: 0; height: 120px;
  background: linear-gradient(to bottom, transparent, rgba(18,14,11,1));
  pointer-events: none;
}
.card-meta { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5em; padding-bottom:1em; border-bottom:1px solid rgba(201,169,110,0.15); }
.card-category { font-family:'Josefin Sans', sans-serif; font-size:0.65rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--warm); opacity:0.9; }
.card-date { font-family:'Josefin Sans', sans-serif; font-size:0.65rem; letter-spacing:0.1em; color:var(--muted); }
.card-participants { font-family:'Josefin Sans', sans-serif; font-size:0.6rem; letter-spacing:0.15em; text-transform:uppercase; color:var(--muted); margin-bottom:1.5em; opacity:0.8; }

/* ── CHAT STYLING (Cinematic) ── */
.chat-line { margin-bottom: 1.2em; position: relative; }
.chat-speaker {
  font-family: 'Josefin Sans', sans-serif; font-size: 0.65rem; letter-spacing: 0.15em;
  text-transform: uppercase; margin-bottom: 0.4em; display: inline-block;
  border-bottom: 1px solid; padding-bottom: 0.2em;
}
.speaker-a .chat-speaker { color: var(--warm); border-color: rgba(201,169,110,0.3); }
.speaker-b .chat-speaker { color: var(--rose); border-color: rgba(212,160,160,0.3); }
.chat-text { font-size: 1.1rem; line-height: 1.6; color: rgba(245,240,232,0.9); font-weight: 300; }

/* ── EXPANDED MODAL ── */
#card-modal {
  position: fixed; inset: 0; z-index: 2000;
  background: rgba(8, 6, 5, 0.85); backdrop-filter: blur(20px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; visibility: hidden; transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
}
#card-modal.active { opacity: 1; visibility: visible; }
.modal-content-box {
  width: 90%; max-width: 650px; height: 80vh;
  background: #120e0b; border: 1px solid rgba(201,169,110,0.3);
  border-radius: 12px; padding: 3em 4em; overflow-y: auto;
  box-shadow: 0 30px 60px rgba(0,0,0,0.9);
  transform: translateY(40px) scale(0.95); transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
  scrollbar-width: thin; scrollbar-color: var(--warm) transparent;
}
#card-modal.active .modal-content-box { transform: translateY(0) scale(1); }
.close-modal {
  position: fixed; top: 2em; right: 3em; color: var(--muted);
  font-family: 'Josefin Sans'; font-size: 0.8rem; letter-spacing: 0.2em;
  text-transform: uppercase; cursor: pointer; transition: color 0.3s;
}
.close-modal:hover { color: var(--warm); }

.loading { text-align:center; padding:4em; color:var(--muted); font-style:italic; letter-spacing:0.1em; width: 100vw; }
.back-link { position:fixed; top:1.5em; left:2em; font-family:'Josefin Sans', sans-serif; font-size:0.75rem; letter-spacing:0.15em; text-transform:uppercase; color:var(--muted); text-decoration:none; transition:color 0.3s; z-index:100; }
.back-link:hover { color:var(--warm); text-shadow: 0 0 10px var(--glow); }

@media(max-width:768px) {
  .memory-card { width: 85vw; height: 60vh; }
  .cards-track { gap: 6vw; }
  .modal-content-box { padding: 2em; width: 95%; height: 85vh; }
}
</style>
</head>
<body>

<a href="index.html" class="back-link">← Journal</a>

<!-- AUTH OVERLAY -->
<div id="auth-overlay">
  <div class="auth-box">
    <h2>Private</h2>
    <p>these memories are kept under lock</p>
    <input type="email" id="auth-email" placeholder="email" autocomplete="email">
    <input type="password" id="auth-pass" placeholder="password" style="margin-top:.7em">
    <button id="auth-btn" onclick="handleLogin()">Unlock</button>
    <div id="auth-error"></div>
  </div>
</div>

<!-- MAIN -->
<div id="app">
  <div class="header-area">
    <h1 class="page-title">Conversations</h1>
    <p class="page-subtitle">fragments worth keeping</p>
    <p class="viewer-badge" id="viewer-badge"></p>
    <div class="tabs" id="tabs"></div>
  </div>
  
  <div class="canvas-wrapper">
    <div class="cards-track" id="cards-track">
      <div class="loading">authenticating…</div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div id="card-modal" onclick="closeModal(event)">
  <div class="close-modal">Close ✕</div>
  <div class="modal-content-box" id="modal-content" onclick="event.stopPropagation()"></div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
/* ============================================================
   1) SUPABASE CONFIG (Via Serverless Function)
   ============================================================ */
async function initSupabase() {
  const res = await fetch('/api/config');
  if (!res.ok) throw new Error('Could not load Supabase config from /api/config');
  const { supabaseUrl, supabaseAnonKey } = await res.json();
  if (!supabaseUrl || !supabaseAnonKey) {
    throw new Error('Supabase env vars missing — check VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY in Vercel');
  }
  return supabase.createClient(supabaseUrl, supabaseAnonKey);
}

let sb; 

/* ============================================================
   2) WHO'S WHO (Claude's strict logic)
   ============================================================ */
const OWNER_EMAIL = "zgodmr@gmail.com";

const prefixAliases = {
  adrija:    ["adrija", "evie"],
  shreyoshi: ["shreyoshi", "shreoyshi"],
  prisha:    ["prisha", "horneett", "hornet"],
};

function resolveIdentity(user) {
  const email = (user.email || "").toLowerCase();
  if (email === OWNER_EMAIL) return "owner";

  const displayName = ((user.user_metadata && user.user_metadata.display_name) || "").toLowerCase();
  const prefix = email.split("@")[0];

  for (const [canon, aliases] of Object.entries(prefixAliases)) {
    if (displayName && aliases.some(a => displayName.includes(a))) return canon;
  }
  for (const [canon, aliases] of Object.entries(prefixAliases)) {
    if (aliases.some(a => prefix.includes(a))) return canon;
  }
  return null;
}

const ALL_CANON = ["owner", ...Object.keys(prefixAliases)];
const OWNER_ALIASES = ["dibyajyotee", "dibs", "dj"];

function canonicalOf(token) {
  const t = token.trim().toLowerCase();
  if (OWNER_ALIASES.some(a => t.includes(a))) return "owner";
  for (const [canon, aliases] of Object.entries(prefixAliases)) {
    if (aliases.some(a => t.includes(a))) return canon;
  }
  return null;
}

function canonicalParticipants(participantsStr) {
  const tokens = (participantsStr || "").split(/,|&|\band\b/i);
  const set = new Set();
  tokens.forEach(t => { const c = canonicalOf(t); if (c) set.add(c); });
  return set;
}

let currentIdentity = null; 

function canViewChat(chat, identity) {
  if (identity === "owner") return true;
  const people = canonicalParticipants(chat.participants);
  if (!people.has("owner") || !people.has(identity)) return false;
  const otherSisters = Object.keys(prefixAliases).filter(k => k !== identity);
  return !otherSisters.some(s => people.has(s));
}

/* ============================================================ */

let allChats = [];
const CATEGORIES = ['All','Poems & Deep Thoughts','Funny Banter','Food Debates','Wholesome','Shared Memories','Motivational'];

window.handleLogin = async function() {
  const email = document.getElementById('auth-email').value.trim();
  const pass = document.getElementById('auth-pass').value;
  const btn = document.getElementById('auth-btn');
  const errEl = document.getElementById('auth-error');
  errEl.textContent = '';

  if (!email || !pass) { errEl.textContent = 'enter credentials'; return; }
  if (!sb) { errEl.textContent = 'still connecting, try again in a sec'; return; }

  btn.disabled = true;
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  btn.disabled = false;

  if (error) { errEl.textContent = error.message; return; }

  currentIdentity = resolveIdentity(data.user);
  if (!currentIdentity) {
    errEl.textContent = "couldn't match this account to a known person";
    await sb.auth.signOut();
    return;
  }

  document.getElementById('auth-overlay').classList.add('hidden');
  document.getElementById('app').classList.add('visible');
  fetchChats();
};

// Bootstrap
(async () => {
  try {
    sb = await initSupabase();
  } catch (e) {
    document.getElementById('auth-error').textContent = e.message;
    return;
  }

  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    currentIdentity = resolveIdentity(session.user);
    if (currentIdentity) {
      document.getElementById('auth-overlay').classList.add('hidden');
      document.getElementById('app').classList.add('visible');
      fetchChats();
    }
  }
})();

async function fetchChats() {
  const { data, error } = await sb.from('chat_highlights').select('*').order('created_at',{ascending:true});
  if (error) { document.getElementById('cards-track').innerHTML = '<div class="loading">failed to load</div>'; return; }
  allChats = data.filter(chat => canViewChat(chat, currentIdentity));

  const badge = document.getElementById('viewer-badge');
  badge.textContent = currentIdentity === 'owner'
    ? 'viewing as dibyajyotee — all chats'
    : `viewing as ${currentIdentity} — your chats only`;

  buildTabs();
  renderCards('All');
}

function buildTabs() {
  const cont = document.getElementById('tabs');
  cont.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (cat === 'All' ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = () => {
      cont.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCards(cat);
    };
    cont.appendChild(btn);
  });
}

// Render into Floating Canvas
function renderCards(cat) {
  const track = document.getElementById('cards-track');
  const filtered = cat === 'All' ? allChats : allChats.filter(c => c.category === cat);
  
  if (!filtered.length) { 
    track.innerHTML = '<div class="loading">no memories here yet</div>'; 
    return; 
  }
  
  track.innerHTML = '';
  filtered.forEach(chat => {
    const wrapper = document.createElement('div');
    wrapper.className = 'card-wrapper';
    
    const card = document.createElement('div');
    card.className = 'memory-card';
    
    const msgs = (typeof chat.content_json === 'string' ? JSON.parse(chat.content_json) : chat.content_json) || [];
    const speakers = [...new Set(msgs.map(m => m.speaker))];
    let linesHTML = '';
    
    msgs.forEach(m => {
      const cls = speakers.indexOf(m.speaker) === 0 ? 'speaker-a' : 'speaker-b';
      linesHTML += `<div class="chat-line ${cls}"><span class="chat-speaker">${esc(m.speaker)}</span><div class="chat-text">${esc(m.text)}</div></div>`;
    });

    const innerHTML = `
      <div class="card-meta">
        <span class="card-category">${esc(chat.category)}</span>
        <span class="card-date">${esc(chat.date)}</span>
      </div>
      <div class="card-participants">${esc(chat.participants)}</div>
      ${linesHTML}
    `;
    
    card.innerHTML = innerHTML + `<div class="card-content-fade"></div>`;
    
    card.onclick = () => {
      const modal = document.getElementById('card-modal');
      const content = document.getElementById('modal-content');
      content.innerHTML = innerHTML;
      modal.classList.add('active');
    };

    wrapper.appendChild(card);
    track.appendChild(wrapper);
  });
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

window.closeModal = function(e) { document.getElementById('card-modal').classList.remove('active'); }

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
document.getElementById('auth-pass').addEventListener('keydown', e => { if (e.key === 'Enter') window.handleLogin(); });
</script>
</body>
</html>
