<script>
(function initUniversalStore() {
  const host = window.location.hostname;
  let prefix = 'jarvis_prod_';
  if (!host || host === 'localhost' || host === '127.0.0.1' || host.startsWith('192.168.') || window.location.protocol === 'file:') {
    prefix = 'jarvis_dev_';
  } else if (host.includes('staging') || host.includes('preview') || host.includes('vercel.app')) {
    prefix = 'jarvis_staging_';
  }
  window.ENV_PREFIX = prefix;
  window.IDB_NAME = `${prefix}db`;
  window.store = {
    get: (k) => { try { return localStorage.getItem(`${prefix}${k}`); } catch(e) { return null; } },
    set: (k, v) => { try { localStorage.setItem(`${prefix}${k}`, v); } catch(e) {} },
    del: (k) => { try { localStorage.removeItem(`${prefix}${k}`); } catch(e) {} },
    sessionGet: (k) => { try { return sessionStorage.getItem(`${prefix}${k}`); } catch(e) { return null; } },
    sessionSet: (k, v) => { try { sessionStorage.setItem(`${prefix}${k}`, v); } catch(e) {} },
    sessionDel: (k) => { try { sessionStorage.removeItem(`${prefix}${k}`); } catch(e) {} }
  };
})();
</script>

window.addEventListener('unhandledrejection', (event) => {

});

            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                action: "log_error",
                errorMessage: String(errMessage),
                errorSource: source,
                url: window.location.href,
                userAgent: navigator.userAgent
            })
        });
    } catch (e) {
        console.warn("Failed to log error to backend");
    }
}

// Photorealistic 3D Planet Compositor (Real NASA Earth Clouds + Atmospheric Shaders)
const planetCanvas = document.createElement('canvas');
planetCanvas.width = 900;
planetCanvas.height = 900;

function renderPlanetShader(earthImg) {
  const pctx = planetCanvas.getContext('2d');
  const cx = 480, cy = 480, r = 390;
  pctx.clearRect(0, 0, 900, 900);

  // 1. Outer atmospheric cyan halo
  const halo = pctx.createRadialGradient(cx, cy, r * 0.94, cx, cy, r * 1.16);
  halo.addColorStop(0, 'rgba(60, 210, 255, 0.55)');
  halo.addColorStop(0.35, 'rgba(0, 120, 195, 0.18)');
  halo.addColorStop(1, 'rgba(0, 0, 0, 0)');
  pctx.fillStyle = halo;
  pctx.beginPath(); pctx.arc(cx, cy, r * 1.16, 0, Math.PI * 2); pctx.fill();

  pctx.save();
  pctx.beginPath(); pctx.arc(cx, cy, r, 0, Math.PI * 2); pctx.clip();

  // 2. Deep ocean base
  const base = pctx.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.05, cx, cy, r * 1.05);
  base.addColorStop(0, '#164b70');
  base.addColorStop(0.45, '#071f36');
  base.addColorStop(0.8, '#020a14');
  base.addColorStop(1, '#000307');
  pctx.fillStyle = base;
  pctx.fillRect(0, 0, 900, 900);

  // 3. Real Satellite Cloud/Terrain Texture (or high-res procedural cloud bands)
  if (earthImg) {
    pctx.save();
    pctx.globalCompositeOperation = 'screen';
    pctx.filter = 'grayscale(100%) contrast(155%) brightness(95%)';
    pctx.globalAlpha = 0.65;
    pctx.drawImage(earthImg, cx - r, cy - r, r * 2, r * 2);
    pctx.restore();

    // Colorize clouds to icy cyan
    pctx.save();
    pctx.globalCompositeOperation = 'color';
    pctx.fillStyle = '#38bdf8';
    pctx.fillRect(0, 0, 900, 900);
    pctx.restore();
  } else {
    for (let i = 0; i < 900; i++) {
      const a = Math.PI * 0.6 + Math.random() * Math.PI * 0.95;
      const d = r * (0.3 + Math.pow(Math.random(), 0.5) * 0.69);
      const x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d;
      const w = 18 + Math.random() * 65, h = 2 + Math.random() * 10;
      const alpha = (0.03 + Math.random() * 0.09) * Math.pow(d / r, 2.2);
      pctx.save();
      pctx.translate(x, y);
      pctx.rotate(a + Math.PI / 2 + (Math.random() - 0.5) * 0.25);
      const cg = pctx.createRadialGradient(0, 0, 1, 0, 0, w);
      cg.addColorStop(0, `rgba(195, 240, 255, ${alpha})`);
      cg.addColorStop(0.5, `rgba(40, 150, 210, ${alpha * 0.5})`);
      cg.addColorStop(1, 'rgba(0,0,0,0)');
      pctx.fillStyle = cg;
      pctx.beginPath(); pctx.ellipse(0, 0, w, h, 0, 0, Math.PI * 2); pctx.fill();
      pctx.restore();
    }
  }

  // 4. Inner Rayleigh atmospheric rim light
  const innerRim = pctx.createRadialGradient(cx + r * 0.06, cy + r * 0.06, r * 0.74, cx, cy, r);
  innerRim.addColorStop(0, 'rgba(0, 0, 0, 0)');
  innerRim.addColorStop(0.82, 'rgba(0, 155, 230, 0.16)');
  innerRim.addColorStop(0.95, 'rgba(110, 225, 255, 0.52)');
  innerRim.addColorStop(1, 'rgba(225, 250, 255, 0.92)');
  pctx.fillStyle = innerRim;
  pctx.fillRect(0, 0, 900, 900);

  // 5. Terminator night shadow (darkens lower-right core like Snap 5)
  const night = pctx.createLinearGradient(cx - r * 0.65, cy - r * 0.65, cx + r * 0.35, cy + r * 0.35);
  night.addColorStop(0, 'rgba(0, 0, 0, 0)');
  night.addColorStop(0.45, 'rgba(2, 8, 16, 0.45)');
  night.addColorStop(0.78, 'rgba(1, 5, 11, 0.92)');
  night.addColorStop(1, '#010409');
  pctx.fillStyle = night;
  pctx.fillRect(0, 0, 900, 900);
  pctx.restore();

  // 6. Specular atmospheric limb highlight
  pctx.save();
  pctx.strokeStyle = 'rgba(215, 248, 255, 0.92)';
  pctx.lineWidth = 2.2;
  pctx.shadowColor = '#38bdf8';
  pctx.shadowBlur = 22;
  pctx.beginPath(); pctx.arc(cx, cy, r - 0.5, Math.PI * 0.72, Math.PI * 1.45); pctx.stroke();
  pctx.restore();
}

function drawBg(t){
  const w = bgCanvas.width, h = bgCanvas.height;
  bctx.clearRect(0, 0, w, h);

  const isMobile = w <= 768;
  const isChat = document.getElementById('root').classList.contains('mode-chat') && !listening && !talking;

  if (isChat && !isMobile) {
    // SNAP 4: 3D Wireframe Wave on Right Side during Chat Mode
    bctx.save();
    for (let row = 0; row < 18; row++) {
      bctx.beginPath();
      bctx.strokeStyle = `rgba(0, 195, 255, ${0.04 + (row / 18) * 0.12})`;
      bctx.lineWidth = 1;
      for (let x = w * 0.58; x <= w; x += 6) {
        const nx = (x - w * 0.58) / (w * 0.42);
        const y = h * 0.52 + Math.sin(nx * 4.5 + t * 0.7 + row * 0.22) * 42 + (row - 9) * 5;
        x === w * 0.58 ? bctx.moveTo(x, y) : bctx.lineTo(x, y);
      }
      bctx.stroke();
    }
    bctx.restore();
  } else if (!talking && !listening) {
    // SNAP 1 & 5: Photorealistic 3D Planet Horizon
    bctx.save();
    const size = Math.max(w, h) * (isMobile ? 0.95 : 1.05);
    const dx = isMobile ? w * 0.08 : w * 0.46;
    const dy = isMobile ? h * 0.54 : h * 0.02;
    bctx.drawImage(planetCanvas, dx, dy, size, size);
    bctx.restore();
  }

  particles.forEach(p => {
    p.x = (p.x + p.vx + w) % w; p.y = (p.y + p.vy + h) % h;
    bctx.fillStyle = `rgba(0,212,255,${p.a})`;
    bctx.beginPath(); bctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); bctx.fill();
  });
}

function drawRing(t){
  syncUIState();
  const w = ringCanvas.width, h = ringCanvas.height, cx = w / 2, cy = h / 2;
  rctx.clearRect(0, 0, w, h);

  // SPEAKING MULTI-RIBBON 3D INTERFERENCE WAVEFORM
  if (talking) {
    const vGrad = rctx.createLinearGradient(cx, cy - 115, cx, cy + 115);
    vGrad.addColorStop(0, 'rgba(0, 212, 255, 0)');
    vGrad.addColorStop(0.5, 'rgba(0, 212, 255, 0.45)');
    vGrad.addColorStop(1, 'rgba(0, 212, 255, 0)');
    rctx.strokeStyle = vGrad;
    rctx.lineWidth = 1;
    rctx.beginPath(); rctx.moveTo(cx, cy - 115); rctx.lineTo(cx, cy + 115); rctx.stroke();

    const totalLines = 22;
    for (let i = 0; i < totalLines; i++) {
      const frac = i / (totalLines - 1);
      const offset = (frac - 0.5) * 2;
      rctx.beginPath();
      const isEdge = i === 0 || i === totalLines - 1 || i === Math.floor(totalLines / 2);
      rctx.strokeStyle = isEdge ? 'rgba(90, 230, 255, 0.75)' : 'rgba(0, 185, 255, 0.22)';
      rctx.lineWidth = isEdge ? 1.5 : 0.8;

      for (let x = 20; x <= w - 20; x += 4) {
        const nx = (x - 20) / (w - 40);
        const bell = Math.exp(-Math.pow((nx - 0.5) * 3.6, 2));
        const w1 = Math.sin(nx * 13 - t * 4.5 + offset * 1.6);
        const w2 = Math.cos(nx * 21 + t * 2.8 - offset * 2.1);
        const y = cy + (w1 * 56 + w2 * 28 * offset) * bell * Math.max(0.65, talkLevel);
        x === 20 ? rctx.moveTo(x, y) : rctx.lineTo(x, y);
      }
      rctx.stroke();
    }
    return;
  }

  // (Outer circles, crosshairs, and small glowing dots removed!)

  // LISTENING HORIZONTAL DUAL-CLUSTER SPECTROGRAM
  if (listening) {
    for (let side of [-1, 1]) {
      const hGrad = rctx.createLinearGradient(cx + side * 44, cy, cx + side * 285, cy);
      hGrad.addColorStop(0, 'rgba(0, 212, 255, 0.6)');
      hGrad.addColorStop(0.85, 'rgba(0, 212, 255, 0.25)');
      hGrad.addColorStop(1, 'rgba(0, 212, 255, 0)');
      rctx.strokeStyle = hGrad;
      rctx.lineWidth = 1;
      rctx.beginPath(); rctx.moveTo(cx + side * 44, cy); rctx.lineTo(cx + side * 285, cy); rctx.stroke();

      for (let d = 95; d <= 255; d += 3.5) {
        const pkt1 = Math.exp(-Math.pow((d - 135) / 18, 2));
        const pkt2 = Math.exp(-Math.pow((d - 195) / 22, 2)) * 0.85;
        const env = pkt1 + pkt2;
        if (env > 0.03) {
          const amp = env * (6 + 14 * (0.5 + 0.5 * Math.sin(t * 18 + d * 0.45)));
          const bx = cx + side * d;
          rctx.strokeStyle = `rgba(110, 230, 255, ${0.35 + env * 0.55})`;
          rctx.lineWidth = 1.4;
          rctx.beginPath(); rctx.moveTo(bx, cy - amp); rctx.lineTo(bx, cy + amp); rctx.stroke();
        }
      }
    }
  }
}

// --- AUDIO QUEUE ENGINE ---
let audioQueue = [];
let isAudioPlaying = false;
let currentAudioObj = null;

function stopJarvisAudio() {
    audioQueue = []; // Clear the queue so he doesn't keep talking after being interrupted
    if (currentAudioObj) {
        try {
            if (currentAudioObj.pause) currentAudioObj.pause(); // Stop HTML Audio
            if (currentAudioObj.stop) currentAudioObj.stop();   // Stop Web Audio API Buffer
        } catch(e) {}
    }
    isAudioPlaying = false;
    currentAudioObj = null;
}

async function playNextInAudioQueue() {
    if (audioQueue.length === 0) {
        isAudioPlaying = false;
        currentAudioObj = null;
        return;
    }
    isAudioPlaying = true;
    const nextItem = audioQueue.shift();

    try {
        if (nextItem.type === 'cache') {
            const audioObj = new Audio(nextItem.src);
            currentAudioObj = audioObj;
            audioObj.onended = playNextInAudioQueue;
            audioObj.play().catch(e => {
                console.warn("[JARVIS] Cache playback blocked.", e);
                playNextInAudioQueue();
            });
        } else if (nextItem.type === 'base64') {
            let audioCtx;
            try {
                // Safely try parent context (can throw CORS SecurityError if file:///)
                audioCtx = window.parent.jarvisAudioContext || window.jarvisAudioContext;
            } catch(e) {
                audioCtx = window.jarvisAudioContext;
            }
            if (!audioCtx) {
                audioCtx = window.jarvisAudioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') await audioCtx.resume();

            const binaryString = atob(nextItem.src);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }

            const audioBuffer = await audioCtx.decodeAudioData(bytes.buffer);
            const source = audioCtx.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(audioCtx.destination);
            source.onended = playNextInAudioQueue;
            currentAudioObj = source;
            source.start(0);
        }
    } catch(err) {
        console.error("[JARVIS] Audio queue playback error:", err);
        if (typeof logJarvisError === 'function') logJarvisError(err.message || String(err), "playNextInAudioQueue");
        playNextInAudioQueue();
    }
}
