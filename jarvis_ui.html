
<div id="root" style="width:100%;height:620px;background:transparent;border-radius:8px;position:relative;overflow:hidden;font-family:'Courier New',monospace;">
  <canvas id="bg" style="position:absolute;inset:0;width:100%;height:100%;"></canvas>
  <div id="ui" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">

    <div style="text-align:center;margin-bottom:18px;">
      <div id="status-text" style="color:#00d4ff;font-size:11px;letter-spacing:6px;margin-bottom:6px;opacity:0.8;">J.A.R.V.I.S. — ONLINE</div>
      <div id="greeting" style="color:#fff;font-size:1.05rem;letter-spacing:2px;min-height:24px;"></div>
    </div>

    <div style="position:relative;width:220px;height:220px;margin-bottom:18px;">
      <canvas id="ring" style="position:absolute;inset:0;width:100%;height:100%;"></canvas>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <div id="mic-btn" style="width:64px;height:64px;border-radius:50%;background:#041824;border:1.5px solid #00d4ff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color 0.2s;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round">
            <rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </div>
        <div id="core-label" style="color:#00d4ff;font-size:9px;letter-spacing:3px;margin-top:8px;opacity:0.7;">SPEAK</div>
      </div>
    </div>

    <div id="response-box" style="width:90%;max-width:540px;min-height:52px;background:rgba(0,30,50,0.7);border:0.5px solid rgba(0,212,255,0.25);border-radius:6px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;">
      <div id="response-text" style="color:#a0e8ff;font-size:12px;letter-spacing:1px;line-height:1.7;width:100%;text-align:center;">Click the mic — or type below — to speak with J.A.R.V.I.S.</div>
    </div>

    <div style="display:flex;gap:8px;width:90%;max-width:540px;align-items:center;">
      <input id="cmd-input" type="text" placeholder="Enter command..." style="flex:1;background:rgba(0,20,35,0.8);border:0.5px solid rgba(0,212,255,0.3);border-radius:4px;padding:8px 12px;color:#00d4ff;font-family:'Courier New',monospace;font-size:12px;letter-spacing:1px;outline:none;" />
      <button id="send-btn" style="background:rgba(0,50,80,0.9);border:0.5px solid #00d4ff;border-radius:4px;padding:8px 14px;color:#00d4ff;font-family:'Courier New',monospace;font-size:11px;letter-spacing:2px;cursor:pointer;">SEND</button>
    </div>

    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center;width:90%;max-width:540px;">
      <button class="quick-btn" data-q="What's my system status?" style="background:rgba(0,30,50,0.7);border:0.5px solid rgba(0,212,255,0.2);border-radius:4px;padding:5px 10px;color:rgba(0,212,255,0.7);font-size:10px;letter-spacing:1px;cursor:pointer;font-family:'Courier New',monospace;">SYSTEM STATUS</button>
      <button class="quick-btn" data-q="Run a security scan." style="background:rgba(0,30,50,0.7);border:0.5px solid rgba(0,212,255,0.2);border-radius:4px;padding:5px 10px;color:rgba(0,212,255,0.7);font-size:10px;letter-spacing:1px;cursor:pointer;font-family:'Courier New',monospace;">SECURITY SCAN</button>
      <button class="quick-btn" data-q="What's the weather like today?" style="background:rgba(0,30,50,0.7);border:0.5px solid rgba(0,212,255,0.2);border-radius:4px;padding:5px 10px;color:rgba(0,212,255,0.7);font-size:10px;letter-spacing:1px;cursor:pointer;font-family:'Courier New',monospace;">WEATHER</button>
      <button class="quick-btn" data-q="Tell me a joke, J.A.R.V.I.S." style="background:rgba(0,30,50,0.7);border:0.5px solid rgba(0,212,255,0.2);border-radius:4px;padding:5px 10px;color:rgba(0,212,255,0.7);font-size:10px;letter-spacing:1px;cursor:pointer;font-family:'Courier New',monospace;">HUMOUR</button>
    </div>

    <div style="position:absolute;top:14px;left:18px;display:flex;flex-direction:column;gap:5px;">
      <div style="color:rgba(0,212,255,0.4);font-size:9px;letter-spacing:2px;">CORE TEMP</div>
      <div id="temp" style="color:#00d4ff;font-size:13px;letter-spacing:1px;">--°C</div>
      <div style="color:rgba(0,212,255,0.4);font-size:9px;letter-spacing:2px;margin-top:4px;">POWER</div>
      <div id="power" style="color:#00d4ff;font-size:13px;letter-spacing:1px;">--%</div>
    </div>

    <div style="position:absolute;top:14px;right:18px;display:flex;flex-direction:column;align-items:flex-end;gap:5px;">
      <div style="color:rgba(0,212,255,0.4);font-size:9px;letter-spacing:2px;">UPTIME</div>
      <div id="uptime" style="color:#00d4ff;font-size:13px;letter-spacing:1px;">00:00:00</div>
      <div style="color:rgba(0,212,255,0.4);font-size:9px;letter-spacing:2px;margin-top:4px;">SHIELD</div>
      <div id="shield" style="color:#00d4ff;font-size:13px;letter-spacing:1px;">NOMINAL</div>
    </div>

    <div style="position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:24px;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:3px;">
        <div style="width:6px;height:6px;border-radius:50%;background:#00d4ff;" id="dot1"></div>
        <div style="color:rgba(0,212,255,0.4);font-size:8px;letter-spacing:1px;">NET</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:3px;">
        <div style="width:6px;height:6px;border-radius:50%;background:#00ff88;" id="dot2"></div>
        <div style="color:rgba(0,212,255,0.4);font-size:8px;letter-spacing:1px;">AI</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:3px;">
        <div style="width:6px;height:6px;border-radius:50%;background:#00d4ff;" id="dot3"></div>
        <div style="color:rgba(0,212,255,0.4);font-size:8px;letter-spacing:1px;">COMMS</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:3px;">
        <div style="width:6px;height:6px;border-radius:50%;background:#ffaa00;" id="dot4"></div>
        <div style="color:rgba(0,212,255,0.4);font-size:8px;letter-spacing:1px;">THREAT</div>
      </div>
    </div>
  </div>
</div>

<style>
#cmd-input::placeholder{color:rgba(0,212,255,0.3);}
#cmd-input:focus{border-color:rgba(0,212,255,0.7);}
.quick-btn:hover{background:rgba(0,60,90,0.9)!important;border-color:rgba(0,212,255,0.5)!important;}
#mic-btn:hover{border-color:#00ff88!important;}
#send-btn:hover{background:rgba(0,100,140,0.9)!important;}
</style>

<script>
const bgCanvas=document.getElementById('bg');
const bctx=bgCanvas.getContext('2d');
const ringCanvas=document.getElementById('ring');
const rctx=ringCanvas.getContext('2d');

function resize(){
  const root=document.getElementById('root');
  bgCanvas.width=root.clientWidth;
  bgCanvas.height=root.clientHeight;
}
resize();
ringCanvas.width=220;ringCanvas.height=220;

const particles=[];
for(let i=0;i<60;i++){
  particles.push({x:Math.random()*bgCanvas.width,y:Math.random()*bgCanvas.height,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,r:Math.random()*1.5+0.3,a:Math.random()*0.5+0.1});
}

let listening=false;
let talking=false;
let talkLevel=0;
let startTime=Date.now();
let angle=0;

function drawBg(t){
  const w=bgCanvas.width,h=bgCanvas.height;
  bctx.clearRect(0,0,w,h);
  //bctx.fillStyle='#020b14';
  //bctx.fillRect(0,0,w,h);
  const gridAlpha=0.06;
  bctx.strokeStyle=`rgba(0,212,255,${gridAlpha})`;
  bctx.lineWidth=0.5;
  const gapX=40,gapY=40;
  for(let x=0;x<w;x+=gapX){bctx.beginPath();bctx.moveTo(x,0);bctx.lineTo(x,h);bctx.stroke();}
  for(let y=0;y<h;y+=gapY){bctx.beginPath();bctx.moveTo(0,y);bctx.lineTo(w,y);bctx.stroke();}
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0)p.x=w;if(p.x>w)p.x=0;
    if(p.y<0)p.y=h;if(p.y>h)p.y=0;
    bctx.beginPath();
    bctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    bctx.fillStyle=`rgba(0,212,255,${p.a})`;
    bctx.fill();
  });
  const cx=w/2,cy=h/2;
  bctx.save();
  bctx.translate(cx,cy);
  bctx.strokeStyle='rgba(0,212,255,0.04)';
  bctx.lineWidth=0.5;
  [80,130,180,240,300].forEach(r=>{bctx.beginPath();bctx.arc(0,0,r,0,Math.PI*2);bctx.stroke();});
  bctx.restore();
}

function drawRing(t){
  const cx=110,cy=110,r=100;
  rctx.clearRect(0,0,220,220);

  rctx.strokeStyle='rgba(0,212,255,0.12)';
  rctx.lineWidth=1;
  rctx.beginPath();rctx.arc(cx,cy,r,0,Math.PI*2);rctx.stroke();

  rctx.strokeStyle='rgba(0,212,255,0.2)';
  rctx.lineWidth=1.5;
  rctx.beginPath();rctx.arc(cx,cy,88,0,Math.PI*2);rctx.stroke();

  const activeColor=listening?'rgba(0,255,136,0.9)':talking?'rgba(0,212,255,0.9)':'rgba(0,212,255,0.55)';
  rctx.strokeStyle=activeColor;
  rctx.lineWidth=2;
  const sweep=listening?Math.PI*2:talking?Math.PI*(1.2+Math.sin(t*8)*0.4):Math.PI*0.8;
  rctx.beginPath();
  rctx.arc(cx,cy,r,-Math.PI/2+angle,-Math.PI/2+angle+sweep);
  rctx.stroke();

  rctx.strokeStyle='rgba(0,212,255,0.4)';
  rctx.lineWidth=1;
  for(let i=0;i<36;i++){
    const a=i*(Math.PI*2/36)+angle*0.3;
    const len=i%3===0?10:5;
    const x1=cx+Math.cos(a)*(r+4);
    const y1=cy+Math.sin(a)*(r+4);
    const x2=cx+Math.cos(a)*(r+4+len);
    const y2=cy+Math.sin(a)*(r+4+len);
    rctx.beginPath();rctx.moveTo(x1,y1);rctx.lineTo(x2,y2);rctx.stroke();
  }

  if(listening||talking){
    const bars=12;
    const barR=68;
    for(let i=0;i<bars;i++){
      const a=(i/bars)*Math.PI*2+t*2;
      const amp=listening?0.4+Math.random()*0.6:talkLevel*(0.3+Math.sin(t*10+i)*0.3)+0.15;
      const bLen=amp*28;
      const x1=cx+Math.cos(a)*barR;
      const y1=cy+Math.sin(a)*barR;
      const x2=cx+Math.cos(a)*(barR-bLen);
      const y2=cy+Math.sin(a)*(barR-bLen);
      rctx.strokeStyle=listening?'rgba(0,255,136,0.7)':'rgba(0,212,255,0.7)';
      rctx.lineWidth=2;
      rctx.beginPath();rctx.moveTo(x1,y1);rctx.lineTo(x2,y2);rctx.stroke();
    }
  }

  const cross=talking?'rgba(0,212,255,0.15)':'rgba(0,212,255,0.07)';
  rctx.strokeStyle=cross;rctx.lineWidth=0.5;
  rctx.beginPath();rctx.moveTo(cx-r,cy);rctx.lineTo(cx+r,cy);rctx.stroke();
  rctx.beginPath();rctx.moveTo(cx,cy-r);rctx.lineTo(cx,cy+r);rctx.stroke();
}
let typingInterval;

function typeText(el,text,speed){
  el.textContent='';
  let i=0;
  const iv=setInterval(()=>{
    if(i<text.length){el.textContent+=text[i];i++;}
    else clearInterval(iv);
  },speed||28);
}

const greetings=['GOOD DAY, SIR.','ALL SYSTEMS NOMINAL.','HOW MAY I ASSIST?','STANDING BY.','READY FOR ORDERS, SIR.'];
let gIdx=0;
function cycleGreeting(){
  typeText(document.getElementById('greeting'),greetings[gIdx%greetings.length],60);
  gIdx++;
}
cycleGreeting();
setInterval(cycleGreeting,6000);

function updateStats(t){
  const temp=Math.round(72+Math.sin(t*0.3)*4);
  const power=Math.round(87+Math.sin(t*0.5)*5);
  document.getElementById('temp').textContent=temp+'°C';
  document.getElementById('power').textContent=power+'%';
  const elapsed=Math.floor((Date.now()-startTime)/1000);
  const h=String(Math.floor(elapsed/3600)).padStart(2,'0');
  const m=String(Math.floor((elapsed%3600)/60)).padStart(2,'0');
  const s=String(elapsed%60).padStart(2,'0');
  document.getElementById('uptime').textContent=`${h}:${m}:${s}`;
  [1,2,3,4].forEach(i=>{
    const d=document.getElementById('dot'+i);
    if(Math.random()<0.04) d.style.opacity=d.style.opacity==='0.3'?'1':'0.3';
  });
}

let raf;
function loop(){
  const t=(Date.now()-startTime)/1000;
  angle+=0.012;
  drawBg(t);
  drawRing(t);
  updateStats(t);
  raf=requestAnimationFrame(loop);
}
loop();

// --- JARVIS THINKING ENGINE ---
async function query(userText) {
  const box = document.getElementById('response-text');
  talking = true; 
  talkLevel = 0.5;
  box.style.color = 'rgba(0,212,255,0.5)';
  box.textContent = 'Relaying through soft-thunder-2965...';

  try {
    const PROXY_URL = "https://soft-thunder-2965.zgodmr.workers.dev";

    // Ensure this line uses 'const res ='
    const res = await fetch(PROXY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userText: userText })
    });

    const data = await res.json();
    console.log("JARVIS DEBUG:", data); // Check console for the response

    const reply = data.choices && data.choices[0] && data.choices[0].message.content 
                  ? data.choices[0].message.content 
                  : 'Systems report: Neural relay timeout, sir.';

    box.style.color = '#a0e8ff';
    typeText(box, reply, 22);
    talkLevel = 0.8;

    setTimeout(() => { 
      talking = false; 
      talkLevel = 0; 
    }, reply.length * 22 + 800);

  } catch(e) {
    box.style.color = 'rgba(255,100,100,0.9)';
    box.textContent = 'Comms array offline. Worker unreachable, sir.';
    talking = false; 
    talkLevel = 0;
  }
}

// Handle the 'SEND' button click
document.getElementById('send-btn').addEventListener('click', () => {
  const inp = document.getElementById('cmd-input');
  const val = inp.value.trim();
  if (val) {
    inp.value = '';
    query(val);
  }
});

// Handle the 'Enter' key press
document.getElementById('cmd-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const val = e.target.value.trim();
    if (val) {
      e.target.value = '';
      query(val);
    }
  }
});

// Handle Quick-Action buttons
document.querySelectorAll('.quick-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    query(btn.dataset.q);
  });
});
document.getElementById('mic-btn').addEventListener('click',()=>{
  if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){
    const box=document.getElementById('response-text');
    box.style.color='rgba(255,180,0,0.9)';
    box.textContent='Voice interface unavailable in this environment, sir. Please use the text input below.';
    return;
  }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const recog=new SR();
  recog.lang='en-US';recog.interimResults=false;
  listening=true;
  document.getElementById('core-label').textContent='LISTENING';
  recog.onresult=e=>{
    listening=false;
    document.getElementById('core-label').textContent='SPEAK';
    const t=e.results[0][0].transcript;
    document.getElementById('cmd-input').value=t;
    query(t);
  };
  recog.onerror=()=>{listening=false;document.getElementById('core-label').textContent='SPEAK';};
  recog.onend=()=>{listening=false;document.getElementById('core-label').textContent='SPEAK';};
  recog.start();
});

function send(){
  const inp=document.getElementById('cmd-input');
  const v=inp.value.trim();
  if(!v)return;
  inp.value='';
  query(v);
}

document.getElementById('send-btn').addEventListener('click',send);
document.getElementById('cmd-input').addEventListener('keydown',e=>{if(e.key==='Enter')send();});
document.querySelectorAll('.quick-btn').forEach(btn=>{
  btn.addEventListener('click',()=>query(btn.dataset.q));
});
</script>
