<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>StudyOS — Deep Focus</title>
<link rel="stylesheet" href="styles.css"/>

<!-- MathJax config — must stay before the CDN script -->
<script>
window.MathJax = {
  tex: {
    inlineMath:  [['\\(','\\)']],
    displayMath: [['\\[','\\]']]
  },
  options: { skipHtmlTags: ['script','noscript','style','textarea','pre'] },
  startup:  { typeset: false }
};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>

<!-- ░░ PARALLAX BG ░░ -->
<div class="parallax-bg" id="parallax"></div>
<div class="grid-overlay"></div>

<!-- ░░ PROGRESS BAR ░░ -->
<div class="progress-bar" id="progressBar"></div>

<!-- ░░ TOPBAR ░░ -->
<header class="topbar">
  <div class="logo">⬡ StudyOS</div>

  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="searchInput" placeholder="Search topics… ( / )" autocomplete="off"/>
    <kbd class="kbd">/</kbd>
  </div>

  <div class="topbar-actions">
    <button class="btn-ghost" id="focusBtn" title="Focus mode (F)">◈ Focus</button>
    <button class="btn-ghost" id="themeBtn" title="Toggle theme">◑</button>
  </div>
</header>

<!-- ░░ SHELL ░░ -->
<div class="shell" id="shell">

  <!-- ░░ SIDEBAR ░░ -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">Navigation</div>
    <ul class="nav-list" id="navList"></ul>
    <div class="sidebar-footer">
      <span id="sectionCount">0 topics</span>
    </div>
  </nav>

  <!-- ░░ MAIN ░░ -->
  <main class="main" id="main">
    <div class="cards-grid" id="cardsGrid"></div>
    <div class="no-results hidden" id="noResults">
      <div class="no-results-icon">⊘</div>
      <p>No topics match your search.</p>
    </div>
  </main>

</div>

<!-- keyboard hints strip -->
<div class="hints" id="hintsBar">
  <span><kbd>N</kbd> Next</span>
  <span><kbd>B</kbd> Prev</span>
  <span><kbd>/</kbd> Search</span>
  <span><kbd>F</kbd> Focus</span>
</div>

<script src="script.js"></script>
</body>
</html>
