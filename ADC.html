<script>
const navEl  = document.getElementById('nav-list');
const mainEl = document.getElementById('main');

// ============================================================
// ⚙️ AUTO-COMPILE FORMULA SHEET
// ============================================================
function autoCompileFormulas() {
  const extractedFormulas = [];

  // Loop through every chapter we have so far
  CHAPTERS.forEach(ch => {
    // Filter out only the equation blocks
    const equations = ch.content.filter(block => block.type === 'eq');

    // If this chapter has equations, add a heading and the equations to our master list
    if (equations.length > 0) {
      extractedFormulas.push({ type: "heading", text: ch.title });
      
      equations.forEach(eq => {
        extractedFormulas.push({ type: "eq", tex: eq.tex });
      });
    }
  });

  // Push this newly built chapter into our main data array
  CHAPTERS.push({
    id: "formulas",
    label: "⊞ Formulas",
    title: "Auto-Generated Formula Sheet",
    content: extractedFormulas
  });
}

// ============================================================
// 🏗️ BUILD DOM
// ============================================================
function buildDOM() {
  CHAPTERS.forEach((ch, i) => {

    // Nav link
    const li = document.createElement('li');
    const a  = document.createElement('a');
    a.href        = '#';
    a.textContent = ch.label;
    if (i === 0) a.classList.add('active');
    a.dataset.id  = ch.id;
    a.addEventListener('click', e => { e.preventDefault(); showChapter(ch.id); });
    li.appendChild(a);
    navEl.appendChild(li);

    // Section
    const sec = document.createElement('section');
    sec.id        = 'ch-' + ch.id;
    sec.className = 'chapter' + (i === 0 ? ' active' : '');

    const h1 = document.createElement('h1');
    h1.className   = 'ch-title';
    h1.textContent = ch.title;
    sec.appendChild(h1);

    ch.content.forEach(blk => {
      switch (blk.type) {
        case 'heading': {
          const d = document.createElement('div');
          d.className   = 'blk-h';
          d.textContent = blk.text;
          sec.appendChild(d);
          break;
        }
        case 'para': {
          const p = document.createElement('p');
          p.className = 'blk-p';
          p.innerHTML = blk.text;
          sec.appendChild(p);
          break;
        }
        case 'eq': {
          const d = document.createElement('div');
          d.className = 'blk-eq';
          d.innerHTML = '\\[' + blk.tex + '\\]';
          sec.appendChild(d);
          break;
        }
        case 'list': {
          const ul = document.createElement('ul');
          ul.className = 'blk-ul';
          blk.items.forEach(it => {
            const li2 = document.createElement('li');
            li2.innerHTML = it;
            ul.appendChild(li2);
          });
          sec.appendChild(ul);
          break;
        }
        case 'table': {
          const wrap = document.createElement('div');
          wrap.className = 'blk-tw';
          const tbl  = document.createElement('table');
          const head = document.createElement('thead');
          const hrow = document.createElement('tr');
          blk.headers.forEach(h => {
            const th = document.createElement('th');
            th.innerHTML = h;
            hrow.appendChild(th);
          });
          head.appendChild(hrow);
          tbl.appendChild(head);
          const body = document.createElement('tbody');
          blk.rows.forEach(row => {
            const tr = document.createElement('tr');
            row.forEach(cell => {
              const td = document.createElement('td');
              td.innerHTML = cell;
              tr.appendChild(td);
            });
            body.appendChild(tr);
          });
          tbl.appendChild(body);
          wrap.appendChild(tbl);
          sec.appendChild(wrap);
          break;
        }
        case 'canvas_sim': {
          const wrap = document.createElement('div');
          wrap.innerHTML = `

                ${blk.controlLabel} <span id="val-${blk.simId}" style="color:var(--red);">${blk.defaultVal}</span>
              </label>
              <input type="range" id="slide-${blk.simId}" min="${blk.min}" max="${blk.max}" step="${blk.step}" value="${blk.defaultVal}" style="width:100%; margin:10px 0; cursor:pointer;">
              <canvas id="canvas-${blk.simId}" height="${blk.height}" style="width:100%; background:#0d1117; border-radius:3px; display:block; border:1px solid #30363d;"></canvas>
            </div>
          `;
          sec.appendChild(wrap);
          break;
        }
        case 'canvas_sim_dual': {
          const wrap = document.createElement('div');
          wrap.innerHTML = `
            <div style="background:var(--eq-bg); padding:15px; border-left:3px solid var(--accent); margin:14px 0; border-radius:3px;">
              <div style="display:flex; gap:20px; margin-bottom:10px;">
                <div style="flex:1;">
                  <label style="font-family:var(--ui); font-size:12px; font-weight:600; color:var(--accent); text-transform:uppercase;">
                    ${blk.controlLabel1} <span id="val1-${blk.simId}" style="color:var(--red);">${blk.defaultVal1}</span>
                  </label>
                  <input type="range" id="slide1-${blk.simId}" min="${blk.min1}" max="${blk.max1}" step="${blk.step1}" value="${blk.defaultVal1}" style="width:100%; margin-top:5px; cursor:pointer;">

                  <label style="font-family:var(--ui); font-size:12px; font-weight:600; color:var(--accent); text-transform:uppercase;">
                    ${blk.controlLabel2} <span id="val2-${blk.simId}" style="color:var(--red);">${blk.defaultVal2}</span>

// ── 10. Triangular Wave BW Simulator ──
function initTriangularBwSim() {
  const canvas = document.getElementById('canvas-triangular_bw_sim');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const slider = document.getElementById('slide-triangular_bw_sim');
  const valDisplay = document.getElementById('val-triangular_bw_sim');
  const state = setupInteractive(canvas);

  function draw() {
    const W = canvas.offsetWidth, H = canvas.height;
    canvas.width = W; ctx.clearRect(0, 0, W, H);
    
    const ampMult = parseFloat(slider.value);
    valDisplay.textContent = ampMult + "x";
    
    // Draw Grid 
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i=0; i<=10; i++) { ctx.moveTo(i*(W/10), 0); ctx.lineTo(i*(W/10), H); }
    for(let i=0; i<=4; i++) { ctx.moveTo(0, i*(H/4)); ctx.lineTo(W, i*(H/4)); }
    ctx.stroke();

    const cx = W / 2, cy = H / 2;
    const period = W / 4; 
    const baseAmp = H / 8; // Scale base amplitude to fit 3x multiplier

    // Draw Triangular Wave
    ctx.beginPath(); ctx.strokeStyle = '#f9e2af'; ctx.lineWidth = 2.5;
    for (let x = 0; x < W; x++) {
      let cyclePos = (x % period) / period;
      let yNorm = 0;
      if (cyclePos < 0.5) yNorm = -1 + 4 * cyclePos; 
      else yNorm = 3 - 4 * cyclePos; 

      let y = cy - (yNorm * baseAmp * ampMult);
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    
    // Draw Metrics Text
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px "JetBrains Mono", monospace';
    ctx.fillText(`m(t) Peak: ±${ampMult}V`, 10, 20);
    ctx.fillStyle = '#39d353';
    ctx.fillText(`FM Δf: ${100 * ampMult} kHz | FM BW: ${2 * (100 * ampMult + 15)} kHz`, 10, 35);
    ctx.fillStyle = '#ff7b72';
    ctx.fillText(`PM Δf: ${50 * ampMult} kHz  | PM BW: ${2 * (50 * ampMult + 15)} kHz`, 10, 50);

    drawCursor(ctx, W, H, state);
  }
  draw();
  slider.addEventListener('input', draw);
}

// ── 11. Square Wave BW Simulator ──
function initSquareBwSim() {
  const canvas = document.getElementById('canvas-square_bw_sim');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const slider = document.getElementById('slide-square_bw_sim');
  const valDisplay = document.getElementById('val-square_bw_sim');
  const state = setupInteractive(canvas);

  function draw() {
    const W = canvas.offsetWidth, H = canvas.height;
    canvas.width = W; ctx.clearRect(0, 0, W, H);
    
    const harmonic = parseInt(slider.value);
    valDisplay.textContent = harmonic + (harmonic === 1 ? "st" : harmonic === 3 ? "rd" : "th");
    
    // Draw Grid 
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i=0; i<=10; i++) { ctx.moveTo(i*(W/10), 0); ctx.lineTo(i*(W/10), H); }
    for(let i=0; i<=4; i++) { ctx.moveTo(0, i*(H/4)); ctx.lineTo(W, i*(H/4)); }
    ctx.stroke();

    const cx = W / 2, cy = H / 2;
    const period = W / 3; 
    const baseAmp = H / 4; 

    // Draw Square Wave Outline
    ctx.beginPath(); ctx.strokeStyle = '#00d4ff'; ctx.lineWidth = 2.5;
    for (let x = 0; x < W; x++) {
      let cyclePos = (x % period) / period;
      let yNorm = cyclePos < 0.5 ? 1 : -1;
      let y = cy - (yNorm * baseAmp);
      if (x === 0) ctx.moveTo(x, y); 
      // Add vertical line logic to avoid slanted edges on square waves
      else if (x > 0 && Math.abs(y - (cy - (( ((x-1) % period)/period ) < 0.5 ? 1 : -1) * baseAmp)) > 1) {
         ctx.lineTo(x, cy - (( ((x-1) % period)/period ) < 0.5 ? 1 : -1) * baseAmp);
         ctx.lineTo(x, y);
      } else {
         ctx.lineTo(x, y);
      }
    }
    ctx.stroke();
    
    // Calculations based on Q4
    const f0 = 2.5; // kHz
    const fmax = harmonic * f0;
    const deltaF = 3; // Constant based on 1V amplitude
    const bw = 2 * (deltaF + fmax);

    // Draw Metrics Text
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px "JetBrains Mono", monospace';
    ctx.fillText(`f_0 = ${f0} kHz | Δf = ${deltaF} kHz`, 10, 20);
    ctx.fillStyle = '#ff7b72';
    ctx.fillText(`f_max (${harmonic} * f_0): ${fmax} kHz`, 10, 35);
    ctx.fillStyle = '#39d353';
    ctx.fillText(`Total FM Bandwidth: ${bw} kHz`, 10, 50);

    drawCursor(ctx, W, H, state);
  }
  draw();
  slider.addEventListener('input', draw);
}

// ── 13. CDF Graph Visualizer Simulator ──
function initCdfGraphSim() {
  const canvas = document.getElementById('canvas-cdf_graph_sim');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  // Hide the slider since this is purely a hover-inspection graph
  const slideContainer = document.getElementById('slide-cdf_graph_sim').parentElement;
  document.getElementById('slide-cdf_graph_sim').style.display = 'none';
  slideContainer.querySelector('label').innerHTML = 'CDF Comparison: Continuous vs. Discrete <span style="color:var(--dim); font-size:10px;">(Hover to inspect)</span>';
  
  const state = setupInteractive(canvas);

  function draw() {
    const W = canvas.offsetWidth, H = canvas.height;
    canvas.width = W; ctx.clearRect(0, 0, W, H);

    const midX = W / 2;
    const baseLine = H - 40;
    const topLimit = 40;

    // Background Grid
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i=0; i<=10; i++) { ctx.moveTo(i*(W/10), 0); ctx.lineTo(i*(W/10), H); }
    for(let i=0; i<=5; i++) { ctx.moveTo(0, i*(H/5)); ctx.lineTo(W, i*(H/5)); }
    ctx.stroke();

    // Draw Axes
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    // Left (Continuous)
    ctx.moveTo(30, baseLine); ctx.lineTo(midX - 20, baseLine); // X
    ctx.moveTo(50, H - 20); ctx.lineTo(50, 20); // Y
    // Right (Discrete)
    ctx.moveTo(midX + 30, baseLine); ctx.lineTo(W - 20, baseLine); // X
    ctx.moveTo(midX + 50, H - 20); ctx.lineTo(midX + 50, 20); // Y
    ctx.stroke();

    // Labels
    ctx.fillStyle = '#fff'; ctx.font = '11px "JetBrains Mono"';
    ctx.fillText("0", 40, baseLine + 15); ctx.fillText("1", 35, topLimit + 5);
    ctx.fillText("x", midX - 25, baseLine + 15); ctx.fillText("Fx(x)", 55, 25);
    
    ctx.fillText("0", midX + 40, baseLine + 15); ctx.fillText("1", midX + 35, topLimit + 5);
    ctx.fillText("x", W - 25, baseLine + 15); ctx.fillText("Fx(x)", midX + 55, 25);

    // Upper Bound Line (y=1)
    ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(50, topLimit); ctx.lineTo(midX - 20, topLimit); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(midX + 50, topLimit); ctx.lineTo(W - 20, topLimit); ctx.stroke();
    ctx.setLineDash([]);

    // --- LEFT: Continuous CDF (Logistic Curve) ---
    ctx.strokeStyle = '#ff7b72'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    for(let i = 30; i < midX - 20; i++) {
       let normalizedX = (i - (midX / 2)) / 20; // Shift and scale
       let y = topLimit + (baseLine - topLimit) - ((baseLine - topLimit) / (1 + Math.exp(-normalizedX)));
       if (i === 30) ctx.moveTo(i, y); else ctx.lineTo(i, y);
    }
    ctx.stroke();

    // --- RIGHT: Discrete CDF (Staircase) ---
    ctx.strokeStyle = '#00d4ff'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    let stepW = (W/2 - 100) / 4;
    let stepH = (baseLine - topLimit) / 4;
    let currX = midX + 50;
    let currY = baseLine;
    ctx.moveTo(currX, currY);

    for(let i=0; i<4; i++) {
       currX += stepW;
       ctx.lineTo(currX, currY); // flat right
       currY -= stepH;
       ctx.lineTo(currX, currY); // straight up
    }
    ctx.lineTo(W - 20, topLimit); // final flat line to infinity
    ctx.stroke();

    // Subtitles
    ctx.fillStyle = '#a6e3a1'; ctx.textAlign = 'center'; ctx.font = 'bold 12px "Inter"';
    ctx.fillText("Continuous R.V.", midX / 2, baseLine + 35);
    ctx.fillText("Discrete R.V.", midX + (midX / 2), baseLine + 35);
    ctx.textAlign = 'left';

    drawCursor(ctx, W, H, state);
    requestAnimationFrame(draw);
  }
  draw();
}

// ── 14. CDF Validity & Continuity Simulator ──
function initCdfValiditySim() {
  const canvas = document.getElementById('canvas-cdf_validity_sim');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const select = document.getElementById('select-cdf_validity_sim');
  const state = setupInteractive(canvas);

  function draw() {
    const W = canvas.offsetWidth, H = canvas.height;
    canvas.width = W; ctx.clearRect(0, 0, W, H);
    
    const mode = select.value;
    const baseLine = H - 40;
    const topLimit = 40;
    const midY = topLimit + (baseLine - topLimit) / 2;

    // Draw Grid 
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i=0; i<=10; i++) { ctx.moveTo(i*(W/10), 0); ctx.lineTo(i*(W/10), H); }
    for(let i=0; i<=4; i++) { ctx.moveTo(0, i*(H/4)); ctx.lineTo(W, i*(H/4)); }
    ctx.stroke();

    // Draw Axes
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(30, baseLine); ctx.lineTo(W - 20, baseLine); // X axis
    ctx.moveTo(80, H - 20); ctx.lineTo(80, 20); // Y axis
    ctx.stroke();
    
    // Labels
    ctx.fillStyle = '#fff'; ctx.font = '11px "JetBrains Mono"';
    ctx.fillText("0", 70, baseLine + 15);
    ctx.fillText("1", 65, topLimit + 5);
    ctx.fillText("x", W - 25, baseLine + 15);
    ctx.fillText("Fx(x)", 85, 25);

    // Upper Bound Line (y=1)
    ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(80, topLimit); ctx.lineTo(W - 20, topLimit); ctx.stroke();
    ctx.setLineDash([]);

    if (mode === 'mixed') {
       // Valid Mixed CDF (Ramp, Jump, Ramp, Flat)
       ctx.strokeStyle = '#39d353'; ctx.lineWidth = 3; // Green
       ctx.beginPath();
       ctx.moveTo(30, baseLine); 
       ctx.lineTo(80, baseLine); // Flat at 0
       ctx.lineTo(180, midY + 30); // Ramp up
       ctx.stroke();
       
       // Jump Discontinuity
       ctx.strokeStyle = 'rgba(57, 211, 83, 0.4)'; ctx.setLineDash([4,4]);
       ctx.beginPath(); ctx.moveTo(180, midY + 30); ctx.lineTo(180, midY - 20); ctx.stroke();
       ctx.setLineDash([]);
       
       ctx.strokeStyle = '#39d353';
       ctx.beginPath();
       ctx.moveTo(180, midY - 20); 
       ctx.lineTo(280, midY - 20); // Flat
       ctx.lineTo(380, topLimit); // Ramp to 1
       ctx.lineTo(W - 20, topLimit); // Flat at 1
       ctx.stroke();

       // Annotations
       ctx.fillStyle = '#39d353'; ctx.font = 'bold 12px "Inter"';
       ctx.fillText("✓ VALID CDF", W - 100, topLimit - 10);
       ctx.fillStyle = '#ff7b72';
       ctx.fillText("P(X=x) = Jump Size", 190, midY);

    } else if (mode === 'invalid1') {
       // Invalid: F(-inf) != 0
       ctx.strokeStyle = '#d73a49'; ctx.lineWidth = 3; // Red
       ctx.beginPath();
       ctx.moveTo(30, midY); 
       ctx.lineTo(180, midY); // Starts at > 0
       ctx.lineTo(280, topLimit); // Ramp up
       ctx.lineTo(W - 20, topLimit); // Flat at 1
       ctx.stroke();

       // Annotations
       ctx.fillStyle = '#d73a49'; ctx.font = 'bold 12px "Inter"';
       ctx.fillText("✗ INVALID", W - 90, topLimit - 10);
       ctx.fillText("F_x(-∞) ≠ 0", 40, midY - 10);

    } else if (mode === 'invalid2') {
       // Invalid: Decreasing
       ctx.strokeStyle = '#d73a49'; ctx.lineWidth = 3; // Red
       ctx.beginPath();
       ctx.moveTo(30, baseLine); 
       ctx.lineTo(80, baseLine); 
       ctx.lineTo(80, midY); // Vertical jump
       ctx.lineTo(130, midY);
       ctx.lineTo(130, baseLine + 20); // DECREASING!
       ctx.lineTo(200, topLimit); // Ramp up
       ctx.lineTo(W - 20, topLimit); // Flat at 1
       ctx.stroke();

       // Annotations
       ctx.fillStyle = '#d73a49'; ctx.font = 'bold 12px "Inter"';
       ctx.fillText("✗ INVALID", W - 90, topLimit - 10);
       ctx.fillText("Decreasing Segment", 140, baseLine + 10);
    }

    drawCursor(ctx, W, H, state);
  }
  
  draw();
  select.addEventListener('change', draw);
}

// ── 15. Mixed CDF Probabilities Simulator ──
function initMixedCdfSim() {
  const canvas = document.getElementById('canvas-mixed_cdf_sim');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const select = document.getElementById('select-mixed_cdf_sim');
  const state = setupInteractive(canvas);

  function draw() {
    const W = canvas.offsetWidth, H = canvas.height;
    canvas.width = W; ctx.clearRect(0, 0, W, H);
    
    const mode = select.value;
    const baseLine = H - 40;
    const topLimit = 40;
    const rangeY = baseLine - topLimit;

    // Scaling helpers
    const mapX = (val) => 60 + (val * (W / 3.5)); // Scale X so 3.5 fits on screen
    const mapY = (val) => baseLine - (val * rangeY);

    // Draw Grid 
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i=0; i<=10; i++) { ctx.moveTo(i*(W/10), 0); ctx.lineTo(i*(W/10), H); }
    for(let i=0; i<=4; i++) { ctx.moveTo(0, i*(H/4)); ctx.lineTo(W, i*(H/4)); }
    ctx.stroke();

    // Draw Axes
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(30, baseLine); ctx.lineTo(W - 20, baseLine); // X axis
    ctx.moveTo(60, H - 20); ctx.lineTo(60, 20); // Y axis
    ctx.stroke();
    
    // Labels
    ctx.fillStyle = '#fff'; ctx.font = '11px "JetBrains Mono"';
    ctx.fillText("0", 45, baseLine + 15);
    ctx.fillText("x", W - 25, baseLine + 15);
    ctx.fillText("Fx(x)", 65, 25);
    
    // Y-Axis Ticks
    const yTicks = [
        { val: 1/8, label: "1/8" },
        { val: 1/4, label: "1/4" },
        { val: 1/2, label: "1/2" },
        { val: 1, label: "1=K" }
    ];
    ctx.textAlign = 'right';
    yTicks.forEach(t => {
        ctx.fillText(t.label, 50, mapY(t.val) + 4);
        ctx.beginPath(); ctx.moveTo(56, mapY(t.val)); ctx.lineTo(60, mapY(t.val)); ctx.stroke();
    });
    
    // X-Axis Ticks
    const xTicks = [1, 1.5, 2];
    ctx.textAlign = 'center';
    xTicks.forEach(t => {
        ctx.fillText(t, mapX(t), baseLine + 15);
        ctx.beginPath(); ctx.moveTo(mapX(t), baseLine); ctx.lineTo(mapX(t), baseLine + 4); ctx.stroke();
    });
    ctx.textAlign = 'left';

    // Guide Lines (faded)
    ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(60, mapY(1)); ctx.lineTo(mapX(2.5), mapY(1));
    ctx.moveTo(60, mapY(0.5)); ctx.lineTo(mapX(2), mapY(0.5));
    ctx.moveTo(mapX(1), baseLine); ctx.lineTo(mapX(1), mapY(0.25));
    ctx.moveTo(mapX(1.5), baseLine); ctx.lineTo(mapX(1.5), mapY(0.5));
    ctx.moveTo(mapX(2), baseLine); ctx.lineTo(mapX(2), mapY(1));
    ctx.stroke(); ctx.setLineDash([]);

    // Draw the actual CDF Graph
    ctx.strokeStyle = '#4a90e2'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(mapX(0), mapY(0));
    ctx.lineTo(mapX(1), mapY(1/8)); // Ramp 1
    ctx.stroke();
    
    ctx.beginPath(); ctx.moveTo(mapX(1), mapY(1/4));
    ctx.lineTo(mapX(1.5), mapY(1/2)); // Ramp 2
    ctx.lineTo(mapX(2), mapY(1/2)); // Flat
    ctx.stroke();

    ctx.beginPath(); ctx.moveTo(mapX(2), mapY(1));
    ctx.lineTo(mapX(3), mapY(1)); // Flat top
    ctx.stroke();

    // Draw Jump connections (dotted vertical lines)
    ctx.strokeStyle = '#4a90e2'; ctx.setLineDash([2, 2]); ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(mapX(1), mapY(1/8)); ctx.lineTo(mapX(1), mapY(1/4));
    ctx.moveTo(mapX(2), mapY(1/2)); ctx.lineTo(mapX(2), mapY(1));
    ctx.stroke(); ctx.setLineDash([]);

    // --- HIGHLIGHT LOGIC BASED ON SELECTION ---
    ctx.lineWidth = 4;
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px "Inter"';

    if (mode === 'p_x1') {
       // Highlight Jump at x=1
       ctx.strokeStyle = '#39d353'; ctx.beginPath();
       ctx.moveTo(mapX(1), mapY(1/8)); ctx.lineTo(mapX(1), mapY(1/4)); ctx.stroke();
       
       // Points
       ctx.fillStyle = '#39d353';
       ctx.beginPath(); ctx.arc(mapX(1), mapY(1/4), 4, 0, Math.PI*2); ctx.fill();
       ctx.fillStyle = 'transparent'; ctx.strokeStyle = '#39d353'; ctx.lineWidth=2;
       ctx.beginPath(); ctx.arc(mapX(1), mapY(1/8), 4, 0, Math.PI*2); ctx.stroke();
       
       ctx.fillStyle = '#39d353';
       ctx.fillText("P{X=1} = F(1⁺) - F(1⁻)", mapX(2.2), mapY(0.25));
       ctx.fillText("= 1/4 - 1/8 = 1/8", mapX(2.2), mapY(0.15));

    } else if (mode === 'p_x2') {
       // Highlight Jump at x=2
       ctx.strokeStyle = '#ff7b72'; ctx.beginPath();
       ctx.moveTo(mapX(2), mapY(1/2)); ctx.lineTo(mapX(2), mapY(1)); ctx.stroke();
       
       // Points
       ctx.fillStyle = '#ff7b72';
       ctx.beginPath(); ctx.arc(mapX(2), mapY(1), 4, 0, Math.PI*2); ctx.fill();
       ctx.fillStyle = 'transparent'; ctx.strokeStyle = '#ff7b72'; ctx.lineWidth=2;
       ctx.beginPath(); ctx.arc(mapX(2), mapY(1/2), 4, 0, Math.PI*2); ctx.stroke();

       ctx.fillStyle = '#ff7b72';
       ctx.fillText("P{X=2} = F(2⁺) - F(2⁻)", mapX(0.2), mapY(0.8));
       ctx.fillText("= 1 - 1/2 = 1/2", mapX(0.2), mapY(0.7));

    } else if (mode === 'p_open') {
       // Highlight interval 1 < X < 2
       ctx.fillStyle = 'rgba(215, 58, 73, 0.2)';
       ctx.fillRect(mapX(1), topLimit, mapX(2) - mapX(1), baseLine - topLimit);

       ctx.fillStyle = '#d73a49';
       ctx.fillText("P{1 < X < 2} = F(2⁻) - F(1⁺)", mapX(2.2), mapY(0.8));
       ctx.fillText("= 1/2 - 1/4 = 1/4", mapX(2.2), mapY(0.7));
       
       ctx.beginPath(); ctx.arc(mapX(2), mapY(1/2), 5, 0, Math.PI*2); ctx.fill();
       ctx.beginPath(); ctx.arc(mapX(1), mapY(1/4), 5, 0, Math.PI*2); ctx.fill();

    } else if (mode === 'p_closed') {
       // Highlight interval 1 <= X <= 2
       ctx.fillStyle = 'rgba(57, 211, 83, 0.2)';
       ctx.fillRect(mapX(1), topLimit, mapX(2) - mapX(1), baseLine - topLimit);

       ctx.fillStyle = '#39d353';
       ctx.fillText("P{1 ≤ X ≤ 2} = F(2⁺) - F(1⁻)", mapX(0.2), mapY(0.8));
       ctx.fillText("= 1 - 1/8 = 7/8", mapX(0.2), mapY(0.7));
       
       ctx.beginPath(); ctx.arc(mapX(2), mapY(1), 5, 0, Math.PI*2); ctx.fill();
       ctx.beginPath(); ctx.arc(mapX(1), mapY(1/8), 5, 0, Math.PI*2); ctx.fill();
    }

    drawCursor(ctx, W, H, state);
  }
  
  draw();
  select.addEventListener('change', draw);
}

// ── 16. PDF Area & Impulse Visualizer Simulator ──
function initPdfAreaSim() {
  const canvas = document.getElementById('canvas-pdf_area_sim');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const select = document.getElementById('select-pdf_area_sim');
  const state = setupInteractive(canvas);

  function draw() {
    const W = canvas.offsetWidth, H = canvas.height;
    canvas.width = W; ctx.clearRect(0, 0, W, H);
    
    const mode = select.value;
    const baseLine = H - 40;
    const topLimit = 40;
    
    // Scaling helpers
    const mapX = (val) => 40 + (val / 8) * (W - 80); // X range: 0 to 8
    const mapY = (val) => baseLine - (val * (baseLine - topLimit)); // Y range: 0 to 1

    // Draw Grid 
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i=0; i<=10; i++) { ctx.moveTo(i*(W/10), 0); ctx.lineTo(i*(W/10), H); }
    for(let i=0; i<=4; i++) { ctx.moveTo(0, i*(H/4)); ctx.lineTo(W, i*(H/4)); }
    ctx.stroke();

    // Draw Axes
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(20, baseLine); ctx.lineTo(W - 20, baseLine); // X axis
    ctx.moveTo(mapX(0), H - 20); ctx.lineTo(mapX(0), 20); // Y axis
    ctx.stroke();
    
    // Labels
    ctx.fillStyle = '#fff'; ctx.font = '11px "JetBrains Mono"';
    ctx.fillText("0", mapX(0) - 15, baseLine + 15);
    ctx.fillText("x", W - 25, baseLine + 15);
    ctx.fillText("fx(x)", mapX(0) - 35, 25);
    
    // X-Axis Boundary Marks (a=2, b=6)
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff7b72';
    ctx.fillText("a (2)", mapX(2), baseLine + 18);
    ctx.fillText("b (6)", mapX(6), baseLine + 18);
    ctx.beginPath(); ctx.moveTo(mapX(2), baseLine); ctx.lineTo(mapX(2), baseLine+5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(mapX(6), baseLine); ctx.lineTo(mapX(6), baseLine+5); ctx.stroke();
    ctx.textAlign = 'left';

    // State Bools
    const isMixed = mode.includes('mixed');
    const isPoint = mode.includes('point');
    const isOpen = mode.includes('open');
    const isClosed = mode.includes('closed');

    // Scale the curve down if mixed to visually represent area taken by impulses
    const curveScale = isMixed ? 0.6 : 1.0; 

    // Math function for the bell curve
    const pdfCurve = (x) => curveScale * 0.8 * Math.exp(-Math.pow(x-4, 2)/3);

    // --- 1. FILL AREA ---
    if (isOpen || isClosed || mode === 'cont_point') {
        ctx.beginPath();
        ctx.moveTo(mapX(2), baseLine);
        for(let x = 2; x <= 6; x += 0.1) {
            ctx.lineTo(mapX(x), mapY(pdfCurve(x)));
        }
        ctx.lineTo(mapX(6), baseLine);
        
        if (mode === 'cont_point') {
            // Draw single line for point probability
            ctx.strokeStyle = '#ff7b72'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(mapX(2), baseLine); ctx.lineTo(mapX(2), mapY(pdfCurve(2))); ctx.stroke();
        } else {
            // Fill area for ranges
            ctx.fillStyle = 'rgba(57, 211, 83, 0.25)';
            ctx.fill();
        }
    }

    // --- 2. DRAW CONTINUOUS CURVE ---
    ctx.beginPath(); ctx.strokeStyle = '#4a90e2'; ctx.lineWidth = 2.5;
    for(let x = 0; x <= 8; x += 0.1) {
        if (x === 0) ctx.moveTo(mapX(x), mapY(pdfCurve(x)));
        else ctx.lineTo(mapX(x), mapY(pdfCurve(x)));
    }
    ctx.stroke();

    // --- 3. DRAW IMPULSES (If Mixed) ---
    if (isMixed) {
        function drawImpulse(x, highlight) {
            const h = 0.45; // visual height of impulse
            ctx.beginPath();
            ctx.strokeStyle = highlight ? '#ff7b72' : '#8b949e';
            ctx.lineWidth = highlight ? 4 : 2;
            
            // Arrow shaft
            ctx.moveTo(mapX(x), baseLine);
            ctx.lineTo(mapX(x), mapY(h));
            // Arrow head
            ctx.lineTo(mapX(x)-5, mapY(h)+8);
            ctx.moveTo(mapX(x), mapY(h));
            ctx.lineTo(mapX(x)+5, mapY(h)+8);
            ctx.stroke();

            if (highlight) {
                ctx.fillStyle = '#ff7b72';
                ctx.font = 'bold 11px Inter';
                ctx.fillText('Area = 0.2', mapX(x) - 25, mapY(h) - 10);
            }
        }

        const highlightA = (isPoint) || (isClosed);
        const highlightB = (isClosed);

        drawImpulse(2, highlightA);
        drawImpulse(6, highlightB);
    }

    // --- 4. DYNAMIC ANNOTATIONS ---
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "Inter"';
    if (mode === 'cont_point') {
        ctx.fillStyle = '#ff7b72';
        ctx.fillText("P(X = a) = 0", mapX(2.5), mapY(0.9));
        ctx.font = '11px "Inter"'; ctx.fillStyle = '#ccc';
        ctx.fillText("Area of a strict mathematical line is zero.", mapX(2.5), mapY(0.8));
    } else if (mode === 'mixed_point') {
        ctx.fillStyle = '#ff7b72';
        ctx.fillText("P(X = a) = 0.2", mapX(2.5), mapY(0.9));
        ctx.font = '11px "Inter"'; ctx.fillStyle = '#ccc';
        ctx.fillText("Probability equals the weight (area) of the impulse.", mapX(2.5), mapY(0.8));
    } else if (mode === 'cont_open') {
        ctx.fillStyle = '#39d353';
        ctx.fillText("P(a < X < b) = Area Under Curve", mapX(2.5), mapY(0.9));
    } else if (mode === 'mixed_open') {
        ctx.fillStyle = '#39d353';
        ctx.fillText("P(a < X < b) = Curve Area Only", mapX(2.5), mapY(0.9));
        ctx.font = '11px "Inter"'; ctx.fillStyle = '#ccc';
        ctx.fillText("Strict inequalities (<) EXCLUDE the boundary impulses.", mapX(2.5), mapY(0.8));
    } else if (mode === 'mixed_closed') {
        ctx.fillStyle = '#ff7b72';
        ctx.fillText("P(a ≤ X ≤ b) = Curve + Both Impulses", mapX(2.5), mapY(0.9));
        ctx.font = '11px "Inter"'; ctx.fillStyle = '#ccc';
        ctx.fillText("Inclusive inequalities (≤) INCLUDE the boundary impulses.", mapX(2.5), mapY(0.8));
    }

    drawCursor(ctx, W, H, state);
  }
  
  draw();
  select.addEventListener('change', draw);
}
// ── 17. CDF to PDF Problem Simulator ──
function initCdfPdfProblemSim() {
  const canvas = document.getElementById('canvas-cdf_pdf_problem_sim');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const select = document.getElementById('select-cdf_pdf_problem_sim');
  const state = setupInteractive(canvas);

  function draw() {
    const W = canvas.offsetWidth, H = canvas.height;
    canvas.width = W; ctx.clearRect(0, 0, W, H);
    
    const mode = select.value;
    
    // Split canvas horizontally into Top (CDF) and Bottom (PDF)
    const cdfBase = 170;
    const cdfTop = 40;
    const pdfBase = 370;
    const pdfTop = 230;

    const mapX = (val) => 60 + (val / 8) * (W - 120); // Map X 0->8 to canvas width

    // Background Panels
    ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
    ctx.fillRect(10, 10, W-20, 190);
    ctx.fillRect(10, 210, W-20, 190);

    // Axes
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath();
    // CDF
    ctx.moveTo(30, cdfBase); ctx.lineTo(W - 30, cdfBase); // X
    ctx.moveTo(mapX(0), cdfBase+10); ctx.lineTo(mapX(0), cdfTop-20); // Y
    // PDF
    ctx.moveTo(30, pdfBase); ctx.lineTo(W - 30, pdfBase); // X
    ctx.moveTo(mapX(0), pdfBase+10); ctx.lineTo(mapX(0), pdfTop-20); // Y
    ctx.stroke();

    // Labels
    ctx.fillStyle = '#fff'; ctx.font = '11px "JetBrains Mono"';
    ctx.fillText("x", W - 25, cdfBase + 15); ctx.fillText("Fx(x)", mapX(0) - 40, cdfTop - 10);
    ctx.fillText("x", W - 25, pdfBase + 15); ctx.fillText("fx(x)", mapX(0) - 40, pdfTop - 10);

    ctx.textAlign = 'right';
    ctx.fillText("1", mapX(0) - 10, cdfTop + 4);
    ctx.fillText("1/4", mapX(0) - 10, pdfTop + 4);
    ctx.textAlign = 'left';
    
    ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.setLineDash([4,4]); ctx.beginPath();
    ctx.moveTo(mapX(0), cdfTop); ctx.lineTo(mapX(6), cdfTop); 
    ctx.moveTo(mapX(0), pdfTop); ctx.lineTo(mapX(6), pdfTop); 
    ctx.stroke(); ctx.setLineDash([]);

    // Mathematical definitions
    const Fx = (x) => {
        if(x <= 2) return 0;
        if(x <= 6) return 0.25 * (x - 2);
        return 1;
    };

    // Draw Highlighting specific to selected mode
    ctx.lineWidth = 2;
    if (mode === 'p_x_gt_2') {
        // PDF Fill Area
        ctx.fillStyle = 'rgba(57, 211, 83, 0.25)';
        ctx.fillRect(mapX(2), pdfTop, mapX(6)-mapX(2), pdfBase - pdfTop);
        
        // CDF Delta Projections
        ctx.strokeStyle = '#39d353'; ctx.setLineDash([2,2]); ctx.beginPath();
        ctx.moveTo(mapX(2), cdfBase); ctx.lineTo(mapX(2), cdfTop); 
        ctx.moveTo(mapX(6), cdfBase); ctx.lineTo(mapX(6), cdfTop); 
        ctx.stroke(); ctx.setLineDash([]);
        
        // Annotations
        ctx.fillStyle = '#39d353'; ctx.font = 'bold 12px Inter';
        ctx.fillText("Area = 1", mapX(3.5), pdfBase - 40);
        ctx.fillText("Δy = 1", mapX(6.2), cdfTop + 60);
        
    } else if (mode === 'p_3_5') {
        // PDF Fill Area
        ctx.fillStyle = 'rgba(215, 58, 73, 0.25)';
        const y3 = cdfBase - Fx(3)*(cdfBase-cdfTop);
        const y5 = cdfBase - Fx(5)*(cdfBase-cdfTop);
        
        ctx.fillRect(mapX(3), pdfTop, mapX(5)-mapX(3), pdfBase - pdfTop);
        
        ctx.strokeStyle = '#d73a49'; ctx.setLineDash([2,2]); ctx.beginPath();
        ctx.moveTo(mapX(3), pdfBase); ctx.lineTo(mapX(3), y3);
        ctx.moveTo(mapX(5), pdfBase); ctx.lineTo(mapX(5), y5);
        ctx.stroke(); ctx.setLineDash([]);

        // Points mapping onto the CDF
        ctx.fillStyle = '#d73a49';
        ctx.beginPath(); ctx.arc(mapX(3), y3, 4, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(mapX(5), y5, 4, 0, Math.PI*2); ctx.fill();
        
        // Y-axis horizontal projections
        ctx.strokeStyle = '#d73a49'; ctx.setLineDash([2,2]); ctx.beginPath();
        ctx.moveTo(mapX(3), y3); ctx.lineTo(mapX(0), y3);
        ctx.moveTo(mapX(5), y5); ctx.lineTo(mapX(0), y5);
        ctx.stroke(); ctx.setLineDash([]);
        
        ctx.textAlign = 'right'; ctx.font = '10px JetBrains Mono';
        ctx.fillText("F(3)=1/4", mapX(0)-5, y3+3);
        ctx.fillText("F(5)=3/4", mapX(0)-5, y5+3);
        ctx.textAlign = 'left';

        ctx.font = 'bold 12px Inter';
        ctx.fillText("Area = 1/2", mapX(3.2), pdfBase - 40);
        
        // Vertical difference bracket (Δy)
        ctx.beginPath(); ctx.strokeStyle = '#d73a49'; ctx.setLineDash([]);
        ctx.moveTo(mapX(5)+10, y3); ctx.lineTo(mapX(5)+15, y3); 
        ctx.lineTo(mapX(5)+15, y5); ctx.lineTo(mapX(5)+10, y5);
        ctx.stroke();
        ctx.fillText("Δy = 1/2", mapX(5)+20, y3 - (y3-y5)/2 + 4);
    }

    // Draw Main CDF Line
    ctx.strokeStyle = '#ffb86c'; ctx.lineWidth = 3; ctx.beginPath();
    ctx.moveTo(mapX(0), cdfBase);
    ctx.lineTo(mapX(2), cdfBase);
    ctx.lineTo(mapX(6), cdfTop);
    ctx.lineTo(mapX(8), cdfTop);
    ctx.stroke();

    // Draw Main PDF Line
    ctx.strokeStyle = '#8be9fd'; ctx.lineWidth = 3; ctx.beginPath();
    ctx.moveTo(mapX(0), pdfBase);
    ctx.lineTo(mapX(2), pdfBase);
    ctx.lineTo(mapX(2), pdfTop); // jump up
    ctx.lineTo(mapX(6), pdfTop);
    ctx.lineTo(mapX(6), pdfBase); // jump down
    ctx.lineTo(mapX(8), pdfBase);
    ctx.stroke();
    
    // Global X-axis ticks
    [2, 3, 5, 6].forEach(x => {
        ctx.fillStyle = '#fff'; ctx.font = '10px JetBrains Mono'; ctx.textAlign = 'center';
        ctx.fillText(x, mapX(x), cdfBase + 15);
        ctx.fillText(x, mapX(x), pdfBase + 15);
    });

    drawCursor(ctx, W, H, state);
  }
  
  draw();
  select.addEventListener('change', draw);
}

// ── 18. Mixed R.V. Problem Simulator ──
function initMixedRvProblemSim() {
  const canvas = document.getElementById('canvas-mixed_rv_problem_sim');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const select = document.getElementById('select-mixed_rv_problem_sim');
  const state = setupInteractive(canvas);

  function draw() {
    const W = canvas.offsetWidth, H = canvas.height;
    canvas.width = W; ctx.clearRect(0, 0, W, H);
    
    const mode = select.value;
    
    // Split canvas horizontally
    const cdfBase = 170; const cdfTop = 40;
    const pdfBase = 370; const pdfTop = 230;

    // Mapping X from -3 to +3
    const mapX = (val) => (W / 2) + (val / 3) * (W / 2 - 40);

    // Background Panels
    ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
    ctx.fillRect(10, 10, W-20, 190);
    ctx.fillRect(10, 210, W-20, 190);

    // Axes
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath();
    ctx.moveTo(30, cdfBase); ctx.lineTo(W - 30, cdfBase); // CDF X
    ctx.moveTo(mapX(0), cdfBase+10); ctx.lineTo(mapX(0), cdfTop-20); // CDF Y
    ctx.moveTo(30, pdfBase); ctx.lineTo(W - 30, pdfBase); // PDF X
    ctx.moveTo(mapX(0), pdfBase+10); ctx.lineTo(mapX(0), pdfTop-20); // PDF Y
    ctx.stroke();

    // Labels
    ctx.fillStyle = '#fff'; ctx.font = '11px "JetBrains Mono"';
    ctx.fillText("z", W - 25, cdfBase + 15); ctx.fillText("Fx(z)", mapX(0) + 10, cdfTop - 10);
    ctx.fillText("x", W - 25, pdfBase + 15); ctx.fillText("fx(x)", mapX(0) + 10, pdfTop - 10);

    // Helper for drawing Impulses
    function drawImpulse(x, yLimit, weightLabel, color) {
        ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 3;
        ctx.moveTo(mapX(x), pdfBase); ctx.lineTo(mapX(x), yLimit);
        ctx.lineTo(mapX(x)-5, yLimit+8); ctx.moveTo(mapX(x), yLimit); ctx.lineTo(mapX(x)+5, yLimit+8);
        ctx.stroke();
        ctx.fillStyle = color; ctx.font = 'bold 12px Inter'; ctx.textAlign = 'center';
        ctx.fillText(weightLabel, mapX(x), yLimit - 10); ctx.textAlign = 'left';
    }

    // Mathematical definitions
    const Fx = (x) => {
        if(x <= -2) return 0;
        if(x <= -1) return 0.25 * (x + 2);
        if(x < 1) return 0.5;
        return 1;
    };

    // --- HIGHLIGHTING LOGIC ---
    if (mode === 'p_x_lt_1') {
        // Area = 0 (Strict bounds exclude impulses)
        ctx.fillStyle = 'rgba(215, 58, 73, 0.15)';
        ctx.fillRect(mapX(-0.95), pdfTop, mapX(0.95)-mapX(-0.95), pdfBase - pdfTop);
        ctx.fillStyle = '#d73a49'; ctx.font = 'bold 13px Inter';
        ctx.fillText("Area = 0", mapX(-0.3), pdfBase - 40);
        ctx.fillText("Strict bounds (<) exclude impulses at exactly -1 and 1.", mapX(-2.5), pdfBase + 40);
        
        ctx.strokeStyle = '#d73a49'; ctx.setLineDash([4,4]); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(mapX(-1), cdfBase - Fx(-0.99)*(cdfBase-cdfTop)); ctx.lineTo(mapX(1), cdfBase - Fx(0.99)*(cdfBase-cdfTop)); ctx.stroke();
        ctx.setLineDash([]);
        
    } else if (mode === 'p_x_le_1') {
        // Impulses Included
        drawImpulse(-1, pdfBase - 80, "1/4", '#39d353');
        drawImpulse(1, pdfBase - 120, "1/2", '#39d353');
        ctx.fillStyle = '#39d353'; ctx.font = 'bold 13px Inter';
        ctx.fillText("Area = 1/4 + 1/2 = 3/4", mapX(-0.6), pdfBase - 40);
        
        ctx.strokeStyle = '#39d353'; ctx.setLineDash([4,4]); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(mapX(-1), cdfBase); ctx.lineTo(mapX(-1), cdfTop + 65); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(mapX(1), cdfBase); ctx.lineTo(mapX(1), cdfTop); ctx.stroke();
        ctx.setLineDash([]);
        
    } else if (mode === 'p_range_5') {
        // Box + 2 Impulses
        ctx.fillStyle = 'rgba(57, 211, 83, 0.25)';
        ctx.fillRect(mapX(-1.5), pdfBase - 40, mapX(-1)-mapX(-1.5), 40);
        
        drawImpulse(-1, pdfBase - 80, "1/4", '#39d353');
        drawImpulse(1, pdfBase - 120, "1/2", '#39d353');
        
        ctx.fillStyle = '#39d353'; ctx.font = 'bold 13px Inter';
        ctx.fillText("Area = 1/8 + 1/4 + 1/2 = 7/8", mapX(-0.8), pdfBase - 20);
        
        // CDF projection
        ctx.strokeStyle = '#39d353'; ctx.setLineDash([2,2]); ctx.beginPath();
        const y15 = cdfBase - Fx(-1.5)*(cdfBase-cdfTop);
        ctx.moveTo(mapX(-1.5), pdfBase); ctx.lineTo(mapX(-1.5), y15);
        ctx.moveTo(mapX(2), pdfBase); ctx.lineTo(mapX(2), cdfTop);
        ctx.stroke(); ctx.setLineDash([]);
        
        ctx.beginPath(); ctx.arc(mapX(-1.5), y15, 4, 0, Math.PI*2); ctx.fill();
        ctx.fillText("F(-1.5) = 1/8", mapX(-2.5), y15);

    } else if (mode === 'p_cond_6') {
        // Box + 1 Impulse
        ctx.fillStyle = 'rgba(255, 184, 108, 0.25)';
        ctx.fillRect(mapX(-1.5), pdfBase - 40, mapX(-1)-mapX(-1.5), 40);
        
        drawImpulse(-1, pdfBase - 80, "1/4", '#ffb86c');
        
        ctx.fillStyle = '#ffb86c'; ctx.font = 'bold 13px Inter';
        ctx.fillText("Numerator Area = 1/8 + 1/4 = 3/8", mapX(-0.8), pdfBase - 20);
    }

    // --- DRAW MAIN CDF ---
    ctx.strokeStyle = '#bd93f9'; ctx.lineWidth = 3; ctx.beginPath();
    ctx.moveTo(mapX(-3), cdfBase);
    ctx.lineTo(mapX(-2), cdfBase);
    ctx.lineTo(mapX(-1), cdfBase - 0.25*(cdfBase-cdfTop)); // Ramp to 1/4
    ctx.stroke();
    
    // Jump at -1
    ctx.strokeStyle = '#bd93f9'; ctx.setLineDash([2, 2]); ctx.beginPath();
    ctx.moveTo(mapX(-1), cdfBase - 0.25*(cdfBase-cdfTop)); ctx.lineTo(mapX(-1), cdfBase - 0.5*(cdfBase-cdfTop)); ctx.stroke();
    ctx.setLineDash([]);
    
    ctx.beginPath();
    ctx.moveTo(mapX(-1), cdfBase - 0.5*(cdfBase-cdfTop));
    ctx.lineTo(mapX(1), cdfBase - 0.5*(cdfBase-cdfTop)); // Flat at 1/2
    ctx.stroke();

    // Jump at 1
    ctx.strokeStyle = '#bd93f9'; ctx.setLineDash([2, 2]); ctx.beginPath();
    ctx.moveTo(mapX(1), cdfBase - 0.5*(cdfBase-cdfTop)); ctx.lineTo(mapX(1), cdfTop); ctx.stroke();
    ctx.setLineDash([]);

    ctx.beginPath();
    ctx.moveTo(mapX(1), cdfTop);
    ctx.lineTo(mapX(3), cdfTop); // Flat at 1
    ctx.stroke();

    // --- DRAW MAIN PDF ---
    ctx.strokeStyle = '#8be9fd'; ctx.lineWidth = 3; ctx.beginPath();
    ctx.moveTo(mapX(-3), pdfBase);
    ctx.lineTo(mapX(-2), pdfBase);
    ctx.lineTo(mapX(-2), pdfBase - 40); // Box up
    ctx.lineTo(mapX(-1), pdfBase - 40); // Box flat
    ctx.lineTo(mapX(-1), pdfBase); // Box down
    ctx.lineTo(mapX(3), pdfBase);
    ctx.stroke();

    if (mode === 'full' || mode === 'p_x_lt_1') {
        drawImpulse(-1, pdfBase - 80, "1/4", '#8be9fd');
        drawImpulse(1, pdfBase - 120, "1/2", '#8be9fd');
    }

    // Global X-axis ticks
    [-2, -1.5, -1, 0.5, 1, 2].forEach(x => {
        ctx.fillStyle = '#fff'; ctx.font = '10px JetBrains Mono'; ctx.textAlign = 'center';
        ctx.fillText(x, mapX(x), cdfBase + 15);
        ctx.fillText(x, mapX(x), pdfBase + 15);
        ctx.beginPath(); ctx.moveTo(mapX(x), cdfBase); ctx.lineTo(mapX(x), cdfBase+4); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(mapX(x), pdfBase); ctx.lineTo(mapX(x), pdfBase+4); ctx.stroke();
    });

    drawCursor(ctx, W, H, state);
  }
  
  draw();
  select.addEventListener('change', draw);
}

// ── 19. Triangular PDF Problem Simulator ──
function initTriangularPdfProbSim() {
  const canvas = document.getElementById('canvas-triangular_pdf_prob_sim');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const select = document.getElementById('select-triangular_pdf_prob_sim');
  const state = setupInteractive(canvas);

  function draw() {
    const W = canvas.offsetWidth, H = canvas.height;
    canvas.width = W; ctx.clearRect(0, 0, W, H);
    
    const mode = select.value;
    const baseLine = H - 50;
    const topLimit = 60;

    // Mapping function: Maps internal values (-1 to +1) to canvas width, reserving margins
    const mapX = (val) => (W / 2) + (val * (W / 4)); 
    const mapY = (val) => baseLine - (val * (baseLine - topLimit));

    // Background Panels & Grid
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i=0; i<=10; i++) { ctx.moveTo(i*(W/10), 0); ctx.lineTo(i*(W/10), H); }
    for(let i=0; i<=4; i++) { ctx.moveTo(0, i*(H/4)); ctx.lineTo(W, i*(H/4)); }
    ctx.stroke();

    // Axes
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath();
    ctx.moveTo(30, baseLine); ctx.lineTo(W - 30, baseLine); // X Axis
    ctx.moveTo(mapX(0), baseLine+15); ctx.lineTo(mapX(0), 30); // Y Axis
    ctx.stroke();

    // Standard Labels
    ctx.fillStyle = '#fff'; ctx.font = '11px "JetBrains Mono"';
    ctx.fillText("x", W - 25, baseLine + 15); 
    ctx.fillText("fx(x)", mapX(0) + 12, 35);
    ctx.fillText("b", mapX(0) - 15, topLimit + 5);
    ctx.fillText("-a", mapX(-1) - 6, baseLine + 18);
    ctx.fillText("a", mapX(1) - 4, baseLine + 18);

    // --- HIGHLIGHTING LOGIC ---
    if (mode === 'full') {
        // Shaded Total Area
        ctx.fillStyle = 'rgba(57, 211, 83, 0.25)';
        ctx.beginPath(); 
        ctx.moveTo(mapX(-1), baseLine); 
        ctx.lineTo(mapX(0), topLimit); 
        ctx.lineTo(mapX(1), baseLine); 
        ctx.fill();
        
        ctx.fillStyle = '#39d353'; ctx.font = 'bold 14px Inter';
        ctx.fillText("Total Area = 1/2(2a)(b) = ab = 1", mapX(0.1), baseLine - 20);

    } else if (mode === 'gt_a_half') {
        // Shaded Right Tail
        ctx.fillStyle = 'rgba(255, 184, 108, 0.35)';
        ctx.beginPath(); 
        ctx.moveTo(mapX(0.5), baseLine); 
        ctx.lineTo(mapX(0.5), mapY(0.5)); 
        ctx.lineTo(mapX(1), baseLine); 
        ctx.fill();
        
        // Geometry Trace Lines
        ctx.strokeStyle = '#ffb86c'; ctx.setLineDash([4,4]); ctx.beginPath();
        ctx.moveTo(mapX(0.5), baseLine); ctx.lineTo(mapX(0.5), mapY(0.5)); 
        ctx.lineTo(mapX(0), mapY(0.5)); ctx.stroke(); ctx.setLineDash([]);
        
        // Labels specific to this view
        ctx.fillStyle = '#ffb86c'; ctx.font = '12px JetBrains Mono';
        ctx.fillText("a/2", mapX(0.5)-10, baseLine + 18);
        ctx.fillText("b/2", mapX(0)-25, mapY(0.5)+4);
        
        ctx.font = 'bold 13px Inter';
        ctx.fillText("Area = 1/2(a/2)(b/2) = ab/8 = 1/8", mapX(0.55), baseLine - 10);

    } else if (mode === 'mid') {
        // Shaded Center Mass
        ctx.fillStyle = 'rgba(189, 147, 249, 0.35)';
        ctx.beginPath(); 
        ctx.moveTo(mapX(-0.5), baseLine); 
        ctx.lineTo(mapX(-0.5), mapY(0.5)); 
        ctx.lineTo(mapX(0), topLimit); 
        ctx.lineTo(mapX(0.5), mapY(0.5)); 
        ctx.lineTo(mapX(0.5), baseLine);
        ctx.fill();

        // Geometry Trace Lines
        ctx.strokeStyle = '#bd93f9'; ctx.setLineDash([4,4]); ctx.beginPath();
        ctx.moveTo(mapX(-0.5), baseLine); ctx.lineTo(mapX(-0.5), mapY(0.5)); 
        ctx.lineTo(mapX(0), mapY(0.5)); 
        ctx.moveTo(mapX(0.5), baseLine); ctx.lineTo(mapX(0.5), mapY(0.5));
        ctx.stroke(); ctx.setLineDash([]);
        
        // Labels specific to this view
        ctx.fillStyle = '#bd93f9'; ctx.font = '12px JetBrains Mono';
        ctx.fillText("-a/2", mapX(-0.5)-14, baseLine + 18);
        ctx.fillText("a/2", mapX(0.5)-10, baseLine + 18);
        
        ctx.font = 'bold 13px Inter';
        ctx.fillText("Area = Total - 2(Tails) = 1 - 2(1/8) = 3/4", mapX(-0.4), baseLine - 35);
    }

    // Draw Main Triangle Outline over everything
    ctx.strokeStyle = '#8be9fd'; ctx.lineWidth = 3; ctx.beginPath();
    ctx.moveTo(30, baseLine);
    ctx.lineTo(mapX(-1), baseLine);
    ctx.lineTo(mapX(0), topLimit);
    ctx.lineTo(mapX(1), baseLine);
    ctx.lineTo(W-30, baseLine);
    ctx.stroke();

    drawCursor(ctx, W, H, state);
  }
  
  draw();
  select.addEventListener('change', draw);
}

// ── 20. DRV Geometric Distribution Simulator ──
function initDrvGeometricSim() {
  const canvas = document.getElementById('canvas-drv_geometric_sim');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const select = document.getElementById('select-drv_geometric_sim');
  const state = setupInteractive(canvas);

  function draw() {
    const W = canvas.offsetWidth, H = canvas.height;
    canvas.width = W; ctx.clearRect(0, 0, W, H);
    
    const mode = select.value;
    const baseLine = H - 40;
    const topLimit = 40;

    // Map X from 0 to 12 rolls
    const mapX = (val) => 40 + (val / 12) * (W - 80);
    // Map Y from 0 to 1
    const mapY = (val) => baseLine - (val * (baseLine - topLimit));

    // Draw Background Grid 
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i=0; i<=12; i++) { ctx.moveTo(mapX(i), 0); ctx.lineTo(mapX(i), H); }
    for(let i=0; i<=4; i++) { ctx.moveTo(0, i*(H/4)); ctx.lineTo(W, i*(H/4)); }
    ctx.stroke();

    // Draw Main Axes
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(20, baseLine); ctx.lineTo(W - 20, baseLine); // X axis
    ctx.moveTo(mapX(0), H - 20); ctx.lineTo(mapX(0), 20); // Y axis
    ctx.stroke();

    // Standard Labels
    ctx.fillStyle = '#fff'; ctx.font = '11px "JetBrains Mono"';
    ctx.fillText("0", mapX(0) - 15, baseLine + 15);
    ctx.fillText("Rolls (x)", W - 60, baseLine + 30);
    
    // X-axis numerical ticks
    for(let i=1; i<=11; i++) {
        ctx.fillText(i, mapX(i) - 4, baseLine + 15);
        ctx.beginPath(); ctx.moveTo(mapX(i), baseLine); ctx.lineTo(mapX(i), baseLine+4); ctx.stroke();
    }

    // Geometric Distribution Math (Probability of rolling a specific number like '3' is 1/6)
    const p = 1/6;
    const q = 5/6;
    let cumulative = 0;
    
    const data = [];
    for(let x=1; x<=12; x++) {
        let prob = Math.pow(q, x-1) * p;
        cumulative += prob;
        data.push({ x: x, pmf: prob, cdf: cumulative });
    }

    ctx.fillStyle = '#a6e3a1'; ctx.font = 'bold 12px Inter';
    
    // --- 1. P.M.F. VIEW ---
    if (mode === 'pmf') {
        ctx.fillText("P.M.F. | P(X=x)", mapX(0) - 30, 25);
        ctx.fillStyle = '#39d353'; ctx.strokeStyle = '#39d353';
        
        // Y-axis tick for max PMF (1/6)
        ctx.fillText("1/6", mapX(0)-25, mapY(p)+4);
        ctx.beginPath(); ctx.moveTo(mapX(0)-4, mapY(p)); ctx.lineTo(mapX(0), mapY(p)); ctx.stroke();
        
        data.forEach(d => {
            // Draw Stems
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(mapX(d.x), baseLine); ctx.lineTo(mapX(d.x), mapY(d.pmf)); ctx.stroke();
            // Draw Dots
            ctx.beginPath(); ctx.arc(mapX(d.x), mapY(d.pmf), 4, 0, Math.PI*2); ctx.fill();
        });

    // --- 2. PDF VIEW ---
    } else if (mode === 'pdf') {
        ctx.fillText("PDF | f_x(x)", mapX(0) - 20, 25);
        ctx.fillStyle = '#00d4ff'; ctx.strokeStyle = '#00d4ff';
        
        ctx.fillText("1/6", mapX(0)-25, mapY(p)+4);
        ctx.beginPath(); ctx.moveTo(mapX(0)-4, mapY(p)); ctx.lineTo(mapX(0), mapY(p)); ctx.stroke();

        data.forEach(d => {
            // Draw Impulses (Arrows)
            ctx.lineWidth = 2;
            const h = mapY(d.pmf);
            ctx.beginPath(); ctx.moveTo(mapX(d.x), baseLine); ctx.lineTo(mapX(d.x), h);
            ctx.lineTo(mapX(d.x)-4, h+6); ctx.moveTo(mapX(d.x), h); ctx.lineTo(mapX(d.x)+4, h+6);
            ctx.stroke();
            
            // Weight text
            ctx.font = '9px JetBrains Mono';
            ctx.fillText(`δ(${d.pmf.toFixed(2)})`, mapX(d.x)-12, h-8);
        });

    // --- 3. CDF VIEW ---
    } else if (mode === 'cdf') {
        ctx.fillText("CDF | F_x(x)", mapX(0) - 20, 25);
        ctx.fillStyle = '#ff7b72'; ctx.strokeStyle = '#ff7b72';
        
        // Y-axis tick for Absolute 1.0
        ctx.fillText("1.0", mapX(0)-22, mapY(1)+4);
        ctx.beginPath(); ctx.moveTo(mapX(0)-4, mapY(1)); ctx.lineTo(mapX(0), mapY(1)); ctx.stroke();
        
        // Asymptote limit line
        ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.setLineDash([4,4]);
        ctx.beginPath(); ctx.moveTo(mapX(0), mapY(1)); ctx.lineTo(W-20, mapY(1)); ctx.stroke();
        ctx.setLineDash([]);
        
        ctx.strokeStyle = '#ff7b72';
        ctx.lineWidth = 3;
        
        // Start line at 0 before the first roll
        ctx.beginPath(); ctx.moveTo(mapX(0), baseLine); ctx.lineTo(mapX(1), baseLine); ctx.stroke(); 
        
        for(let i=0; i<data.length; i++) {
            let d = data[i];
            let nextX = (i === data.length-1) ? 12 : data[i+1].x;
            
            // Draw Vertical Jump (dotted)
            ctx.setLineDash([2,2]); ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(mapX(d.x), mapY(d.cdf - d.pmf)); ctx.lineTo(mapX(d.x), mapY(d.cdf)); ctx.stroke();
            
            // Draw Horizontal Flat (solid)
            ctx.setLineDash([]); ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(mapX(d.x), mapY(d.cdf)); ctx.lineTo(mapX(nextX), mapY(d.cdf)); ctx.stroke();
        }
    }

    drawCursor(ctx, W, H, state);
  }
  
  draw();
  select.addEventListener('change', draw);
}

// ── 21. DRV PDF Graph Simulator (Interactive) ──
function initDrvPdfGraphSim() {
  const canvas = document.getElementById('canvas-drv_pdf_graph');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const select = document.getElementById('select-drv_pdf_graph');

  function draw() {
    const W = canvas.offsetWidth, H = canvas.height;
    canvas.width = W; ctx.clearRect(0, 0, W, H);
    
    const mode = select.value;
    const baseLine = H - 40;
    
    // Axes
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath();
    ctx.moveTo(30, baseLine); ctx.lineTo(W - 30, baseLine); // X
    ctx.moveTo(80, baseLine + 10); ctx.lineTo(80, 20); // Y
    ctx.stroke();

    ctx.fillStyle = '#fff'; ctx.font = '12px "JetBrains Mono"';
    ctx.fillText("x", W - 25, baseLine + 15);

    const points = [
      { x: 150, label: "x1", h: 80, pLabel: "px(x1)" },
      { x: 250, label: "x2", h: 140, pLabel: "px(x2)" },
      { x: 350, label: "x3", h: 100, pLabel: "px(x3)" }
    ];

    if (mode === 'pmf') {
        ctx.fillText("px(x)", 85, 25);
        points.forEach(pt => {
            // Draw dotted projection lines
            ctx.beginPath(); ctx.strokeStyle = 'rgba(255,221,87,0.4)'; ctx.lineWidth = 2; ctx.setLineDash([4,4]);
            ctx.moveTo(pt.x, baseLine); ctx.lineTo(pt.x, baseLine - pt.h); ctx.stroke(); ctx.setLineDash([]);
            
            // Draw points
            ctx.beginPath(); ctx.arc(pt.x, baseLine - pt.h, 5, 0, Math.PI*2); 
            ctx.fillStyle = '#ffdd57'; ctx.fill();
            
            // Labels
            ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(pt.label, pt.x, baseLine + 18);
            ctx.fillStyle = '#ffdd57'; ctx.font = 'bold 13px Inter';
            ctx.fillText(pt.pLabel, pt.x, baseLine - pt.h - 12);
        });
    } else {
        ctx.fillText("fx(x)", 85, 25);
        points.forEach(pt => {
            // Draw Impulses
            ctx.beginPath(); ctx.strokeStyle = '#ffdd57'; ctx.lineWidth = 2.5;
            ctx.moveTo(pt.x, baseLine); ctx.lineTo(pt.x, baseLine - pt.h);
            ctx.lineTo(pt.x - 5, baseLine - pt.h + 8); 
            ctx.moveTo(pt.x, baseLine - pt.h); ctx.lineTo(pt.x + 5, baseLine - pt.h + 8);
            ctx.stroke();

            // Labels
            ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
            ctx.fillText(pt.label, pt.x, baseLine + 18);
            ctx.beginPath(); ctx.arc(pt.x, baseLine, 3, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = '#ffdd57'; ctx.font = 'bold 12px Inter';
            ctx.fillText(pt.pLabel + " δ(x-" + pt.label + ")", pt.x, baseLine - pt.h - 10);
        });
    }
    ctx.textAlign = 'left';
  }
  draw();
  select.addEventListener('change', draw);
}

// ── 22. DRV CDF Graph Simulator (Interactive) ──
function initDrvCdfGraphSim() {
  const canvas = document.getElementById('canvas-drv_cdf_graph');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const select = document.getElementById('select-drv_cdf_graph');

  function draw() {
    const W = canvas.offsetWidth, H = canvas.height;
    canvas.width = W; ctx.clearRect(0, 0, W, H);
    
    const mode = select.value;
    const baseLine = H - 40;
    
    // Axes
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath();
    ctx.moveTo(30, baseLine); ctx.lineTo(W - 30, baseLine); // X
    ctx.moveTo(80, baseLine + 10); ctx.lineTo(80, 20); // Y
    ctx.stroke();

    ctx.fillStyle = '#fff'; ctx.font = '12px "JetBrains Mono"';
    ctx.fillText("x", W - 25, baseLine + 15);

    const points = [
      { x: 150, label: "x1", y: baseLine - 40, pLabel: "px(x1)", h: 40 },
      { x: 250, label: "x2", y: baseLine - 100, pLabel: "px(x1)+px(x2)", h: 60 },
      { x: 350, label: "x3", y: baseLine - 160, pLabel: "px(x1)+px(x2)+px(x3)", h: 60 }
    ];

    if (mode === 'impulses') {
        ctx.fillText("fx(x)", 85, 25);
        points.forEach(pt => {
            // Draw Impulses in blue to show they are the source
            ctx.beginPath(); ctx.strokeStyle = '#8be9fd'; ctx.lineWidth = 2.5;
            ctx.moveTo(pt.x, baseLine); ctx.lineTo(pt.x, baseLine - pt.h);
            ctx.lineTo(pt.x - 5, baseLine - pt.h + 8); 
            ctx.moveTo(pt.x, baseLine - pt.h); ctx.lineTo(pt.x + 5, baseLine - pt.h + 8);
            ctx.stroke();

            ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
            ctx.fillText(pt.label, pt.x, baseLine + 18);
            ctx.beginPath(); ctx.arc(pt.x, baseLine, 3, 0, Math.PI*2); ctx.fill();
        });
    } else {
        ctx.fillText("Fx(x)", 85, 25);
        
        // Staircase
        ctx.strokeStyle = '#ffdd57'; ctx.lineWidth = 3; ctx.beginPath();
        ctx.moveTo(30, baseLine); ctx.lineTo(points[0].x, baseLine);
        
        points.forEach((pt, i) => {
          // Jump up
          ctx.lineTo(pt.x, pt.y);
          // Flat across
          let nextX = (i === points.length - 1) ? W - 30 : points[i+1].x;
          ctx.lineTo(nextX, pt.y);
          
          // X-axis labels
          ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
          ctx.fillText(pt.label, pt.x, baseLine + 18);
          ctx.beginPath(); ctx.arc(pt.x, baseLine, 3, 0, Math.PI*2); ctx.fill();
          
          // Y-axis projections
          ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.setLineDash([4,4]); ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(pt.x, pt.y); ctx.lineTo(80, pt.y); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(pt.x, baseLine); ctx.lineTo(pt.x, pt.y); ctx.stroke();
          ctx.setLineDash([]); ctx.lineWidth = 3; ctx.strokeStyle = '#ffdd57';
          
          ctx.fillStyle = '#fff'; ctx.textAlign = 'right';
          ctx.fillText(pt.pLabel, 75, pt.y + 4);
        });

        ctx.fillStyle = '#ffdd57'; ctx.font = 'bold 12px Inter'; ctx.textAlign = 'left';
        ctx.fillText("↳ STAIRCASE FORM", 380, baseLine - 80);
    }
  }
  draw();
  select.addEventListener('change', draw);
}

// ── 24. Mixed R.V. Graph Simulator ──
function initMixedRvGraphSim() {
  const canvas = document.getElementById('canvas-mixed_rv_graph_sim');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const select = document.getElementById('select-mixed_rv_graph_sim');

  function draw() {
    const W = canvas.offsetWidth, H = canvas.height;
    canvas.width = W; ctx.clearRect(0, 0, W, H);
    
    const mode = select.value;
    const baseLine = H - 40;
    
    // Grid
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i=0; i<=10; i++) { ctx.moveTo(i*(W/10), 0); ctx.lineTo(i*(W/10), H); }
    for(let i=0; i<=4; i++) { ctx.moveTo(0, i*(H/4)); ctx.lineTo(W, i*(H/4)); }
    ctx.stroke();

    // Axes
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath();
    ctx.moveTo(30, baseLine); ctx.lineTo(W - 30, baseLine); // X
    ctx.moveTo(W / 2, baseLine + 10); ctx.lineTo(W / 2, 20); // Y
    ctx.stroke();

    ctx.fillStyle = '#fff'; ctx.font = '12px "JetBrains Mono"';
    ctx.fillText("x", W - 25, baseLine + 15);
    
    // Scale map
    const cx = W / 2;
    const scaleX = (W - 100) / 6; // 6 units wide (-3 to 3)

    // X-axis ticks
    ctx.textAlign = 'center';
    [-2, -1, 0, 1, 2].forEach(tick => {
       ctx.fillText(tick, cx + (tick * scaleX), baseLine + 18);
       ctx.beginPath(); ctx.moveTo(cx + (tick * scaleX), baseLine); ctx.lineTo(cx + (tick * scaleX), baseLine+4); ctx.stroke();
    });
    ctx.textAlign = 'left';

    if (mode === "pdf") {
      ctx.fillText("fx(x)", cx + 10, 25);
      
      // Draw Triangle
      const topY = baseLine - 100;
      ctx.strokeStyle = '#ffdd57'; ctx.lineWidth = 2.5; ctx.beginPath();
      ctx.moveTo(cx - (2 * scaleX), baseLine);
      ctx.lineTo(cx, topY);
      ctx.lineTo(cx + (2 * scaleX), baseLine);
      ctx.stroke();

      // Draw Impulses at 0 and 1
      function drawImpulse(val, height, label) {
          const x = cx + (val * scaleX);
          const y = baseLine - height;
          ctx.beginPath(); ctx.strokeStyle = '#00d4ff'; ctx.lineWidth = 3;
          ctx.moveTo(x, baseLine); ctx.lineTo(x, y);
          ctx.lineTo(x - 5, y + 8); ctx.moveTo(x, y); ctx.lineTo(x + 5, y + 8);
          ctx.stroke();
          ctx.fillStyle = '#00d4ff'; ctx.font = 'bold 12px Inter';
          ctx.fillText(label, x + 8, y + 10);
      }
      drawImpulse(0, 120, "K1");
      drawImpulse(1, 90, "K2");

    } else if (mode === "cdf") {
      ctx.fillText("Fx(x)", cx + 10, 25);
      
      // Draw Mixed CDF
      ctx.strokeStyle = '#ffdd57'; ctx.lineWidth = 2.5; ctx.beginPath();
      
      // Flat 0
      ctx.moveTo(30, baseLine); ctx.lineTo(cx - (2 * scaleX), baseLine);
      // Ramp 1
      ctx.lineTo(cx, baseLine - 40); ctx.stroke();
      
      // Jump 1
      ctx.strokeStyle = '#00d4ff'; ctx.setLineDash([4,4]); ctx.beginPath();
      ctx.moveTo(cx, baseLine - 40); ctx.lineTo(cx, baseLine - 80); ctx.stroke();
      ctx.setLineDash([]);
      
      // Ramp 2
      ctx.strokeStyle = '#ffdd57'; ctx.beginPath();
      ctx.moveTo(cx, baseLine - 80); ctx.lineTo(cx + (1 * scaleX), baseLine - 100); ctx.stroke();

      // Jump 2
      ctx.strokeStyle = '#00d4ff'; ctx.setLineDash([4,4]); ctx.beginPath();
      ctx.moveTo(cx + (1 * scaleX), baseLine - 100); ctx.lineTo(cx + (1 * scaleX), baseLine - 140); ctx.stroke();
      ctx.setLineDash([]);

      // Ramp 3 & Flat
      ctx.strokeStyle = '#ffdd57'; ctx.beginPath();
      ctx.moveTo(cx + (1 * scaleX), baseLine - 140); 
      ctx.lineTo(cx + (2 * scaleX), baseLine - 160);
      ctx.lineTo(W - 30, baseLine - 160);
      ctx.stroke();

      ctx.fillStyle = '#fff';
      ctx.fillText("1", cx - 15, baseLine - 155);
      ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.setLineDash([2,2]);
      ctx.beginPath(); ctx.moveTo(cx, baseLine - 160); ctx.lineTo(cx + (2 * scaleX), baseLine - 160); ctx.stroke();
    }
  }
  draw();
  select.addEventListener('change', draw);
}

function initUniformDistSim() {
  const canvas = document.getElementById('canvas-uniform_dist_sim');

  const state = setupInteractive(canvas);

  function draw() {
    const W = canvas.offsetWidth, H = canvas.height;
    canvas.width = W; ctx.clearRect(0, 0, W, H);
    
    const mode = select.value;
    const baseLine = H - 40;
    const topLimit = 40;
    
    // Grid Setup
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i=0; i<=10; i++) { ctx.moveTo(i*(W/10), 0); ctx.lineTo(i*(W/10), H); }
    for(let i=0; i<=4; i++) { ctx.moveTo(0, i*(H/4)); ctx.lineTo(W, i*(H/4)); }
    ctx.stroke();

    // Axes
    const startX = 60;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath();
    ctx.moveTo(30, baseLine); ctx.lineTo(W - 30, baseLine); // X Axis
    ctx.moveTo(startX, baseLine + 10); ctx.lineTo(startX, 20); // Y Axis
    ctx.stroke();

    // Standard Labels
    ctx.fillStyle = '#fff'; ctx.font = '12px "JetBrains Mono"';
    ctx.fillText("x", W - 25, baseLine + 15);
    ctx.fillText("0", startX - 15, baseLine + 15);
    
    // Define Boundaries a and b
    const mapX = (val) => startX + (val * ((W - 100) / 5)); 
    const a = mapX(1);
    const b = mapX(4);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffb86c';
    ctx.fillText("a", a, baseLine + 18);
    ctx.fillText("b", b, baseLine + 18);
    ctx.beginPath(); ctx.moveTo(a, baseLine); ctx.lineTo(a, baseLine+5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(b, baseLine); ctx.lineTo(b, baseLine+5); ctx.stroke();
    ctx.textAlign = 'left';

    if (mode === "pdf") {
      ctx.fillStyle = '#fff';
      ctx.fillText("fx(x)", startX + 10, 25);
      
      const heightY = baseLine - 100;
      
      // Y-axis tick
      ctx.fillText("1/(b-a)", startX - 55, heightY + 4);
      ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(startX, heightY); ctx.lineTo(a, heightY); ctx.stroke();
      ctx.setLineDash([]);

      // Draw PDF Rectangle
      ctx.fillStyle = 'rgba(139, 233, 253, 0.2)';
      ctx.fillRect(a, heightY, b - a, baseLine - heightY);
      
      ctx.strokeStyle = '#8be9fd'; ctx.lineWidth = 3; ctx.beginPath();
      ctx.moveTo(30, baseLine); ctx.lineTo(a, baseLine);
      ctx.lineTo(a, heightY); ctx.lineTo(b, heightY); ctx.lineTo(b, baseLine);
      ctx.lineTo(W - 30, baseLine); ctx.stroke();

      ctx.fillStyle = '#8be9fd'; ctx.font = 'bold 13px Inter';
      ctx.fillText("Total Area = 1", a + (b-a)/2 - 40, heightY + 50);

    } else if (mode === "cdf") {
      ctx.fillStyle = '#fff';
      ctx.fillText("Fx(x)", startX + 10, 25);
      
      const heightY = topLimit + 20;

      // Y-axis tick
      ctx.fillText("1", startX - 15, heightY + 4);
      ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(startX, heightY); ctx.lineTo(b, heightY); ctx.stroke();
      
      // Projection for 'b'
      ctx.beginPath(); ctx.moveTo(b, baseLine); ctx.lineTo(b, heightY); ctx.stroke();
      ctx.setLineDash([]);

      // Draw CDF Ramp
      ctx.strokeStyle = '#50fa7b'; ctx.lineWidth = 3; ctx.beginPath();
      ctx.moveTo(30, baseLine); ctx.lineTo(a, baseLine);
      ctx.lineTo(b, heightY);
      ctx.lineTo(W - 30, heightY); ctx.stroke();

      // Math Annotations
      ctx.fillStyle = '#50fa7b'; ctx.font = 'bold 12px Inter';
      
      // Slope annotation line
      ctx.beginPath(); ctx.lineWidth = 1.5;
      ctx.moveTo(a + 40, baseLine - 10); ctx.lineTo(a + 80, baseLine - 10); ctx.lineTo(a + 80, heightY + 50); ctx.stroke();
      ctx.fillText("Slope = 1/(b-a)", a + 90, baseLine - 30);
    }
    
    if(state) drawCursor(ctx, W, H, state);
  }
  draw();
  select.addEventListener('change', draw);
}
