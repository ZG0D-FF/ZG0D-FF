  // ── 27. Gaussian PDF Simulator ──
  function initGaussianPdfSim() {
    const canvas = document.getElementById('canvas-gaussian_pdf_sim');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const slideMu = document.getElementById('slide1-gaussian_pdf_sim');
    const slideVar = document.getElementById('slide2-gaussian_pdf_sim');
    const valMu = document.getElementById('val1-gaussian_pdf_sim');
    const valVar = document.getElementById('val2-gaussian_pdf_sim');
    const valTot = document.getElementById('valTotal-gaussian_pdf_sim'); 
    valTot.parentElement.innerHTML = `Max Peak Height: <span id="valTotal-gaussian_pdf_sim" style="color:var(--accent);">...</span>`;
    const valTotSpan = document.getElementById('valTotal-gaussian_pdf_sim');
    const state = setupInteractive(canvas);

    function draw() {
      const W = canvas.offsetWidth, H = canvas.height;
      canvas.width = W; ctx.clearRect(0, 0, W, H);
      
      const mu = parseFloat(slideMu.value);
      const var_x = parseFloat(slideVar.value);
      valMu.textContent = mu;
      valVar.textContent = var_x;

      const baseLine = H - 40;
      const cx = W / 2;
      
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)'; ctx.lineWidth = 1;
      ctx.beginPath();
      for(let i=0; i<=10; i++) { ctx.moveTo(i*(W/10), 0); ctx.lineTo(i*(W/10), H); }
      for(let i=0; i<=4; i++) { ctx.moveTo(0, i*(H/4)); ctx.lineTo(W, i*(H/4)); }
      ctx.stroke();

      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath();
      ctx.moveTo(30, baseLine); ctx.lineTo(W - 30, baseLine); 
      ctx.moveTo(cx, baseLine + 10); ctx.lineTo(cx, 20); 
      ctx.stroke();

      const scaleX = (W - 100) / 20;
      const sigma = Math.sqrt(var_x);
      const peak = 1 / (Math.sqrt(2 * Math.PI * var_x));
      valTotSpan.textContent = peak.toFixed(3);
      
      const visualScaleY = (H - 80) / 0.8; 

      ctx.fillStyle = 'rgba(80, 250, 123, 0.2)';
      ctx.beginPath();
      ctx.moveTo(30, baseLine);
      for(let i = 30; i <= W - 30; i++) {
          let x_val = (i - cx) / scaleX;
          let pdf = (1 / (sigma * Math.sqrt(2 * Math.PI))) * Math.exp(-0.5 * Math.pow((x_val - mu)/sigma, 2));
          let y = baseLine - (pdf * visualScaleY);
          ctx.lineTo(i, y);
      }
      ctx.lineTo(W-30, baseLine);
      ctx.fill();

      ctx.strokeStyle = '#50fa7b'; ctx.lineWidth = 3; ctx.beginPath();
      for(let i = 30; i <= W - 30; i++) {
          let x_val = (i - cx) / scaleX;
          let pdf = (1 / (sigma * Math.sqrt(2 * Math.PI))) * Math.exp(-0.5 * Math.pow((x_val - mu)/sigma, 2));
          let y = baseLine - (pdf * visualScaleY);
          if(i===30) ctx.moveTo(i, y); else ctx.lineTo(i, y);
      }
      ctx.stroke();

      let muX = cx + mu * scaleX;
      ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.setLineDash([4,4]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(muX, baseLine); ctx.lineTo(muX, baseLine - (peak * visualScaleY)); ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = '#fff'; ctx.font = '12px "JetBrains Mono"';
      ctx.textAlign = 'center';
      ctx.fillText("0", cx, baseLine + 18);
      ctx.fillText("μ=" + mu, muX, baseLine - (peak * visualScaleY) - 10);
      
      ctx.textAlign = 'left';
      ctx.fillText("fx(x)", cx + 10, 25);
      ctx.fillText("x", W - 25, baseLine + 15);

      drawCursor(ctx, W, H, state);
    }
    draw();
    slideMu.addEventListener('input', draw);
    slideVar.addEventListener('input', draw);
  }

// ── 28. Gaussian Integration Tricks Simulator ──
function initGaussianTricksSim() {
  const canvas = document.getElementById('canvas-gaussian_tricks_sim');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const select = document.getElementById('select-gaussian_tricks_sim');
  const state = setupInteractive(canvas);

  function draw() {
    const W = canvas.offsetWidth, H = canvas.height;
    canvas.width = W; ctx.clearRect(0, 0, W, H);
    
    const mode = select.value;
    const baseLine = H - 50;
    const cx = W / 2;
    
    // Grid Setup
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i=0; i<=10; i++) { ctx.moveTo(i*(W/10), 0); ctx.lineTo(i*(W/10), H); }
    for(let i=0; i<=4; i++) { ctx.moveTo(0, i*(H/4)); ctx.lineTo(W, i*(H/4)); }
    ctx.stroke();

    // Axes
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath();
    ctx.moveTo(30, baseLine); ctx.lineTo(W - 30, baseLine); // X Axis
    ctx.moveTo(cx, baseLine + 10); ctx.lineTo(cx, 30); // Y Axis
    ctx.stroke();

    // Standard Labels
    ctx.fillStyle = '#fff'; ctx.font = '11px "JetBrains Mono"';
    ctx.fillText("x", W - 25, baseLine + 15);
    ctx.textAlign = 'right';
    ctx.fillText("Amplitude", cx - 10, 40);
    ctx.textAlign = 'left';

    const scaleX = (W - 100) / 10; // 10 units wide

    // Helper to draw curves
    function drawCurve(coef, exponentMult, fillColor, strokeColor, startX, endX, fillLabel, labelY) {
        ctx.beginPath();
        for(let i = 30; i <= W - 30; i++) {
            let x_val = (i - cx) / scaleX;
            let y_val = coef * Math.exp(-exponentMult * Math.pow(x_val, 2));
            let y = baseLine - (y_val * 150); // Scale visually
            if(i === 30) ctx.moveTo(i, y); else ctx.lineTo(i, y);
        }
        ctx.strokeStyle = strokeColor; ctx.lineWidth = 3; ctx.stroke();

        // Shading Region
        ctx.fillStyle = fillColor;
        ctx.beginPath();
        ctx.moveTo(startX, baseLine);
        for(let i = startX; i <= endX; i++) {
            let x_val = (i - cx) / scaleX;
            let y_val = coef * Math.exp(-exponentMult * Math.pow(x_val, 2));
            let y = baseLine - (y_val * 150);
            ctx.lineTo(i, y);
        }
        ctx.lineTo(endX, baseLine);
        ctx.fill();

        // Area text
        ctx.fillStyle = strokeColor; ctx.font = 'bold 14px Inter';
        ctx.fillText(fillLabel, cx + 20, labelY);
    }

    if (mode === "half") {
        // Standard Gaussian (sigma=1), filling from 0 to inf
        const coef = 1 / Math.sqrt(2 * Math.PI);
        drawCurve(coef, 0.5, 'rgba(80, 250, 123, 0.25)', '#50fa7b', cx, W-30, "Area = 1/2", baseLine - 50);
        
        ctx.fillStyle = '#fff'; ctx.font = '12px JetBrains Mono'; ctx.textAlign = 'center';
        ctx.fillText("μx", cx, baseLine + 18);
        ctx.fillText("∞", W - 40, baseLine + 18);

    } else if (mode === "trick1") {
        // e^(-5x^2)
        drawCurve(1, 5, 'rgba(139, 233, 253, 0.25)', '#8be9fd', 30, W-30, "Area = √(π/5)", baseLine - 80);
        
        ctx.fillStyle = '#fff'; ctx.font = '12px JetBrains Mono'; ctx.textAlign = 'center';
        ctx.fillText("0", cx, baseLine + 18);
        
        ctx.fillStyle = '#8be9fd'; ctx.font = '12px Inter'; ctx.textAlign = 'left';
        ctx.fillText("Note: Graph is much narrower due to 5x²", cx + 20, baseLine - 60);

    } else if (mode === "trick2") {
        // e^(-3x^2) from 0 to inf
        drawCurve(1, 3, 'rgba(255, 121, 198, 0.25)', '#ff79c6', cx, W-30, "Area = 1/2 * √(π/3)", baseLine - 60);
        
        ctx.fillStyle = '#fff'; ctx.font = '12px JetBrains Mono'; ctx.textAlign = 'center';
        ctx.fillText("0", cx, baseLine + 18);
        ctx.fillText("∞", W - 40, baseLine + 18);

        // Draw dotted line for the un-integrated negative half
        ctx.strokeStyle = 'rgba(255, 121, 198, 0.4)'; ctx.setLineDash([4,4]); ctx.lineWidth = 2;
        ctx.beginPath();
        for(let i = 30; i <= cx; i++) {
            let x_val = (i - cx) / scaleX;
            let y_val = 1 * Math.exp(-3 * Math.pow(x_val, 2));
            let y = baseLine - (y_val * 150);
            if(i === 30) ctx.moveTo(i, y); else ctx.lineTo(i, y);
        }
        ctx.stroke(); ctx.setLineDash([]);
        
        ctx.fillStyle = 'rgba(255, 121, 198, 0.7)'; ctx.textAlign = 'center';
        ctx.fillText("(Unshaded Even Half)", cx - 80, baseLine - 20);
    }
    
    ctx.textAlign = 'left';
    drawCursor(ctx, W, H, state);
  }
  draw();
  select.addEventListener('change', draw);
}
// ── 28. Q-Function Simulator ──
function initQFunctionSim() {
  const canvas = document.getElementById('canvas-q_function_sim');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const select = document.getElementById('select-q_function_sim');
  
  // Inject a slider specifically for this simulator dynamically
  const wrapper = select.parentElement;
  const sliderHtml = `
    <div style="margin-top:10px;">
      <div style="display:flex; justify-content:space-between; font-family:var(--ui); font-size:12px; color:var(--accent);">
        <span>x = -3</span>
        <span style="font-weight:bold; color:var(--red);">Current x: <span id="val-q_sim">0.0</span></span>
        <span>x = +3</span>
      </div>
      <input type="range" id="slide-q_sim" min="-3" max="3" step="0.1" value="0" style="width:100%; margin:5px 0 15px; cursor:pointer;">
    </div>
  `;
  select.insertAdjacentHTML('afterend', sliderHtml);
  
  const slider = document.getElementById('slide-q_sim');
  const valDisplay = document.getElementById('val-q_sim');
  const state = setupInteractive(canvas);

  // Numerical approximation of Q-function for dynamic readout
  function q_approx(x) {
    if (x < 0) return 1 - q_approx(-x);
    const t = 1 / (1 + 0.2316419 * x);
    const pdf = (1 / Math.sqrt(2 * Math.PI)) * Math.exp(-0.5 * x * x);
    return pdf * (0.3193815*t - 0.3565638*Math.pow(t,2) + 1.781477*Math.pow(t,3) - 1.821256*Math.pow(t,4) + 1.330274*Math.pow(t,5));
  }

  function draw() {
    const W = canvas.offsetWidth, H = canvas.height;
    canvas.width = W; ctx.clearRect(0, 0, W, H);
    
    const mode = select.value;
    const x_val = parseFloat(slider.value);
    valDisplay.textContent = x_val.toFixed(1);
    
    const baseLine = H - 50;
    const cx = W / 2;
    
    // Grid Setup
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i=0; i<=10; i++) { ctx.moveTo(i*(W/10), 0); ctx.lineTo(i*(W/10), H); }
    for(let i=0; i<=4; i++) { ctx.moveTo(0, i*(H/4)); ctx.lineTo(W, i*(H/4)); }
    ctx.stroke();

    // Axes
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath();
    ctx.moveTo(30, baseLine); ctx.lineTo(W - 30, baseLine); // X Axis
    ctx.moveTo(cx, baseLine + 10); ctx.lineTo(cx, 30); // Y Axis
    ctx.stroke();

    const scaleX = (W - 100) / 6; // 6 units wide (-3 to 3)
    const visualScaleY = (H - 100) / 0.4; // Standard normal peak is ~0.398

    // Map function for drawing
    const mapX = (val) => cx + (val * scaleX);
    const pdf = (val) => (1 / Math.sqrt(2 * Math.PI)) * Math.exp(-0.5 * val * val);

    // Labels
    ctx.fillStyle = '#fff'; ctx.font = '11px "JetBrains Mono"';
    ctx.textAlign = 'center';
    [-3, -2, -1, 0, 1, 2, 3].forEach(tick => {
        ctx.fillText(tick, mapX(tick), baseLine + 18);
        ctx.beginPath(); ctx.moveTo(mapX(tick), baseLine); ctx.lineTo(mapX(tick), baseLine+4); ctx.stroke();
    });
    ctx.textAlign = 'right';
    ctx.fillText("fz(z)", cx - 10, 40);
    ctx.textAlign = 'left';

    const currentQ = q_approx(x_val);

    if (mode === "tail") {
        // Draw Fill (Right Tail)
        ctx.fillStyle = 'rgba(255, 121, 198, 0.4)';
        ctx.beginPath();
        ctx.moveTo(mapX(x_val), baseLine);
        for(let i = mapX(x_val); i <= W - 30; i++) {
            let z = (i - cx) / scaleX;
            ctx.lineTo(i, baseLine - (pdf(z) * visualScaleY));
        }
        ctx.lineTo(W - 30, baseLine);
        ctx.fill();

        // Target Line
        ctx.strokeStyle = '#ff79c6'; ctx.setLineDash([4,4]); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(mapX(x_val), baseLine); ctx.lineTo(mapX(x_val), baseLine - (pdf(x_val)*visualScaleY)); ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#ff79c6'; ctx.font = 'bold 14px Inter';
        ctx.fillText(`Q(${x_val.toFixed(1)}) = ${currentQ.toFixed(4)}`, 40, 40);

    } else if (mode === "symmetry") {
        // Draw Fill (Right Tail for x)
        ctx.fillStyle = 'rgba(255, 121, 198, 0.5)';
        ctx.beginPath(); ctx.moveTo(mapX(x_val), baseLine);
        for(let i = mapX(x_val); i <= W - 30; i++) {
            let z = (i - cx) / scaleX;
            ctx.lineTo(i, baseLine - (pdf(z) * visualScaleY));
        }
        ctx.lineTo(W - 30, baseLine); ctx.fill();

        // Draw Fill (Right Tail for -x, which equals left tail of x)
        ctx.fillStyle = 'rgba(139, 233, 253, 0.4)';
        ctx.beginPath(); ctx.moveTo(30, baseLine);
        for(let i = 30; i <= mapX(x_val); i++) {
            let z = (i - cx) / scaleX;
            ctx.lineTo(i, baseLine - (pdf(z) * visualScaleY));
        }
        ctx.lineTo(mapX(x_val), baseLine); ctx.fill();

        // Target Line
        ctx.strokeStyle = '#fff'; ctx.setLineDash([4,4]); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(mapX(x_val), baseLine); ctx.lineTo(mapX(x_val), baseLine - (pdf(x_val)*visualScaleY)); ctx.stroke();
        
        ctx.beginPath(); ctx.moveTo(mapX(-x_val), baseLine); ctx.lineTo(mapX(-x_val), baseLine - (pdf(-x_val)*visualScaleY)); ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#ff79c6'; ctx.font = 'bold 13px Inter';
        ctx.fillText(`Q(${x_val.toFixed(1)}) = ${currentQ.toFixed(4)}`, 40, 35);
        ctx.fillStyle = '#8be9fd';
        ctx.fillText(`Q(${-x_val.toFixed(1)}) = ${(1-currentQ).toFixed(4)}`, 40, 55);
        ctx.fillStyle = '#fff';
        ctx.fillText(`Total Sum = 1.0000`, 40, 75);

    } else if (mode === "cdf") {
        // Draw Fill (Left Area / CDF)
        ctx.fillStyle = 'rgba(80, 250, 123, 0.35)';
        ctx.beginPath();
        ctx.moveTo(30, baseLine);
        for(let i = 30; i <= mapX(x_val); i++) {
            let z = (i - cx) / scaleX;
            ctx.lineTo(i, baseLine - (pdf(z) * visualScaleY));
        }
        ctx.lineTo(mapX(x_val), baseLine);
        ctx.fill();

        // Target Line
        ctx.strokeStyle = '#50fa7b'; ctx.setLineDash([4,4]); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(mapX(x_val), baseLine); ctx.lineTo(mapX(x_val), baseLine - (pdf(x_val)*visualScaleY)); ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#50fa7b'; ctx.font = 'bold 14px Inter';
        ctx.fillText(`Fz(${x_val.toFixed(1)}) = 1 - Q(${x_val.toFixed(1)}) = ${(1-currentQ).toFixed(4)}`, 40, 40);
    }

    // Draw Main Normal Curve (Outlines over everything)
    ctx.strokeStyle = '#f8f8f2'; ctx.lineWidth = 3; ctx.beginPath();
    for(let i = 30; i <= W - 30; i++) {
        let z = (i - cx) / scaleX;
        let y = baseLine - (pdf(z) * visualScaleY);
        if(i === 30) ctx.moveTo(i, y); else ctx.lineTo(i, y);
    }
    ctx.stroke();

    drawCursor(ctx, W, H, state);
  }
  
  draw();
  select.addEventListener('change', draw);
  slider.addEventListener('input', draw);
}

        ctx.fillText("fX(x)", cx + 10, 25);

        ctx.textAlign = 'right';
        ctx.fillText("1/√(2πσ²)", cx - 10, peakY + 4);
        ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.setLineDash([4,4]);
        ctx.beginPath(); ctx.moveTo(cx - 5, peakY); ctx.lineTo(cx + 5, peakY); ctx.stroke();
        ctx.setLineDash([]);
        ctx.textAlign = 'left';

        // Draw Bell Curve
        const visualScaleY = (baseLine - peakY);
        ctx.strokeStyle = '#8be9fd'; ctx.lineWidth = 3; ctx.beginPath();
        for(let i = 30; i <= W - 30; i++) {
            let z = (i - cx) / scaleX;

        }
        ctx.stroke();

        // Center dashed line
        ctx.strokeStyle = '#8be9fd'; ctx.setLineDash([4,4]); ctx.lineWidth = 1.5;

        ctx.setLineDash([]);

    } else if (mode === "cdf") {
        ctx.fillText("FX(z)", cx + 10, 25);
        ctx.fillText("z", W - 25, baseLine + 15);
        
        const heightY = topLimit + 20;
        const midY = baseLine - (baseLine - heightY) / 2;

        // Y-axis ticks
        ctx.textAlign = 'right';
        ctx.fillText("1", cx - 10, heightY + 4);
        ctx.fillText("1/2", cx - 10, midY + 4);
        ctx.textAlign = 'left';

        ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.setLineDash([4,4]);
        ctx.beginPath(); 
        ctx.moveTo(cx - 5, heightY); ctx.lineTo(W - 30, heightY); 
        ctx.moveTo(cx - 5, midY); ctx.lineTo(cx, midY); 
        ctx.stroke(); ctx.setLineDash([]);

        // Sigmoid approximation for CDF
        ctx.strokeStyle = '#50fa7b'; ctx.lineWidth = 3; ctx.beginPath();
        for(let i = 30; i <= W - 30; i++) {
            let z = (i - cx) / scaleX;
            // Logistic approx of normal CDF for visual purposes
            let cdfVal = 1 / (1 + Math.exp(-1.702 * z));
            let y = baseLine - (cdfVal * (baseLine - heightY));
            if(i === 30) ctx.moveTo(i, y); else ctx.lineTo(i, y);
        }
        ctx.stroke();
        
        ctx.beginPath(); ctx.arc(cx, midY, 4, 0, Math.PI*2);
        ctx.fillStyle = '#50fa7b'; ctx.fill();
    }

    if(state) drawCursor(ctx, W, H, state);
  }
  draw();
  select.addEventListener('change', draw);
}

    ctx.fillText("x", W - 25, baseLine + 15);
    ctx.fillText("y", leftMargin - 15, 25);
    
    ctx.textAlign = 'center';
    [1, 2, 3].forEach(tick => {
        // X ticks
        ctx.fillText(tick, mapX(tick), baseLine + 18);
        ctx.beginPath(); ctx.moveTo(mapX(tick), baseLine); ctx.lineTo(mapX(tick), baseLine+4); ctx.stroke();
    });
    ctx.textAlign = 'right';
    [1, 2, 3].forEach(tick => {
        // Y ticks
        ctx.fillText(tick, leftMargin - 10, mapY(tick) + 4);
        ctx.beginPath(); ctx.moveTo(leftMargin - 4, mapY(tick)); ctx.lineTo(leftMargin, mapY(tick)); ctx.stroke();
    });
    ctx.textAlign = 'left';

    // Draw R2 Region (Rectangle from x:0->2, y:1->3)
    ctx.fillStyle = 'rgba(139, 233, 253, 0.15)'; // Cyan tint
    ctx.fillRect(mapX(0), mapY(3), mapX(2) - mapX(0), mapY(1) - mapY(3));
    
    // Hatching lines for R2
    ctx.strokeStyle = 'rgba(139, 233, 253, 0.3)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i = 0; i < (mapX(2) - mapX(0)); i += 10) {
        ctx.moveTo(mapX(0) + i, mapY(1));
        let yEnd = mapY(1) - i;
        let xEnd = mapX(0);
        if (yEnd < mapY(3)) {
            let diff = mapY(3) - yEnd;
            yEnd = mapY(3);
            xEnd = mapX(0) + diff;
        }
        ctx.lineTo(mapX(0) + i, mapY(3)); // simple vertical lines to match sir's diagram
    }
    for(let i = mapX(0); i <= mapX(2); i+=10) {
        ctx.moveTo(i, mapY(1)); ctx.lineTo(i, mapY(3));
    }
    ctx.stroke();

    // R2 Outline
    ctx.strokeStyle = '#50fa7b'; ctx.lineWidth = 2; // Green outline
    ctx.strokeRect(mapX(0), mapY(3), mapX(2) - mapX(0), mapY(1) - mapY(3));

    // Integration Strip (Vertical)
    const stripWidth = 16;
    const currentX = mapX(x_val);
    
    ctx.fillStyle = 'rgba(255, 121, 198, 0.6)'; // Pink strip
    ctx.fillRect(currentX - stripWidth/2, mapY(3), stripWidth, mapY(1) - mapY(3));
    ctx.strokeStyle = '#ff79c6'; ctx.lineWidth = 2;
    ctx.strokeRect(currentX - stripWidth/2, mapY(3), stripWidth, mapY(1) - mapY(3));

    // Arrows on the strip
    ctx.beginPath(); ctx.lineWidth = 3;
    ctx.moveTo(currentX - 20, mapY(2)); ctx.lineTo(currentX + 20, mapY(2));
    ctx.lineTo(currentX + 10, mapY(2) - 6); ctx.moveTo(currentX + 20, mapY(2)); ctx.lineTo(currentX + 10, mapY(2) + 6);
    ctx.stroke();

    // Annotations
    ctx.fillStyle = '#50fa7b'; ctx.font = 'bold 14px Inter';
    ctx.fillText("R₂", mapX(2) + 10, mapY(2));
    
    ctx.fillStyle = '#ff79c6'; ctx.font = 'bold 12px JetBrains Mono';
    ctx.fillText("y=3", currentX - 10, mapY(3) - 10);
    ctx.fillText("y=1", currentX - 10, mapY(1) + 20);

    drawCursor(ctx, W, H, state);
  }
  
  draw();
  slider.addEventListener('input', draw);
}

// ── 32. Triangular 2D Arrow Method Simulator ──
function initArrowMethodSim() {
  const canvas = document.getElementById('canvas-arrow_method_sim');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const select = document.getElementById('select-arrow_method_sim');
  
  // Inject a slider specifically for this simulator dynamically
  const wrapper = select.parentElement;
  const sliderHtml = `
    <div style="margin-top:10px;">
      <div style="display:flex; justify-content:space-between; font-family:var(--ui); font-size:12px; color:var(--accent);">
        <span>Sweep Start</span>
        <span style="font-weight:bold; color:var(--red);">Current x: <span id="val-arrow_sim">0.50</span></span>
        <span>Sweep End</span>
      </div>
      <input type="range" id="slide-arrow_sim" min="0" max="1" step="0.01" value="0.5" style="width:100%; margin:5px 0 15px; cursor:pointer;">
    </div>
  `;
  select.insertAdjacentHTML('afterend', sliderHtml);
  
  const slider = document.getElementById('slide-arrow_sim');
  const valDisplay = document.getElementById('val-arrow_sim');
  const state = setupInteractive(canvas);

  function draw() {
    const W = canvas.offsetWidth, H = canvas.height;
    canvas.width = W; ctx.clearRect(0, 0, W, H);
    
    const mode = select.value;
    
    // Clamp the slider based on mode
    let x_val = parseFloat(slider.value);
    if (mode === "sub" && x_val < 0.5) {
        x_val = 0.5;
        slider.value = 0.5;
    }
    valDisplay.textContent = x_val.toFixed(2);
    
    const baseLine = H - 50;
    const leftMargin = 60;
    
    // Scale helpers (X from -0.2 to 1.2, Y from -0.2 to 1.2)
    const span = 1.4;
    const scaleX = (W - leftMargin - 40) / span;
    const scaleY = (baseLine - 30) / span;

    const mapX = (val) => leftMargin + ((val + 0.2) * scaleX);
    const mapY = (val) => baseLine - ((val + 0.2) * scaleY);

    // Draw Grid
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i=-0.2; i<=1.2; i+=0.2) { ctx.moveTo(mapX(i), 0); ctx.lineTo(mapX(i), H); }
    for(let i=-0.2; i<=1.2; i+=0.2) { ctx.moveTo(0, mapY(i)); ctx.lineTo(W, mapY(i)); }
    ctx.stroke();

    // Draw Axes (Origin is now offset)
    const originX = mapX(0);
    const originY = mapY(0);
    
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath();
    ctx.moveTo(30, originY); ctx.lineTo(W - 20, originY); // X Axis
    ctx.moveTo(originX, baseLine + 10); ctx.lineTo(originX, 20); // Y Axis
    ctx.stroke();

    // Labels & Ticks
    ctx.fillStyle = '#fff'; ctx.font = '11px "JetBrains Mono"';
    ctx.fillText("x", W - 25, originY + 15);
    ctx.fillText("y", originX - 15, 25);
    
    ctx.textAlign = 'center';
    [0.5, 1].forEach(tick => {
        ctx.fillText(tick, mapX(tick), originY + 18);
        ctx.beginPath(); ctx.moveTo(mapX(tick), originY); ctx.lineTo(mapX(tick), originY+4); ctx.stroke();
    });
    ctx.textAlign = 'right';
    [0.5, 1].forEach(tick => {
        ctx.fillText(tick, originX - 10, mapY(tick) + 4);
        ctx.beginPath(); ctx.moveTo(originX - 4, mapY(tick)); ctx.lineTo(originX, mapY(tick)); ctx.stroke();
    });
    ctx.textAlign = 'left';
    ctx.fillText("0", originX - 12, originY + 15);

    // --- DRAW REGIONS ---
    if (mode === 'full') {
        // Full Triangle Region
        ctx.fillStyle = 'rgba(189, 147, 249, 0.2)'; // Purple tint
        ctx.beginPath();
        ctx.moveTo(mapX(0), mapY(0));
        ctx.lineTo(mapX(1), mapY(0));
        ctx.lineTo(mapX(0), mapY(1));
        ctx.fill();
        
        ctx.strokeStyle = '#bd93f9'; ctx.lineWidth = 2;
        ctx.stroke();
        
        ctx.fillStyle = '#bd93f9'; ctx.font = 'bold 14px Inter';
        ctx.fillText("R2 (Full)", mapX(0.2), mapY(0.2));
        
        ctx.fillStyle = '#ff79c6';
        ctx.fillText("Sweeping: x=0 to x=1", mapX(0.4), mapY(0.8));

    } else if (mode === 'sub') {
        // Full Triangle Outline (Faded)
        ctx.strokeStyle = 'rgba(189, 147, 249, 0.3)'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(mapX(0), mapY(0)); ctx.lineTo(mapX(1), mapY(0)); ctx.lineTo(mapX(0), mapY(1)); ctx.closePath();
        ctx.stroke();

        // Sub Region (x >= 0.5)
        ctx.fillStyle = 'rgba(255, 184, 108, 0.3)'; // Orange tint
        ctx.beginPath();
        ctx.moveTo(mapX(0.5), mapY(0));
        ctx.lineTo(mapX(1), mapY(0));
        ctx.lineTo(mapX(0.5), mapY(0.5));
        ctx.fill();
        
        ctx.strokeStyle = '#ffb86c'; ctx.lineWidth = 2;
        ctx.stroke();
        
        ctx.fillStyle = '#ffb86c'; ctx.font = 'bold 14px Inter';
        ctx.fillText("R1' (X ≥ 1/2)", mapX(0.55), mapY(0.15));
        
        ctx.fillStyle = '#ff79c6';
        ctx.fillText("Sweeping: x=0.5 to x=1", mapX(0.5), mapY(0.8));
    }

    // Boundary Line Equation
    ctx.save();
    ctx.translate(mapX(0.5), mapY(0.5));
    ctx.rotate(Math.PI / 4); // 45 deg slope
    ctx.fillStyle = '#fff'; ctx.font = '12px JetBrains Mono';
    ctx.fillText("x + y = 1", 20, -10);
    ctx.restore();

    // --- DRAW INTEGRATION STRIP (ARROW) ---
    const currentX = mapX(x_val);
    const stripHeight = mapY(1 - x_val); // Top of the arrow
    
    // Draw the strip body (Pink hatched or filled)
    const stripWidth = 12;
    ctx.fillStyle = 'rgba(255, 121, 198, 0.4)';
    ctx.fillRect(currentX - stripWidth/2, stripHeight, stripWidth, originY - stripHeight);

    // Draw the Arrow Head pointing UP
    ctx.strokeStyle = '#ff79c6'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(currentX, originY); // Arrow Tail at y=0
    ctx.lineTo(currentX, stripHeight); // Arrow Shaft
    
    // Arrow Head
    ctx.lineTo(currentX - 6, stripHeight + 8);
    ctx.moveTo(currentX, stripHeight);
    ctx.lineTo(currentX + 6, stripHeight + 8);
    ctx.stroke();
    
    // Limits annotations next to arrow
    ctx.fillStyle = '#ff79c6'; ctx.font = 'bold 12px JetBrains Mono';
    ctx.fillText(`y = 1 - ${x_val.toFixed(2)}`, currentX - 10, stripHeight - 10);
    ctx.fillText(`y = 0`, currentX + 15, originY - 5);

    drawCursor(ctx, W, H, state);
  }
  
  draw();
  slider.addEventListener('input', draw);
  select.addEventListener('change', draw);
}

// ── 33. Joint PMF Table Simulator ──
function initJointPmfTableSim() {
  const canvas = document.getElementById('canvas-joint_pmf_table_sim');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const select = document.getElementById('select-joint_pmf_table_sim');
  const state = setupInteractive(canvas);

  // Table Data Structure for C(x^2 + 2y)
  const grid = [
      { x: 0, y: 1, val: 2 }, { x: 0, y: 2, val: 4 }, { x: 0, y: 3, val: 6 }, { x: 0, y: 4, val: 8 },
      { x: 1, y: 1, val: 3 }, { x: 1, y: 2, val: 5 }, { x: 1, y: 3, val: 7 }, { x: 1, y: 4, val: 9 },
      { x: 2, y: 1, val: 6 }, { x: 2, y: 2, val: 8 }, { x: 2, y: 3, val: 10 }, { x: 2, y: 4, val: 12 }
  ];
  const rowSums = [20, 24, 36];
  const colSums = [11, 17, 23, 29];

  function draw() {
    const W = canvas.offsetWidth, H = canvas.height;
    canvas.width = W; ctx.clearRect(0, 0, W, H);
    
    const mode = select.value;
    
    // Layout parameters
    const cellW = (W - 100) / 5; // 5 columns (Headers + 4 Y cols)
    const cellH = (H - 60) / 4;  // 4 rows (Headers + 3 X rows)
    const startX = 40;
    const startY = 30;

    // Helper to get cell rect
    const getCellRect = (col, row) => ({
        x: startX + (col * cellW),
        y: startY + (row * cellH),
        w: cellW,
        h: cellH
    });

    // --- DRAW BACKGROUND HIGHLIGHTS ---
    if (mode === "full") {
        ctx.fillStyle = 'rgba(189, 147, 249, 0.2)'; // Highlight whole grid
        ctx.fillRect(startX + cellW, startY + cellH, cellW * 4, cellH * 3);
        ctx.fillStyle = '#bd93f9'; ctx.font = 'bold 12px Inter';
        ctx.fillText("Total Sum = 80C = 1  →  C = 1/80", startX + cellW, startY - 10);
        
    } else if (mode === "q2") {
        // Highlight x=2, y=3 (which is row 3, col 3 in data coordinates, but row index 3, col index 3 visually)
        const rect = getCellRect(3, 3);
        ctx.fillStyle = 'rgba(57, 211, 83, 0.4)';
        ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
        
        ctx.strokeStyle = '#39d353'; ctx.lineWidth = 2;
        ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
        
        ctx.fillStyle = '#39d353'; ctx.font = 'bold 12px Inter';
        ctx.fillText("P(X=2 ∩ Y=3) = 10C", startX + cellW, startY - 10);

    } else if (mode === "q3") {
        // Highlight x<=1 (rows 1,2) and y>2 (cols 3,4)
        ctx.fillStyle = 'rgba(255, 121, 198, 0.3)';
        ctx.fillRect(startX + (cellW*3), startY + cellH, cellW * 2, cellH * 2);
        
        ctx.strokeStyle = '#ff79c6'; ctx.lineWidth = 2;
        ctx.strokeRect(startX + (cellW*3), startY + cellH, cellW * 2, cellH * 2);

        ctx.fillStyle = '#ff79c6'; ctx.font = 'bold 12px Inter';
        ctx.fillText("P(X≤1 ∩ Y>2) = 6C+8C+7C+9C = 30C", startX + cellW, startY - 10);

    } else if (mode === "marginal") {
        // Highlight Marginal zones (right block and bottom block - simulated)
        ctx.fillStyle = 'rgba(241, 250, 140, 0.2)';
        // Draw simulated marginal column on right
        ctx.fillRect(startX + (cellW*5) + 5, startY + cellH, cellW*0.8, cellH * 3);
        // Draw simulated marginal row on bottom
        ctx.fillRect(startX + cellW, startY + (cellH*4) + 5, cellW * 4, cellH*0.8);
        
        ctx.fillStyle = '#f1fa8c'; ctx.font = 'bold 12px Inter';
        ctx.fillText("Marginal PMFs sum the rows (pX) and columns (pY)", startX + cellW, startY - 10);
    }

    // --- DRAW GRID LINES ---
    ctx.strokeStyle = '#444'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let c = 0; c <= 5; c++) { // Verticals
        ctx.moveTo(startX + (c * cellW), startY);
        ctx.lineTo(startX + (c * cellW), startY + (4 * cellH));
    }
    for (let r = 0; r <= 4; r++) { // Horizontals
        ctx.moveTo(startX, startY + (r * cellH));
        ctx.lineTo(startX + (5 * cellW), startY + (r * cellH));
    }
    ctx.stroke();

    // --- DRAW TEXT ---
    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px "JetBrains Mono"';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    
    // Headers
    const cx = (col) => startX + (col * cellW) + (cellW / 2);
    const cy = (row) => startY + (row * cellH) + (cellH / 2);

    ctx.fillStyle = '#8be9fd';
    ctx.fillText("X \\ Y", cx(0), cy(0));
    for (let y = 1; y <= 4; y++) ctx.fillText(`Y=${y}`, cx(y), cy(0));
    for (let x = 0; x <= 2; x++) ctx.fillText(`X=${x}`, cx(0), cy(x+1));

    // Inner Grid Values
    ctx.fillStyle = '#fff';
    ctx.font = '14px "JetBrains Mono"';
    grid.forEach(cell => {
        let isHighlighted = false;
        if (mode === "q2" && cell.x === 2 && cell.y === 3) isHighlighted = true;
        if (mode === "q3" && cell.x <= 1 && cell.y > 2) isHighlighted = true;

        if (isHighlighted) {
            ctx.fillStyle = '#fff'; 
            ctx.font = 'bold 16px "JetBrains Mono"';
        } else {
            ctx.fillStyle = (mode !== "full" && mode !== "marginal") ? '#888' : '#ccc';
            ctx.font = '14px "JetBrains Mono"';
        }

        ctx.fillText(`${cell.val}C`, cx(cell.y), cy(cell.x + 1));
    });

    // Draw Marginals if requested
    if (mode === "marginal") {
        ctx.fillStyle = '#f1fa8c'; ctx.font = 'bold 12px "JetBrains Mono"';
        // Rows (pX)
        for (let x = 0; x <= 2; x++) {
            ctx.fillText(`${rowSums[x]}C`, startX + (cellW*5) + (cellW*0.4), cy(x+1));
        }
        // Cols (pY)
        for (let y = 1; y <= 4; y++) {
            ctx.fillText(`${colSums[y-1]}C`, cx(y), startY + (cellH*4) + (cellH*0.4));
        }
        ctx.font = '10px "JetBrains Mono"';
        ctx.fillText("pX(x) →", startX + (cellW*5) + (cellW*0.4), cy(0));
        ctx.fillText("pY(y) ↓", cx(0), startY + (cellH*4) + (cellH*0.4));
    }

    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    drawCursor(ctx, W, H, state);
  }
  
  draw();
  select.addEventListener('change', draw);
}
// ── 34. Sum of Gaussian RVs & Q-Function Simulator ──
function initSumGaussianSim() {
  const canvas = document.getElementById('canvas-sum_gaussian_sim');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  
  // Inject sliders for Means and Variances
  const wrapper = document.getElementById('slide-sum_gaussian_sim').parentElement;
  const topHtml = `
    <div style="display:flex; gap:15px; margin-bottom:15px; background:rgba(0,0,0,0.2); padding:10px; border-radius:4px;">
      <div style="flex:1;">
        <div style="color:#8be9fd; font-family:var(--ui); font-size:12px; font-weight:bold; margin-bottom:5px;">Variable X₁ (Cyan)</div>
        <label style="font-size:10px; color:#ccc;">μ₁: <span id="val_mu1">2.0</span></label>
        <input type="range" id="slide_mu1" min="-5" max="10" step="0.5" value="2" style="width:100%; margin-bottom:8px;">
        <label style="font-size:10px; color:#ccc;">σ₁²: <span id="val_var1">4.0</span></label>
        <input type="range" id="slide_var1" min="1" max="10" step="0.5" value="4" style="width:100%;">
      </div>
      <div style="flex:1;">
        <div style="color:#ffb86c; font-family:var(--ui); font-size:12px; font-weight:bold; margin-bottom:5px;">Variable X₂ (Orange)</div>
        <label style="font-size:10px; color:#ccc;">μ₂: <span id="val_mu2">3.0</span></label>
        <input type="range" id="slide_mu2" min="-5" max="10" step="0.5" value="3" style="width:100%; margin-bottom:8px;">
        <label style="font-size:10px; color:#ccc;">σ₂²: <span id="val_var2">5.0</span></label>
        <input type="range" id="slide_var2" min="1" max="10" step="0.5" value="5" style="width:100%;">
      </div>
    </div>
  `;
  wrapper.insertAdjacentHTML('afterbegin', topHtml);

  const slideA = document.getElementById('slide-sum_gaussian_sim');
  const slideMu1 = document.getElementById('slide_mu1');
  const slideVar1 = document.getElementById('slide_var1');
  const slideMu2 = document.getElementById('slide_mu2');
  const slideVar2 = document.getElementById('slide_var2');
  
  const valA = document.getElementById('val-sum_gaussian_sim');
  const state = setupInteractive(canvas);

  // Q-Function Approximation
  function q_approx(x) {
    if (x < 0) return 1 - q_approx(-x);
    const t = 1 / (1 + 0.2316419 * x);
    const pdf = (1 / Math.sqrt(2 * Math.PI)) * Math.exp(-0.5 * x * x);
    return pdf * (0.3193815*t - 0.3565638*Math.pow(t,2) + 1.781477*Math.pow(t,3) - 1.821256*Math.pow(t,4) + 1.330274*Math.pow(t,5));
  }

  function draw() {
    const W = canvas.offsetWidth, H = canvas.height;
    canvas.width = W; ctx.clearRect(0, 0, W, H);
    
    // Read Values
    const a = parseFloat(slideA.value);
    const mu1 = parseFloat(slideMu1.value);
    const var1 = parseFloat(slideVar1.value);
    const mu2 = parseFloat(slideMu2.value);
    const var2 = parseFloat(slideVar2.value);
    
    // Update labels
    valA.textContent = a.toFixed(1);
    document.getElementById('val_mu1').textContent = mu1.toFixed(1);
    document.getElementById('val_var1').textContent = var1.toFixed(1);
    document.getElementById('val_mu2').textContent = mu2.toFixed(1);
    document.getElementById('val_var2').textContent = var2.toFixed(1);

    // Calculate Sum Z
    const muZ = mu1 + mu2;
    const varZ = var1 + var2; // Because Independent, Cov=0
    const sigmaZ = Math.sqrt(varZ);

    const baseLine = H - 60;
    
    // Grid Setup (X from -10 to 25)
    const minX = -10, maxX = 25;
    const mapX = (val) => 30 + ((val - minX) / (maxX - minX)) * (W - 60);
    
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i=minX; i<=maxX; i+=5) { ctx.moveTo(mapX(i), 0); ctx.lineTo(mapX(i), H); }
    for(let i=0; i<=4; i++) { ctx.moveTo(0, i*(H/4)); ctx.lineTo(W, i*(H/4)); }
    ctx.stroke();

    // Axes
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath();
    ctx.moveTo(20, baseLine); ctx.lineTo(W - 20, baseLine); // X Axis
    ctx.moveTo(mapX(0), baseLine + 10); ctx.lineTo(mapX(0), 20); // Y Axis
    ctx.stroke();

    // X-Axis Ticks
    ctx.fillStyle = '#fff'; ctx.font = '10px "JetBrains Mono"'; ctx.textAlign = 'center';
    for(let i=minX; i<=maxX; i+=5) {
        ctx.fillText(i, mapX(i), baseLine + 15);
        ctx.beginPath(); ctx.moveTo(mapX(i), baseLine); ctx.lineTo(mapX(i), baseLine+4); ctx.stroke();
    }
    ctx.textAlign = 'left';

    // Helper to draw Gaussian curves
    const drawCurve = (mu, variance, color, fillAlpha) => {
        const sigma = Math.sqrt(variance);
        ctx.beginPath();
        for(let i = 30; i <= W - 30; i++) {
            let x_val = minX + ((i - 30) / (W - 60)) * (maxX - minX);
            let pdf = (1 / (sigma * Math.sqrt(2 * Math.PI))) * Math.exp(-0.5 * Math.pow((x_val - mu)/sigma, 2));
            let y = baseLine - (pdf * 800); // Scale Y visually
            if(i === 30) ctx.moveTo(i, y); else ctx.lineTo(i, y);
        }
        ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
        
        if (fillAlpha > 0) {
            ctx.lineTo(W-30, baseLine); ctx.lineTo(30, baseLine);
            ctx.fillStyle = color.replace('1)', `${fillAlpha})`).replace('rgb', 'rgba');
            ctx.fill();
        }
    };

    // Draw X1 and X2 (Faded)
    drawCurve(mu1, var1, 'rgb(139, 233, 253)', 0); // Cyan
    drawCurve(mu2, var2, 'rgb(255, 184, 108)', 0); // Orange

    // Draw Z = X1 + X2 (Prominent)
    drawCurve(muZ, varZ, 'rgb(80, 250, 123)', 0.1); // Green

    // Highlight P(Z > a) Tail Area
    const a_px = mapX(a);
    ctx.fillStyle = 'rgba(80, 250, 123, 0.4)';
    ctx.beginPath();
    ctx.moveTo(a_px, baseLine);
    for(let i = a_px; i <= W - 30; i++) {
        let x_val = minX + ((i - 30) / (W - 60)) * (maxX - minX);
        let pdf = (1 / (sigmaZ * Math.sqrt(2 * Math.PI))) * Math.exp(-0.5 * Math.pow((x_val - muZ)/sigmaZ, 2));
        ctx.lineTo(i, baseLine - (pdf * 800));
    }
    ctx.lineTo(W - 30, baseLine);
    ctx.fill();

    // Draw 'a' threshold line
    ctx.strokeStyle = '#50fa7b'; ctx.setLineDash([4,4]); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(a_px, baseLine); ctx.lineTo(a_px, baseLine - 150); ctx.stroke(); ctx.setLineDash([]);

    // --- CALCULATE AND DISPLAY Q-FUNCTION PROBABILITY ---
    const qInput = (a - muZ) / sigmaZ;
    const probability = qInput < -5 ? 1 : (qInput > 5 ? 0 : q_approx(qInput)); // Clamp extremes

    ctx.fillStyle = '#50fa7b'; ctx.font = 'bold 14px Inter';
    ctx.fillText(`Z = X₁ + X₂`, 40, 30);
    ctx.font = '13px JetBrains Mono';
    ctx.fillText(`μ_Z = ${mu1.toFixed(1)} + ${mu2.toFixed(1)} = ${muZ.toFixed(1)}`, 40, 50);
    ctx.fillText(`σ_Z² = ${var1.toFixed(1)} + ${var2.toFixed(1)} = ${varZ.toFixed(1)}`, 40, 70);
    
    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px Inter';
    ctx.fillText(`P(Z > a) = Q( (a - μ_Z) / σ_Z )`, 40, 105);
    ctx.fillStyle = '#ff79c6';
    ctx.fillText(`P(Z > ${a.toFixed(1)}) = Q( (${a.toFixed(1)} - ${muZ.toFixed(1)}) / ${sigmaZ.toFixed(2)} )`, 40, 125);
    ctx.fillText(`= Q(${qInput.toFixed(2)}) = ${(probability * 100).toFixed(2)}%`, 40, 145);

    drawCursor(ctx, W, H, state);
  }
  
  draw();
  slideA.addEventListener('input', draw);
  slideMu1.addEventListener('input', draw);
  slideVar1.addEventListener('input', draw);
  slideMu2.addEventListener('input', draw);
  slideVar2.addEventListener('input', draw);
}

// ── 35. Simple Z-Score Converter Simulator ──
function initSimpleZScoreSim() {
  const canvas = document.getElementById('canvas-simple_z_score_sim');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  
  // Inject sliders for Mean and Variance
  const wrapper = document.getElementById('slide-simple_z_score_sim').parentElement;
  const topHtml = `
    <div style="display:flex; gap:15px; margin-bottom:15px; background:rgba(0,0,0,0.2); padding:10px; border-radius:4px;">
      <div style="flex:1;">
        <label style="font-family:var(--ui); font-size:11px; color:#ccc;">Mean (μ): <span id="val_z_mu" style="color:#8be9fd; font-weight:bold;">10.0</span></label>
        <input type="range" id="slide_z_mu" min="0" max="20" step="1" value="10" style="width:100%; margin-bottom:8px;">
      </div>
      <div style="flex:1;">
        <label style="font-family:var(--ui); font-size:11px; color:#ccc;">Variance (σ²): <span id="val_z_var" style="color:#ffb86c; font-weight:bold;">16.0</span></label>
        <input type="range" id="slide_z_var" min="1" max="25" step="1" value="16" style="width:100%;">
      </div>
    </div>
  `;
  wrapper.insertAdjacentHTML('afterbegin', topHtml);

  const slideA = document.getElementById('slide-simple_z_score_sim');
  const slideMu = document.getElementById('slide_z_mu');
  const slideVar = document.getElementById('slide_z_var');
  const valA = document.getElementById('val-simple_z_score_sim');
  const state = setupInteractive(canvas);

  // Q-Function Approximation
  function q_approx(x) {
    if (x < 0) return 1 - q_approx(-x);
    const t = 1 / (1 + 0.2316419 * x);
    const pdf = (1 / Math.sqrt(2 * Math.PI)) * Math.exp(-0.5 * x * x);
    return pdf * (0.3193815*t - 0.3565638*Math.pow(t,2) + 1.781477*Math.pow(t,3) - 1.821256*Math.pow(t,4) + 1.330274*Math.pow(t,5));
  }

  function draw() {
    const W = canvas.offsetWidth, H = canvas.height;
    canvas.width = W; ctx.clearRect(0, 0, W, H);
    
    // Read Values
    const a = parseFloat(slideA.value);
    const mu = parseFloat(slideMu.value);
    const variance = parseFloat(slideVar.value);
    const sigma = Math.sqrt(variance);
    
    // Update labels
    valA.textContent = a.toFixed(1);
    document.getElementById('val_z_mu').textContent = mu.toFixed(1);
    document.getElementById('val_z_var').textContent = variance.toFixed(1) + ` (σ = ${sigma.toFixed(1)})`;

    // Calculate Z
    const z_score = (a - mu) / sigma;
    const prob = q_approx(z_score);

    const baseLine = H - 70;
    
    // Grid Setup (X from -10 to 30)
    const minX = -10, maxX = 30;
    const mapX = (val) => 30 + ((val - minX) / (maxX - minX)) * (W - 60);
    
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i=minX; i<=maxX; i+=5) { ctx.moveTo(mapX(i), 0); ctx.lineTo(mapX(i), H); }
    for(let i=0; i<=4; i++) { ctx.moveTo(0, i*(H/4)); ctx.lineTo(W, i*(H/4)); }
    ctx.stroke();

    // Axes
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath();
    ctx.moveTo(20, baseLine); ctx.lineTo(W - 20, baseLine); // X Axis
    ctx.moveTo(mapX(0), baseLine + 10); ctx.lineTo(mapX(0), 20); // Y Axis
    ctx.stroke();

    // X-Axis Ticks
    ctx.fillStyle = '#fff'; ctx.font = '10px "JetBrains Mono"'; ctx.textAlign = 'center';
    for(let i=minX; i<=maxX; i+=5) {
        ctx.fillText(i, mapX(i), baseLine + 15);
        ctx.beginPath(); ctx.moveTo(mapX(i), baseLine); ctx.lineTo(mapX(i), baseLine+4); ctx.stroke();
    }
    ctx.textAlign = 'left';

    // 1. Draw STANDARD NORMAL (Faded Background)
    ctx.beginPath();
    for(let i = 30; i <= W - 30; i++) {
        let x_val = minX + ((i - 30) / (W - 60)) * (maxX - minX);
        let pdf = (1 / Math.sqrt(2 * Math.PI)) * Math.exp(-0.5 * Math.pow(x_val, 2));
        let y = baseLine - (pdf * 300); // Scale Y visually
        if(i === 30) ctx.moveTo(i, y); else ctx.lineTo(i, y);
    }
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)'; ctx.fillText("Standard Normal (μ=0, σ=1)", mapX(1), baseLine - 100);

    // 2. Draw YOUR GAUSSIAN
    ctx.beginPath();
    for(let i = 30; i <= W - 30; i++) {
        let x_val = minX + ((i - 30) / (W - 60)) * (maxX - minX);
        let pdf = (1 / (sigma * Math.sqrt(2 * Math.PI))) * Math.exp(-0.5 * Math.pow((x_val - mu)/sigma, 2));
        let y = baseLine - (pdf * 300 * sigma); // Scale proportionally
        if(i === 30) ctx.moveTo(i, y); else ctx.lineTo(i, y);
    }
    ctx.strokeStyle = '#8be9fd'; ctx.lineWidth = 3; ctx.stroke();

    // 3. Highlight P(X > a) Tail Area
    const a_px = mapX(a);
    ctx.fillStyle = 'rgba(80, 250, 123, 0.4)';
    ctx.beginPath();
    ctx.moveTo(a_px, baseLine);
    for(let i = a_px; i <= W - 30; i++) {
        let x_val = minX + ((i - 30) / (W - 60)) * (maxX - minX);
        let pdf = (1 / (sigma * Math.sqrt(2 * Math.PI))) * Math.exp(-0.5 * Math.pow((x_val - mu)/sigma, 2));
        ctx.lineTo(i, baseLine - (pdf * 300 * sigma));
    }
    ctx.lineTo(W - 30, baseLine);
    ctx.fill();

    // Threshold Line
    ctx.strokeStyle = '#50fa7b'; ctx.setLineDash([4,4]); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(a_px, baseLine); ctx.lineTo(a_px, baseLine - 100); ctx.stroke(); ctx.setLineDash([]);

    // --- MATH READOUT ---
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px Inter';
    ctx.fillText(`1. Formula: Z = (X - μ) / σ`, 30, 30);
    
    ctx.fillStyle = '#ffb86c';
    ctx.fillText(`2. Math: Z = (${a.toFixed(1)} - ${mu.toFixed(1)}) / ${sigma.toFixed(1)} = ${z_score.toFixed(2)}`, 30, 50);

    ctx.fillStyle = '#50fa7b';
    if (z_score < 0) {
        ctx.fillText(`3. Q-Function: Q(${z_score.toFixed(2)})`, 30, 70);
        ctx.fillText(`4. Symmetry Rule: 1 - Q(${Math.abs(z_score).toFixed(2)}) = ${(prob * 100).toFixed(2)}%`, 30, 90);
    } else {
        ctx.fillText(`3. Q-Function: Q(${z_score.toFixed(2)}) = ${(prob * 100).toFixed(2)}%`, 30, 70);
    }

    drawCursor(ctx, W, H, state);
  }
  
  draw();
  slideA.addEventListener('input', draw);
  slideMu.addEventListener('input', draw);
  slideVar.addEventListener('input', draw);
}
// ── 36. Convolution Shape Trick Simulator ──
function initConvolutionShapeSim() {
  const canvas = document.getElementById('canvas-convolution_shape_sim');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  
  // Inject slider for Width 1
  const wrapper = document.getElementById('slide-convolution_shape_sim').parentElement;

    <div style="margin-bottom:10px;">
      <label style="font-family:var(--ui); font-size:11px; color:#ccc;">Width of Uniform RV 1 (Fixed at 4)</label>
      <input type="range" disabled value="4" style="width:100%; opacity:0.5; margin-top:5px;">
    </div>
  `;
  wrapper.insertAdjacentHTML('afterbegin', topHtml);

  const slideW2 = document.getElementById('slide-convolution_shape_sim');
  const valW2 = document.getElementById('val-convolution_shape_sim');
  const state = setupInteractive(canvas);

  function draw() {
    const W = canvas.offsetWidth, H = canvas.height;
    canvas.width = W; ctx.clearRect(0, 0, W, H);
    
    // Read Values
    const w1 = 4; // Fixed width for RV1 (e.g., U[-2,2])
    const w2 = parseFloat(slideW2.value); // Variable width for RV2
    valW2.textContent = w2.toFixed(1);
    
    const h1 = 1 / w1;
    const h2 = 1 / w2;

    // Convolution Math
    const totalWidth = w1 + w2;
    const flatWidth = Math.abs(w1 - w2);
    const minWidth = Math.min(w1, w2);
    const maxHeight = minWidth * h1 * h2;

    const baseLine = H - 60;
    const cx = W / 2;
    
    // Scale X to fit max possible width (4 + 10 = 14)
    const scaleX = (W - 80) / 16; 
    const mapX = (val) => cx + (val * scaleX);
    
    // Scale Y visually
    const visualScaleY = (baseLine - 40) / 0.3; // max possible height is 0.25

    // Grid Setup
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i=-8; i<=8; i+=2) { ctx.moveTo(mapX(i), 0); ctx.lineTo(mapX(i), H); }
    for(let i=0; i<=4; i++) { ctx.moveTo(0, i*(H/4)); ctx.lineTo(W, i*(H/4)); }
    ctx.stroke();

    // Axes
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath();
    ctx.moveTo(20, baseLine); ctx.lineTo(W - 20, baseLine); // X Axis
    ctx.moveTo(cx, baseLine + 10); ctx.lineTo(cx, 20); // Y Axis
    ctx.stroke();

    // X-Axis Ticks
    ctx.fillStyle = '#fff'; ctx.font = '10px "JetBrains Mono"'; ctx.textAlign = 'center';
    for(let i=-8; i<=8; i+=2) {
        ctx.fillText(i, mapX(i), baseLine + 15);
        ctx.beginPath(); ctx.moveTo(mapX(i), baseLine); ctx.lineTo(mapX(i), baseLine+4); ctx.stroke();
    }
    ctx.textAlign = 'left';

    // --- DRAW RESULTING SHAPE (TRAPEZIUM OR TRIANGLE) ---
    const leftBound = -totalWidth / 2;
    const rightBound = totalWidth / 2;
    const flatLeft = -flatWidth / 2;
    const flatRight = flatWidth / 2;

    ctx.fillStyle = 'rgba(189, 147, 249, 0.3)';
    ctx.beginPath();
    ctx.moveTo(mapX(leftBound), baseLine);
    ctx.lineTo(mapX(flatLeft), baseLine - (maxHeight * visualScaleY));
    ctx.lineTo(mapX(flatRight), baseLine - (maxHeight * visualScaleY));
    ctx.lineTo(mapX(rightBound), baseLine);
    ctx.fill();

    ctx.strokeStyle = '#bd93f9'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(mapX(leftBound), baseLine);
    ctx.lineTo(mapX(flatLeft), baseLine - (maxHeight * visualScaleY));
    ctx.lineTo(mapX(flatRight), baseLine - (maxHeight * visualScaleY));
    ctx.lineTo(mapX(rightBound), baseLine);
    ctx.stroke();

    // Peak Height Dotted Line
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.setLineDash([4,4]); ctx.lineWidth = 1;
    ctx.beginPath(); 
    ctx.moveTo(cx, baseLine - (maxHeight * visualScaleY)); 
    ctx.lineTo(cx + 40, baseLine - (maxHeight * visualScaleY)); 
    ctx.stroke(); ctx.setLineDash([]);

    // --- MATH READOUT ---
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px Inter';
    ctx.fillText(w1 === w2 ? `Shape: TRIANGLE` : `Shape: TRAPEZIUM`, 30, 30);
    
    ctx.fillStyle = '#8be9fd'; ctx.font = '12px JetBrains Mono';
    ctx.fillText(`Base Width: W1 + W2 = ${totalWidth.toFixed(1)}`, 30, 50);
    ctx.fillText(`Flat Top: |W1 - W2| = ${flatWidth.toFixed(1)}`, 30, 70);
    
    ctx.fillStyle = '#ffb86c';
    ctx.fillText(`Max Height: min(W1,W2) * H1 * H2`, 30, 95);
    ctx.fillText(`          = ${minWidth} * (1/${w1}) * (1/${w2}) = ${maxHeight.toFixed(3)}`, 30, 115);

    drawCursor(ctx, W, H, state);
  }
  
  draw();
  slideW2.addEventListener('input', draw);
}

<script>
// ============================================================
// 🎛️ HARDWARE RENDER HELPERS & PHYSICS ENGINE
// ============================================================

// 1. Grid Caching (Performance Upgrade)
const GridCache = {};
function getGrid(W, H, type) {
  const key = `${W}x${H}_${type}`;
  if (GridCache[key]) return GridCache[key];
  
  const c = document.createElement('canvas');
  c.width = Math.max(1, W); c.height = Math.max(1, H);
  const ctx = c.getContext('2d');
  
  if (type === 'osc') {
    const dx = W / 10, dy = H / 8;
    ctx.strokeStyle = 'rgba(57, 211, 83, 0.15)'; 
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i=0; i<=10; i++) { ctx.moveTo(i*dx, 0); ctx.lineTo(i*dx, H); }
    for(let i=0; i<=8; i++) { ctx.moveTo(0, i*dy); ctx.lineTo(W, i*dy); }
    ctx.stroke();
    // Center Crosshairs
    ctx.strokeStyle = 'rgba(57, 211, 83, 0.4)';
    ctx.beginPath();
    ctx.moveTo(0, H/2); ctx.lineTo(W, H/2);
    ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H);
    ctx.stroke();
  } else if (type === 'spec') {
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)'; 
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i=0; i<=10; i++) { ctx.moveTo(i*(W/10), 0); ctx.lineTo(i*(W/10), H); }
    for(let i=0; i<=4; i++) { ctx.moveTo(0, i*(H/4)); ctx.lineTo(W, i*(H/4)); }
    ctx.stroke();
  }
  
  GridCache[key] = c;
  return c;
}

// 2. Interactive Cursor & Trigger State
// REPLACEMENT 1: Replace your setupInteractive function
function setupInteractive(canvas) {
  const state = { x: -1, y: -1, hover: false, paused: false, noise: 0 };
  
  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    state.x = e.clientX - rect.left;
    state.y = e.clientY - rect.top;
    state.hover = true;
  });
  canvas.addEventListener('mouseleave', () => state.hover = false);
  canvas.addEventListener('click', () => state.paused = !state.paused);
  
  // PRO FEATURE: Right-Click to Export/Snapshot
  canvas.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    const link = document.createElement('a');
    link.download = 'Oscilloscope_Capture_' + new Date().getTime() + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  // PRO FEATURE: Press 'N' while hovering to toggle Channel Noise
  window.addEventListener('keydown', (e) => {
    if (state.hover && e.key.toLowerCase() === 'n') {
      state.noise = state.noise === 0 ? 15 : 0; 
    }
  });

  return state;
}

function drawCursor(ctx, W, H, state) {
  if (!state.hover) return;
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
  ctx.setLineDash([3, 3]);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(state.x, 0); ctx.lineTo(state.x, H);
  ctx.moveTo(0, state.y); ctx.lineTo(W, state.y);
  ctx.stroke();
  ctx.setLineDash([]);
  
  ctx.fillStyle = '#fff';
  ctx.font = '10px "JetBrains Mono", monospace';
  const vOffset = state.y > H/2 ? -10 : 20;
  ctx.fillText(`t/f: ${state.x.toFixed(0)}`, state.x + 5, state.y + vOffset - 12);
  ctx.fillText(`Mag: ${(H/2 - state.y).toFixed(0)}`, state.x + 5, state.y + vOffset);
}

// 3. Signal Measurement (Vpp, RMS)
// REPLACEMENT 2: Replace your calcMeasurements function
function calcMeasurements(samples, Ac_pixels, nominal_V = 10) {
  if (samples.length === 0) return { vpp: "0.00", rms: "0.00", freq: "0.0" };
  let max = -Infinity, min = Infinity, sumSq = 0, crossings = 0;
  const scale = nominal_V / Ac_pixels;
  
  for (let i = 0; i < samples.length; i++) {
    let volts = samples[i] * scale;
    if (volts > max) max = volts;
    if (volts < min) min = volts;
    sumSq += volts * volts;
    
    // Zero-crossing detection for Freq estimation
    if (i > 0 && samples[i-1] < 0 && samples[i] >= 0) crossings++;
  }
  
  return { 
    vpp: (max - min).toFixed(2), 
    rms: Math.sqrt(sumSq / samples.length).toFixed(2),
    freq: (crossings * 10).toFixed(1) // Scaled for display
  };
}

// 4. Draw Overlays
function drawOscilloscope(ctx, W, H, ch1Label, timeLabel, metrics, state) {
  ctx.drawImage(getGrid(W, H, 'osc'), 0, 0);
  ctx.fillStyle = 'rgba(139, 148, 158, 0.9)';
  ctx.font = '10px "JetBrains Mono", monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`CH1: ${ch1Label}`, 10, H - 10);
  ctx.textAlign = 'right';
  ctx.fillText(`TIME: ${timeLabel}`, W - 10, H - 10);
  
  // REPLACEMENT 3: Update the if(metrics) block inside drawOscilloscope
  if (metrics) {
    ctx.textAlign = 'right';
    ctx.fillStyle = '#39d353';
    ctx.fillText(`Vpp:  ${metrics.vpp}V`, W - 10, 20);
    ctx.fillText(`Vrms: ${metrics.rms}V`, W - 10, 35);
    ctx.fillText(`Freq: ~${metrics.freq}kHz`, W - 10, 50);
    
    if (state && state.noise > 0) {
      ctx.fillStyle = '#d73a49';
      ctx.fillText(`[NOISE INJECTED]`, W - 10, 65);
    }
  }
  
  ctx.textAlign = 'left';
  if (state.paused) {
    ctx.fillStyle = '#d73a49';
    ctx.fillText(`[TRIGGER LOCKED]`, W - 10, 50);
  }
  ctx.textAlign = 'left';
}

function drawSpectrumAnalyzer(ctx, W, H, title, state) {
  ctx.drawImage(getGrid(W, H, 'spec'), 0, 0);
  const baseLine = H - 30;
  ctx.strokeStyle = '#555'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(20, baseLine); ctx.lineTo(W - 20, baseLine);
  ctx.lineTo(W - 25, baseLine - 5); ctx.moveTo(W - 20, baseLine); ctx.lineTo(W - 25, baseLine + 5);
  ctx.stroke();

  ctx.fillStyle = '#888'; ctx.font = '10px "JetBrains Mono", monospace';
  ctx.textAlign = 'right'; ctx.fillText("Freq (f) →", W - 25, baseLine + 15);
  ctx.textAlign = 'left'; ctx.fillText("Mag |S(f)|", 10, 15);
  if (title) {
    ctx.fillStyle = 'rgba(139, 148, 158, 0.9)'; ctx.textAlign = 'center';
    ctx.fillText(title, W/2, 15); ctx.textAlign = 'left';
  }
  if (state && state.paused) {
    ctx.textAlign = 'right'; ctx.fillStyle = '#d73a49';
    ctx.fillText(`[HOLD]`, W - 10, 15); ctx.textAlign = 'left';
  }
}

function drawLegend(ctx, x, y, color, label) {
  ctx.fillStyle = color; ctx.fillRect(x, y - 8, 10, 10);
  ctx.fillStyle = '#ccc'; ctx.font = '10px "Inter", sans-serif';
  ctx.fillText(label, x + 15, y);
}

// ============================================================
// ⚙️ SIMULATOR SCRIPTS
// ============================================================

// ── 1. AM Modulation Simulator ──
function initAMSim() {
  const canvas = document.getElementById('canvas-am_sim');
  if (!canvas) return; 
  const ctx = canvas.getContext('2d');
  const slider = document.getElementById('slide-am_sim');
  const valDisplay = document.getElementById('val-am_sim');
  const state = setupInteractive(canvas);
  let time = 0;

  function draw() {
    const W = canvas.offsetWidth, H = canvas.height;
    canvas.width = W; 
    ctx.clearRect(0, 0, W, H);
    
    const mu = parseFloat(slider.value);
    valDisplay.textContent = mu.toFixed(1);
    const fm = 0.02, fc = 0.5, Ac = H / 4.5;

    let samples = [];
    ctx.beginPath();
    ctx.strokeStyle = '#4a90e2';
    ctx.lineWidth = 1.5;
    for (let x = 0; x < W; x++) {
      const t = x + time;
      // INSIDE initAMSim loop:
      const baseY = (1 + mu * Math.cos(fm * t)) * Ac * Math.cos(fc * t);
      const y = baseY + state.noise * (Math.random() - 0.5); // Adds the noise
      samples.push(y);
      if (x === 0) ctx.moveTo(x, H/2 - y); else ctx.lineTo(x, H/2 - y);
    }
    ctx.stroke();

    // Envelopes
    ctx.beginPath(); ctx.strokeStyle = 'rgba(215, 58, 73, 0.8)'; ctx.setLineDash([4, 4]);
    for (let x = 0; x < W; x++) {
      const env = (1 + mu * Math.cos(fm * (x + time))) * Ac;
      if (x === 0) ctx.moveTo(x, H/2 - env); else ctx.lineTo(x, H/2 - env);
    }
    ctx.stroke();
    ctx.beginPath();
    for (let x = 0; x < W; x++) {
      const env = -(1 + mu * Math.cos(fm * (x + time))) * Ac;
      if (x === 0) ctx.moveTo(x, H/2 - env); else ctx.lineTo(x, H/2 - env);
    }
    ctx.stroke(); ctx.setLineDash([]); 

    const metrics = calcMeasurements(samples, Ac, 10);
    drawOscilloscope(ctx, W, H, "2 V/div", "0.5 ms/div", metrics, state);
    drawLegend(ctx, 10, 30, '#4a90e2', "AM Signal s(t)");
    drawLegend(ctx, 10, 45, '#d73a49', "Envelope A(t)");
    drawCursor(ctx, W, H, state);

    if (!state.paused) time += 1;
    requestAnimationFrame(draw);
  }
  draw();
  slider.addEventListener('input', () => { if(state.paused) draw(); });
}

// ── 2. FM Modulation Simulator ──
function initFMSim() {
  const canvas = document.getElementById('canvas-fm_sim');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const slider = document.getElementById('slide-fm_sim');
  const valDisplay = document.getElementById('val-fm_sim');
  const state = setupInteractive(canvas);
  let time = 0;

  function draw() {
    const W = canvas.offsetWidth, H = canvas.height;
    canvas.width = W; ctx.clearRect(0, 0, W, H);
    
    const beta = parseFloat(slider.value);
    valDisplay.textContent = beta;
    const fm = 0.03, fc = 0.2, Ac = H / 2.5;

    let samples = [];
    ctx.beginPath(); ctx.strokeStyle = '#39d353'; ctx.lineWidth = 1.5;
    for (let x = 0; x < W; x++) {
      const t = x + time;
      const y = Ac * Math.cos(fc * t + beta * Math.sin(fm * t));
      samples.push(y);
      if (x === 0) ctx.moveTo(x, H/2 - y); else ctx.lineTo(x, H/2 - y);
    }
    ctx.stroke();

    const metrics = calcMeasurements(samples, Ac, 10);
    drawOscilloscope(ctx, W, H, "2 V/div", "0.5 ms/div", metrics, state);
    drawLegend(ctx, 10, 30, '#39d353', "FM Modulated Carrier");
    drawCursor(ctx, W, H, state);

    if (!state.paused) time += 1.5;
    requestAnimationFrame(draw);
  }
  draw();
  slider.addEventListener('input', () => { if(state.paused) draw(); });
}

// ── 3. Time Shifting Simulator ──
function initShiftSim() {
  const canvas = document.getElementById('canvas-shift_sim');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const slider = document.getElementById('slide-shift_sim');
  const valDisplay = document.getElementById('val-shift_sim');
  const state = setupInteractive(canvas);

  function draw() {
    const W = canvas.offsetWidth, H = canvas.height;
    canvas.width = W; ctx.clearRect(0, 0, W, H);
    drawOscilloscope(ctx, W, H, "1 V/div", "1.0 s/div", null, state);

    const shift = parseFloat(slider.value);
    valDisplay.textContent = shift > 0 ? "+" + shift : shift;
    const cx = W / 2, cy = H / 2, scale = W / 14; 

    function drawPulse(offset, color, alpha) {
      ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.globalAlpha = alpha;
      ctx.moveTo(cx + (offset - 2) * scale, cy);
      ctx.lineTo(cx + offset * scale, cy - 50);
      ctx.lineTo(cx + (offset + 2) * scale, cy);
      ctx.stroke(); ctx.globalAlpha = 1.0; 
    }

    drawPulse(0, '#8b949e', 0.4); 
    drawPulse(shift, '#ff7b72', 1.0); 

    drawLegend(ctx, 10, 30, '#8b949e', "x(t)");
    drawLegend(ctx, 10, 45, '#ff7b72', `y(t) = x(t ${shift > 0 ? '+ ' + shift : shift === 0 ? '' : '- ' + Math.abs(shift)})`);
    drawCursor(ctx, W, H, state);
  }
  draw();
  slider.addEventListener('input', draw);
}

// ── 4. Frequency Spectrum Simulator ──
function initSpectrumSim() {
  const canvas = document.getElementById('canvas-spectrum_sim');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const slider = document.getElementById('slide-spectrum_sim');
  const valDisplay = document.getElementById('val-spectrum_sim');
  const state = setupInteractive(canvas);

  function draw() {
    const W = canvas.offsetWidth, H = canvas.height;
    canvas.width = W; ctx.clearRect(0, 0, W, H);
    drawSpectrumAnalyzer(ctx, W, H, "DSB-FC SINGLE-TONE SPECTRUM", state);

    const mu = parseFloat(slider.value);
    valDisplay.textContent = mu.toFixed(1);

    const cx = W / 2, baseLine = H - 30; 
    const carrierH = 100, sbOffset = 60, sbWidth = 40;

    ctx.beginPath(); ctx.strokeStyle = '#4a90e2'; ctx.lineWidth = 3;
    ctx.moveTo(cx, baseLine); ctx.lineTo(cx, baseLine - carrierH);
    ctx.lineTo(cx - 4, baseLine - carrierH + 6); ctx.moveTo(cx, baseLine - carrierH); ctx.lineTo(cx + 4, baseLine - carrierH + 6);
    ctx.stroke();
    
    ctx.fillStyle = '#4a90e2'; ctx.textAlign = 'center';
    ctx.fillText("fc", cx, baseLine + 15);
    ctx.fillText("Carrier", cx, baseLine - carrierH - 8);

    const sbHeight = carrierH * (mu / 2); 
    function drawSideband(x, h, label, freq, color, fill) {
      ctx.beginPath(); ctx.fillStyle = fill; ctx.strokeStyle = color; ctx.lineWidth = 1.5;
      ctx.moveTo(x - sbWidth/2, baseLine); ctx.lineTo(x, baseLine - h); ctx.lineTo(x + sbWidth/2, baseLine);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = color;
      ctx.fillText(label, x, baseLine - h - 8);
      ctx.fillText(freq, x, baseLine + 15);
    }

    drawSideband(cx + sbOffset, sbHeight, "USB", "fc+fm", '#39d353', 'rgba(57, 211, 83, 0.2)');
    drawSideband(cx - sbOffset, sbHeight, "LSB", "fc-fm", '#d73a49', 'rgba(215, 58, 73, 0.2)');
    
    ctx.fillStyle = '#ccc'; ctx.textAlign = 'left';
    ctx.fillText(`Efficiency: ${((mu*mu)/(2+mu*mu)*100).toFixed(1)}%`, 10, 30);
    drawCursor(ctx, W, H, state);
  }
  draw();
  slider.addEventListener('input', draw);
}

// ── 5. Envelope & Phase Reversal Simulator ──
function initEnvelopeSim() {
  const canvas = document.getElementById('canvas-envelope_sim');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const slider = document.getElementById('slide-envelope_sim');
  const valDisplay = document.getElementById('val-envelope_sim');
  const state = setupInteractive(canvas);
  let time = 0;

  function draw() {
    const W = canvas.offsetWidth, H = canvas.height;
    canvas.width = W; ctx.clearRect(0, 0, W, H);
    
    const mu = parseFloat(slider.value);
    valDisplay.textContent = mu.toFixed(1);
    const fm = 0.02, fc = 0.6, Ac = H / 4.5; 

    let samples = [];
    ctx.beginPath(); ctx.strokeStyle = '#555'; ctx.lineWidth = 1;
    for (let x = 0; x < W; x++) {
      const t = x + time;
      const y = (1 + mu * Math.cos(fm * t)) * Ac * Math.cos(fc * t);
      samples.push(y);
      if (x === 0) ctx.moveTo(x, H/2 - y); else ctx.lineTo(x, H/2 - y);
    }
    ctx.stroke();

    ctx.beginPath(); ctx.strokeStyle = '#4a90e2'; ctx.setLineDash([4, 4]);
    for (let x = 0; x < W; x++) {
      const env = (1 + mu * Math.cos(fm * (x + time))) * Ac;
      if (x === 0) ctx.moveTo(x, H/2 - env); else ctx.lineTo(x, H/2 - env);
    }
    ctx.stroke(); ctx.setLineDash([]); 

    ctx.beginPath(); ctx.strokeStyle = '#39d353'; ctx.lineWidth = 2.5;
    for (let x = 0; x < W; x++) {
      const detectedEnv = Math.abs((1 + mu * Math.cos(fm * (x + time))) * Ac);
      if (x === 0) ctx.moveTo(x, H/2 - detectedEnv); else ctx.lineTo(x, H/2 - detectedEnv);
    }
    ctx.stroke();

    const metrics = calcMeasurements(samples, Ac, 10);
    drawOscilloscope(ctx, W, H, "1 V/div", "1.0 ms/div", metrics, state);
    drawLegend(ctx, 10, 30, '#555', "Raw Carrier");
    drawLegend(ctx, 10, 45, '#4a90e2', "True Message m(t)");
    drawLegend(ctx, 10, 60, '#39d353', "Detected |A(t)|");

    if (mu > 1.0) {
      ctx.fillStyle = '#d73a49'; ctx.font = 'bold 12px "Inter", sans-serif'; ctx.textAlign = 'center';
      ctx.fillText("⚠ PHASE REVERSAL DETECTED", W/2, 25);
    }
    drawCursor(ctx, W, H, state);

    if (!state.paused) time += 1;
    requestAnimationFrame(draw);
  }
  draw();
  slider.addEventListener('input', () => { if(state.paused) draw(); });
}

// ── 6. Multi-Tone Spectrum Simulator ──
function initMultiToneSpecSim() {
  const canvas = document.getElementById('canvas-multitone_spec_sim');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const slide1 = document.getElementById('slide1-multitone_spec_sim');
  const slide2 = document.getElementById('slide2-multitone_spec_sim');
  const val1 = document.getElementById('val1-multitone_spec_sim');
  const val2 = document.getElementById('val2-multitone_spec_sim');
  const valTot = document.getElementById('valTotal-multitone_spec_sim');
  const state = setupInteractive(canvas);

  function draw() {
    const W = canvas.offsetWidth, H = canvas.height;
    canvas.width = W; ctx.clearRect(0, 0, W, H);
    drawSpectrumAnalyzer(ctx, W, H, "MULTI-TONE SPECTRUM", state);

    const mu1 = parseFloat(slide1.value);
    const mu2 = parseFloat(slide2.value);
    val1.textContent = mu1.toFixed(1); val2.textContent = mu2.toFixed(1);

    const muT = Math.sqrt(mu1*mu1 + mu2*mu2);
    valTot.textContent = muT.toFixed(2);
    valTot.style.color = muT > 1.0 ? '#ff2244' : '#39d353'; 

    const cx = W / 2, baseLine = H - 30, carrierH = 90, fm1Offset = 35, fm2Offset = 80;

    function drawImp(x, h, color, lTop, lBot) {
        if(h === 0) return;
        ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 3;
        ctx.moveTo(x, baseLine); ctx.lineTo(x, baseLine - h);
        ctx.lineTo(x - 4, baseLine - h + 6); ctx.moveTo(x, baseLine - h); ctx.lineTo(x + 4, baseLine - h + 6);
        ctx.stroke();
        ctx.fillStyle = color; ctx.textAlign = 'center';
        ctx.fillText(lTop, x, baseLine - h - 8); ctx.fillText(lBot, x, baseLine + 15);
    }

    drawImp(cx, carrierH, '#4a90e2', "Carrier", "fc");
    drawImp(cx + fm1Offset, carrierH * (mu1/2), '#39d353', "USB1", "fc+fm1");
    drawImp(cx - fm1Offset, carrierH * (mu1/2), '#39d353', "LSB1", "fc-fm1");
    drawImp(cx + fm2Offset, carrierH * (mu2/2), '#ff7b72', "USB2", "fc+fm2");
    drawImp(cx - fm2Offset, carrierH * (mu2/2), '#ff7b72', "LSB2", "fc-fm2");
    
    drawCursor(ctx, W, H, state);
  }
  draw();
  slide1.addEventListener('input', draw); slide2.addEventListener('input', draw);
}

// ── 7. Bandpass Filter Response Simulator ──
function initFilterSim() {
  const canvas = document.getElementById('canvas-filter_sim');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const slideL = document.getElementById('slide1-filter_sim');
  const slideH = document.getElementById('slide2-filter_sim');
  const valL = document.getElementById('val1-filter_sim');
  const valH = document.getElementById('val2-filter_sim');
  const bwDisplay = document.getElementById('valTotal-filter_sim').parentElement;
  const state = setupInteractive(canvas);

  function draw() {
    const W = canvas.offsetWidth, H = canvas.height;
    canvas.width = W; ctx.clearRect(0, 0, W, H);
    drawSpectrumAnalyzer(ctx, W, H, "BANDPASS FILTER RESPONSE", state);

    let fL = parseFloat(slideL.value); let fH = parseFloat(slideH.value);
    if (fL >= fH) { fL = fH - 10; slideL.value = fL; }

    valL.textContent = fL; valH.textContent = fH;
    bwDisplay.innerHTML = `Filter Passband (BW): <span style="color:var(--accent);">${fH - fL} kHz</span>`;

    const baseLine = H - 30, minF = 500, maxF = 1800;
    function mapX(f) { return 30 + ((f - minF) / (maxF - minF)) * (W - 60); }

    const xL = mapX(fL), xH = mapX(fH);
    ctx.fillStyle = 'rgba(57, 211, 83, 0.15)'; 
    ctx.fillRect(xL, 10, xH - xL, baseLine - 10);
    
    ctx.strokeStyle = '#39d353'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(xL, 10); ctx.lineTo(xL, baseLine);
    ctx.moveTo(xH, 10); ctx.lineTo(xH, baseLine); ctx.stroke(); ctx.setLineDash([]);

    const freqs = [
      { f: 1000, h: 90, label: "Carrier" },
      { f: 1010, h: 50, label: "USB1" }, { f: 990, h: 50, label: "LSB1" },
      { f: 1030, h: 30, label: "USB3" }, { f: 970, h: 30, label: "LSB3" },
      { f: 1050, h: 15, label: "USB5" }, { f: 950, h: 15, label: "LSB5" }
    ];

    freqs.forEach(item => {
       const x = mapX(item.f);
       const passed = (item.f >= fL && item.f <= fH); 
       const color = passed ? '#4a90e2' : '#d73a49';
       
       ctx.globalAlpha = passed ? 1.0 : 0.3;
       ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = passed ? 3 : 2;
       ctx.moveTo(x, baseLine); ctx.lineTo(x, baseLine - item.h);
       ctx.lineTo(x - 3, baseLine - item.h + 5); ctx.moveTo(x, baseLine - item.h); ctx.lineTo(x + 3, baseLine - item.h + 5);
       ctx.stroke();

       ctx.fillStyle = color; ctx.textAlign = 'center';
       ctx.fillText(item.label, x, baseLine - item.h - 6);
       ctx.save(); ctx.translate(x - 4, baseLine + 12); ctx.rotate(Math.PI / 4);
       ctx.textAlign = 'left'; ctx.fillText(item.f, 0, 0); ctx.restore();
       ctx.globalAlpha = 1.0;
    });
    drawCursor(ctx, W, H, state);
  }
  draw();
  slideL.addEventListener('input', draw); slideH.addEventListener('input', draw);
}

// ── 8. Fourier Harmonic Synthesizer ──
function initFourierSim() {
  const canvas = document.getElementById('canvas-fourier_sim');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const slider = document.getElementById('slide-fourier_sim');
  const valDisplay = document.getElementById('val-fourier_sim');
  const state = setupInteractive(canvas);
  let time = 0;

  function draw() {
    const W = canvas.offsetWidth, H = canvas.height;
    canvas.width = W; ctx.clearRect(0, 0, W, H);
    
    const harmonics = parseInt(slider.value);
    valDisplay.textContent = harmonics;

    let samples = [];
    ctx.beginPath(); ctx.strokeStyle = '#00d4ff'; ctx.lineWidth = 2.5;

    for (let x = 0; x < W; x++) {
      let y = 0;
      const t = (x + time) * 0.03; 
      for (let n = 1; n <= harmonics; n += 2) { y += (4 / (n * Math.PI)) * Math.sin(n * t); }
      const scaledY = y * (H / 3.5); 
      samples.push(scaledY);
      if (x === 0) ctx.moveTo(x, H/2 - scaledY); else ctx.lineTo(x, H/2 - scaledY);
    }
    ctx.stroke();

    const metrics = calcMeasurements(samples, H/3.5, 10);
    drawOscilloscope(ctx, W, H, "5 V/div", "0.2 ms/div", metrics, state);
    drawLegend(ctx, 10, 30, '#00d4ff', `Square Wave (n=${harmonics})`);
    drawCursor(ctx, W, H, state);

    if (!state.paused) time += 1.5; 
    requestAnimationFrame(draw);
  }
  draw();
  slider.addEventListener('input', () => { if(state.paused) draw(); });
}

// ── 9. RC Envelope Detector Simulator ──
function initRCEnvSim() {
  const canvas = document.getElementById('canvas-rc_env_sim');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const slider = document.getElementById('slide-rc_env_sim');
  const valDisplay = document.getElementById('val-rc_env_sim');
  const state = setupInteractive(canvas);
  let time = 0;

  function draw() {
    const W = canvas.offsetWidth, H = canvas.height;
    canvas.width = W; ctx.clearRect(0, 0, W, H);
    
    const decayRate = parseFloat(slider.value);
    if (decayRate > 0.15) { valDisplay.textContent = decayRate.toFixed(2) + " ⚠ TOO FAST"; valDisplay.style.color = 'var(--warn)'; } 
    else if (decayRate < 0.03) { valDisplay.textContent = decayRate.toFixed(2) + " ⚠ TOO SLOW"; valDisplay.style.color = 'var(--danger)'; } 
    else { valDisplay.textContent = decayRate.toFixed(2) + " ✓ OPTIMAL"; valDisplay.style.color = 'var(--accent3)'; }

    const fm = 0.015, fc = 0.3, Ac = H / 2.5, baseLine = H - 20;

    let samples = [];
    ctx.beginPath(); ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)'; ctx.lineWidth = 1;
    for (let x = 0; x < W; x++) {
      const env = 1 + 0.6 * Math.cos(fm * (x + time));
      const y = Math.abs(env * Ac * Math.cos(fc * (x + time))); 
      if (x === 0) ctx.moveTo(x, baseLine - y); else ctx.lineTo(x, baseLine - y);
    }
    ctx.stroke();

    ctx.beginPath(); ctx.strokeStyle = '#39ff14'; ctx.lineWidth = 2.5;
    let capVoltage = 0;
    for (let x = 0; x < W; x++) {
      const t = x + time;
      const env = 1 + 0.6 * Math.cos(fm * t);
      const carrierWave = Math.cos(fc * t);
      
      let Vin = 0;
      if (carrierWave > 0) Vin = env * Ac * carrierWave;

      if (Vin >= capVoltage) capVoltage = Vin; 
      else capVoltage = capVoltage - (capVoltage * decayRate); 

      samples.push(capVoltage);
      if (x === 0) ctx.moveTo(x, baseLine - capVoltage); else ctx.lineTo(x, baseLine - capVoltage);
    }
    ctx.stroke();

    const metrics = calcMeasurements(samples, Ac, 10);
    drawOscilloscope(ctx, W, H, "1 V/div", "0.5 ms/div", metrics, state);
    drawLegend(ctx, 10, 30, 'rgba(255, 255, 255, 0.4)', "Rectified AM Input");
    drawLegend(ctx, 10, 45, '#39ff14', "Capacitor Voltage (V_out)");
    drawCursor(ctx, W, H, state);

    if (!state.paused) time += 1.5;
    requestAnimationFrame(draw);
  }
  draw();
  slider.addEventListener('input', () => { if(state.paused) draw(); });
}
