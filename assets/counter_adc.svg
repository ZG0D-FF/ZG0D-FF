<svg viewBox="0 0 600 350" xmlns="http://www.w3.org/2000/svg" style="background:#111827; font-family:sans-serif; border-radius: 8px;">
  <defs>
    <!-- Arrowhead -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fff" />
    </marker>
  </defs>

  <style>
    .line { fill: none; stroke: #fff; stroke-width: 2.5; }
    .box { fill: #1f2937; stroke: #4ecdc4; stroke-width: 2.5; rx: 4px; }
    .text { fill: #fff; font-size: 16px; text-anchor: middle; }
    .small-text { fill: #ccc; font-size: 14px; }
    .title { fill: #82aaff; font-size: 18px; font-weight: bold; text-anchor: middle; }
  </style>

  <!-- Op-Amp (Comparator) -->
  <path d="M 150 100 L 250 140 L 150 180 Z" class="box" />
  <text x="165" y="125" class="text" font-weight="bold">+</text>
  <text x="165" y="165" class="text" font-weight="bold">-</text>

  <!-- Va Input -->
  <line x1="80" y1="120" x2="150" y2="120" class="line" marker-end="url(#arrow)" />
  <circle cx="80" cy="120" r="4" fill="#fff" />
  <text x="60" y="125" class="text" font-style="italic">V<tspan baseline-shift="sub" font-size="12">a</tspan></text>

  <!-- AND Gate -->
  <path d="M 300 120 L 320 120 A 30 30 0 0 1 320 180 L 300 180 Z" class="box" />
  <line x1="250" y1="140" x2="300" y2="140" class="line" />

  <!-- CLK Input -->
  <line x1="270" y1="190" x2="270" y2="160" class="line" />
  <line x1="270" y1="160" x2="300" y2="160" class="line" marker-end="url(#arrow)" />
  <text x="270" y="210" class="text small-text">CLK</text>

  <!-- Up Counter Box -->
  <rect x="400" y="100" width="100" height="60" class="box" />
  <text x="450" y="128" class="text">Up</text>
  <text x="450" y="148" class="text">Counter</text>
  <line x1="350" y1="150" x2="400" y2="150" class="line" marker-end="url(#arrow)" />

  <!-- Digital Output Lines connecting to DAC -->
  <line x1="420" y1="160" x2="420" y2="230" class="line" />
  <line x1="440" y1="160" x2="440" y2="230" class="line" />
  <line x1="460" y1="160" x2="460" y2="230" class="line" />
  <line x1="480" y1="160" x2="480" y2="230" class="line" stroke-dasharray="4" />

  <!-- Digital output lines branching right -->
  <line x1="420" y1="175" x2="520" y2="175" class="line" />
  <line x1="440" y1="190" x2="520" y2="190" class="line" />
  <line x1="460" y1="205" x2="520" y2="205" class="line" />
  <line x1="480" y1="220" x2="520" y2="220" class="line" stroke-dasharray="4" />
  
  <!-- Curly brace for Digital Output -->
  <path d="M 525 170 C 535 170 535 197 545 197 C 535 197 535 225 525 225" fill="none" stroke="#ffeb3b" stroke-width="2" />
  <text x="575" y="193" fill="#ffeb3b" font-size="14px" text-anchor="middle">Digital</text>
  <text x="575" y="213" fill="#ffeb3b" font-size="14px" text-anchor="middle">output</text>

  <!-- DAC Box -->
  <rect x="400" y="230" width="100" height="50" class="box" />
  <text x="450" y="260" class="text">DAC</text>

  <!-- Feedback loop -->
  <line x1="400" y1="255" x2="120" y2="255" class="line" />
  <line x1="120" y1="255" x2="120" y2="160" class="line" />
  <line x1="120" y1="160" x2="150" y2="160" class="line" marker-end="url(#arrow)" />

  <text x="300" y="320" class="title">Circuit diagram of Analog to Digital Convertor (ADC)</text>
</svg>
