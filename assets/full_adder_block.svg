<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" style="background:#111827; font-family:sans-serif; border-radius: 8px;">
  <style>
    .line { fill: none; stroke: #fff; stroke-width: 2.5; }
    .box { fill: rgba(130,170,255,0.1); stroke: #82aaff; stroke-width: 2.5; rx: 4px; }
    .text { fill: #fff; font-size: 16px; text-anchor: middle; }
    .title { fill: #82aaff; font-size: 18px; font-weight: bold; text-anchor: middle; }
  </style>

  <!-- Inputs -->
  <text x="50" y="75" class="text">A</text>
  <line x1="70" y1="70" x2="130" y2="70" class="line" />

  <text x="50" y="105" class="text">B</text>
  <line x1="70" y1="100" x2="130" y2="100" class="line" />

  <text x="50" y="135" class="text">Cin</text>
  <line x1="70" y1="130" x2="100" y2="130" class="line" />
  <line x1="100" y1="130" x2="100" y2="160" class="line" />
  <line x1="100" y1="160" x2="150" y2="160" class="line" />

  <!-- Block -->
  <rect x="130" y="50" width="120" height="90" class="box" />
  <text x="190" y="100" class="text">Full Adder</text>

  <!-- Outputs -->
  <line x1="250" y1="70" x2="310" y2="70" class="line" />
  <text x="345" y="75" class="text">Sum 'S'</text>

  <line x1="250" y1="120" x2="310" y2="120" class="line" />
  <text x="350" y="125" class="text">Carry 'Cout'</text>
</svg>
