<svg width="100%" viewBox="0 0 680 340" role="img" xmlns="http://www.w3.org/2000/svg">
<title>JARVIS arc reactor ring</title>
<desc>A minimalist 3D-perspective JARVIS arc reactor ring in cyan on deep navy, with slow pulsing animations.</desc>

<rect width="680" height="340" fill="#020c18"/>

<defs>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#020c18" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="core" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.55"/>
    <stop offset="60%" stop-color="#00bcd4" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#020c18" stop-opacity="0"/>
  </radialGradient>
</defs>

<ellipse cx="340" cy="170" rx="180" ry="180" fill="url(#glow)"/>

<ellipse cx="340" cy="170" rx="148" ry="54" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.08"/>
<ellipse cx="340" cy="170" rx="148" ry="54" fill="none" stroke="#00e5ff" stroke-width="0.5" opacity="0.12" stroke-dasharray="4 8">
  <animateTransform attributeName="transform" type="rotate" from="0 340 170" to="-360 340 170" dur="32s" repeatCount="indefinite"/>
</ellipse>

<ellipse cx="340" cy="170" rx="120" ry="43" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.18"/>

<ellipse cx="340" cy="170" rx="90" ry="33" fill="none" stroke="#00e5ff" stroke-width="2.5" opacity="0.55">
  <animate attributeName="stroke-opacity" values="0.55;0.85;0.55" dur="3s" repeatCount="indefinite"/>
  <animate attributeName="ry" values="33;35;33" dur="3s" repeatCount="indefinite"/>
</ellipse>

<ellipse cx="340" cy="170" rx="90" ry="33" fill="none" stroke="#00e5ff" stroke-width="0.8" stroke-dasharray="8 6" opacity="0.4">
  <animateTransform attributeName="transform" type="rotate" from="0 340 170" to="360 340 170" dur="12s" repeatCount="indefinite"/>
</ellipse>

<ellipse cx="340" cy="170" rx="90" ry="33" fill="none" stroke="#ffffff" stroke-width="0.4" stroke-dasharray="2 20" opacity="0.5">
  <animateTransform attributeName="transform" type="rotate" from="0 340 170" to="-360 340 170" dur="8s" repeatCount="indefinite"/>
</ellipse>

<ellipse cx="340" cy="170" rx="62" ry="22" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.3"/>
<ellipse cx="340" cy="170" rx="62" ry="22" fill="none" stroke="#00e5ff" stroke-width="0.6" stroke-dasharray="3 10" opacity="0.6">
  <animateTransform attributeName="transform" type="rotate" from="0 340 170" to="-360 340 170" dur="7s" repeatCount="indefinite"/>
</ellipse>

<line x1="250" y1="170" x2="430" y2="170" stroke="#00e5ff" stroke-width="0.4" opacity="0.12"/>
<line x1="340" y1="137" x2="340" y2="203" stroke="#00e5ff" stroke-width="0.4" opacity="0.12"/>

<g opacity="0.6">
  <ellipse cx="250" cy="170" rx="4" ry="1.5" fill="#00e5ff"/>
  <ellipse cx="430" cy="170" rx="4" ry="1.5" fill="#00e5ff"/>
  <ellipse cx="340" cy="137" rx="1.5" ry="4" fill="#00e5ff"/>
  <ellipse cx="340" cy="203" rx="1.5" ry="4" fill="#00e5ff"/>
</g>

<g opacity="0.35">
  <ellipse cx="277" cy="153" rx="3" ry="1.2" fill="#00e5ff"/>
  <ellipse cx="403" cy="153" rx="3" ry="1.2" fill="#00e5ff"/>
  <ellipse cx="277" cy="187" rx="3" ry="1.2" fill="#00e5ff"/>
  <ellipse cx="403" cy="187" rx="3" ry="1.2" fill="#00e5ff"/>
</g>

<ellipse cx="340" cy="170" rx="22" ry="8" fill="url(#core)">
  <animate attributeName="rx" values="22;26;22" dur="3s" repeatCount="indefinite"/>
  <animate attributeName="ry" values="8;9.5;8" dur="3s" repeatCount="indefinite"/>
</ellipse>

<ellipse cx="340" cy="170" rx="10" ry="3.6" fill="#00e5ff" opacity="0.9">
  <animate attributeName="opacity" values="0.9;1;0.6;1;0.9" dur="3s" repeatCount="indefinite"/>
  <animate attributeName="rx" values="10;12;10" dur="3s" repeatCount="indefinite"/>
</ellipse>

<ellipse cx="340" cy="164" rx="6" ry="1.8" fill="#ffffff" opacity="0.4"/>

<ellipse cx="340" cy="170" rx="148" ry="54" fill="none" stroke="#00e5ff" stroke-width="0.5" opacity="0.06">
  <animate attributeName="rx" values="148;152;148" dur="4s" repeatCount="indefinite"/>
  <animate attributeName="ry" values="54;56;54" dur="4s" repeatCount="indefinite"/>
  <animate attributeName="stroke-opacity" values="0.06;0.15;0.06" dur="4s" repeatCount="indefinite"/>
</ellipse>

<ellipse cx="340" cy="170" rx="168" ry="61" fill="none" stroke="#00e5ff" stroke-width="0.5" opacity="0.04">
  <animate attributeName="rx" values="168;155;168" dur="4s" begin="0.5s" repeatCount="indefinite"/>
  <animate attributeName="ry" values="61;56;61" dur="4s" begin="0.5s" repeatCount="indefinite"/>
  <animate attributeName="stroke-opacity" values="0.04;0.0;0.04" dur="4s" begin="0.5s" repeatCount="indefinite"/>
</ellipse>

</svg>
