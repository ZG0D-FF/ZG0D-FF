<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" style="background:#111827; font-family:sans-serif; border-radius: 8px;">
  <style>
    .line { fill: none; stroke: #fff; stroke-width: 2.5; }
    .gate { fill: #1f2937; stroke: #4ecdc4; stroke-width: 2.5; }
    .text { fill: #fff; font-size: 16px; text-anchor: middle; }
    .dot { fill: #fff; }
  </style>

  <!-- Inputs A, B -->
  <text x="30" y="65" class="text">A</text>
  <text x="30" y="125" class="text">B</text>

  <!-- Input Lines -->
  <line x1="50" y1="60" x2="160" y2="60" class="line" />
  <line x1="50" y1="120" x2="160" y2="120" class="line" />

  <!-- Tap off to AND gate -->
  <line x1="110" y1="60" x2="110" y2="150" class="line" />
  <line x1="110" y1="150" x2="160" y2="150" class="line" />
  <circle cx="110" cy="60" r="4" class="dot" />

  <line x1="80" y1="120" x2="80" y2="170" class="line" />
  <line x1="80" y1="170" x2="160" y2="170" class="line" />
  <circle cx="80" cy="120" r="4" class="dot" />

  <!-- XOR Gate -->
  <path d="M 150 40 Q 170 90 150 140 Q 200 140 240 90 Q 200 40 150 40" class="gate" />
  <path d="M 140 40 Q 160 90 140 140" fill="none" stroke="#4ecdc4" stroke-width="2.5" />
  <line x1="240" y1="90" x2="330" y2="90" class="line" />
  <text x="350" y="95" class="text">S (Sum)</text>

  <!-- AND Gate -->
  <path d="M 160 130 L 200 130 A 30 30 0 0 1 200 190 L 160 190 Z" class="gate" />
  <line x1="230" y1="160" x2="330" y2="160" class="line" />
  <text x="355" y="165" class="text">C (Carry)</text>
</svg>
