(function initUniversalStore() {
  const host = window.location.hostname;
  let prefix = 'jarvis_prod_';
  if (!host || host === 'localhost' || host === '127.0.0.1' || host.startsWith('192.168.') || window.location.protocol === 'file:') {
    prefix = 'jarvis_dev_';
  } else if (host.includes('staging') || host.includes('preview') || host.includes('vercel.app')) {
    prefix = 'jarvis_staging_';
  }
  window.ENV_PREFIX = prefix;
  window.IDB_NAME = `${prefix}db`;
  window.store = {
    get: (k) => { try { return localStorage.getItem(`${prefix}${k}`); } catch(e) { return null; } },
    set: (k, v) => { try { localStorage.setItem(`${prefix}${k}`, v); } catch(e) {} },
    del: (k) => { try { localStorage.removeItem(`${prefix}${k}`); } catch(e) {} },
    sessionGet: (k) => { try { return sessionStorage.getItem(`${prefix}${k}`); } catch(e) { return null; } },
    sessionSet: (k, v) => { try { sessionStorage.setItem(`${prefix}${k}`, v); } catch(e) {} },
    sessionDel: (k) => { try { sessionStorage.removeItem(`${prefix}${k}`); } catch(e) {} }
  };
})();
</script>
<script>
/* ════════════════════════════════════════════════════════════════
   COMMON IEEE CLOSED-LOOP FRAME Δt & SILICON TELEMETRY ENGINE
   Classifies High / Mid / Low Tier using 4 Real Hardware Signals
════════════════════════════════════════════════════════════════ */
(function initJarvisHardwareTierEngine() {
  const cores = navigator.hardwareConcurrency || 4;
  const mem   = navigator.deviceMemory || 4;
  const conn  = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  const saveData = Boolean(conn && conn.saveData);
  const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 1. WebGL Real GPU Silicon Probe
  let gpuRenderer = 'unknown';
  let maxTexSize  = 4096;
  let hasWebGL    = false;
  try {
    const probeCanvas = document.createElement('canvas');
    const gl = probeCanvas.getContext('webgl') || probeCanvas.getContext('experimental-webgl');
    if (gl) {
      hasWebGL = true;
      maxTexSize = gl.getParameter(gl.MAX_TEXTURE_SIZE) || 4096;
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      if (dbg) gpuRenderer = (gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || '').toLowerCase();
      const loseExt = gl.getExtension('WEBGL_lose_context');
      if (loseExt) loseExt.loseContext();
    }
  } catch (e) {}

  const isFlagshipGPU = /apple gpu|m1|m2|m3|m4|adreno \(tm\) 7|adreno 7|mali-g7|rtx|radeon rx|arc/i.test(gpuRenderer);
  const isBudgetGPU   = /swiftshader|llvmpipe|mali-4|mali-t|mali-g3|mali-g52|adreno \(tm\) 5|adreno \(tm\) 610|powervr/i.test(gpuRenderer);

  // 2. Initial Baseline Tier from Silicon, RAM & GPU
  let initialTier = 'mid';
  if (!hasWebGL || reducedMotion || saveData || cores <= 2 || mem <= 2 || isBudgetGPU || maxTexSize < 4096) {
    initialTier = 'low';
  } else if ((cores >= 8 && mem >= 6) || isFlagshipGPU) {
    initialTier = 'high';
  }

  const TIER_PROFILES = {
    high: { tier: 'high', tubeCount: 108, pixelRatio: Math.min(window.devicePixelRatio || 1, 2),   ringCount: 9, particleCount: 300, blurPx: '28px', enable3D: true  },
    mid:  { tier: 'mid',  tubeCount: 72,  pixelRatio: Math.min(window.devicePixelRatio || 1, 1.25), ringCount: 4, particleCount: 140, blurPx: '14px', enable3D: true  },
    low:  { tier: 'low',  tubeCount: 44,  pixelRatio: 1,                                            ringCount: 2, particleCount: 40,  blurPx: '6px',  enable3D: false }
  };

  function applyTier(tierName, reason) {
    const profile = TIER_PROFILES[tierName] || TIER_PROFILES.mid;
    window.JARVIS_HW = Object.assign({}, profile, { cores, mem, gpuRenderer, maxTexSize, reason });
    document.documentElement.setAttribute('data-hw-tier', profile.tier);
    document.documentElement.style.setProperty('--jv-blur', profile.blurPx);

    const bgCanvas = document.getElementById('bg-canvas') || document.getElementById('three-canvas');
    if (bgCanvas) {
      bgCanvas.style.display = profile.enable3D ? 'block' : 'none';
    }
    window.dispatchEvent(new CustomEvent('jarvis:tierchange', { detail: window.JARVIS_HW }));
  }

  applyTier(initialTier, 'silicon-init');

  // 3. Battery Guard (< 20% and unplugged -> automatic Low-Power Tier)
  if ('getBattery' in navigator) {
    navigator.getBattery().then(bat => {
      function checkBattery() {
        if (!bat.charging && bat.level < 0.20 && window.JARVIS_HW.tier !== 'low') {
          applyTier('low', 'battery-saver');
        }
      }
      checkBattery();
      bat.addEventListener('levelchange', checkBattery);
      bat.addEventListener('chargingchange', checkBattery);
    }).catch(() => {});
  }

  // 4. Closed-Loop Frame Δt Feedback Monitor (30-frame rolling window, < 42 FPS -> step down)
  window.addEventListener('DOMContentLoaded', () => {
    let frameDeltas = [];
    let lastTs = performance.now();
    let downgrades = 0;

    function sampleFrameLoop(now) {
      const dt = now - lastTs;
      lastTs = now;
      if (dt > 0 && dt < 250 && !document.hidden) {
        frameDeltas.push(dt);
        if (frameDeltas.length >= 30) {
          const avgDt = frameDeltas.reduce((a, b) => a + b, 0) / frameDeltas.length;
          frameDeltas = [];
          // 42 FPS threshold => Δt > 23.8 ms
          if (avgDt > 23.8 && downgrades < 2) {
            downgrades++;
            const nextTier = window.JARVIS_HW.tier === 'high' ? 'mid' : 'low';
            if (nextTier !== window.JARVIS_HW.tier) {
              applyTier(nextTier, `closed-loop-dt-${avgDt.toFixed(1)}ms`);
            }
          }
        }
      }
      if (downgrades < 2 && window.JARVIS_HW.tier !== 'low') {
        requestAnimationFrame(sampleFrameLoop);
      }
    }
    requestAnimationFrame(sampleFrameLoop);
  });
})();
</script>

// --- AUDIO HELPER ---
window._activeVoicePromise = Promise.resolve();
function playSystemAudio(filename) {
    const voicePromise = new Promise((resolve) => {
        try {
            if (window.jarvisAudioContext && window.jarvisAudioContext.state === 'suspended') {
                window.jarvisAudioContext.resume().catch(() => {});
            }
            const audio = new Audio('audio/' + filename);
            window._currentBootAudio = audio;
            const done = () => {
                if (window._currentBootAudio === audio) window._currentBootAudio = null;
                resolve();
            };
            audio.onended = done;
            audio.onerror = done;
            const p = audio.play();
            if (p && typeof p.catch === 'function') {
                p.catch(done);
            }
        } catch (e) {
            resolve();
        }
    });
    window._activeVoicePromise = voicePromise;
    return voicePromise;
}

</script>

<style>
:root {
  --cyan:   #00e5ff;
  --blue:   #1565c0;
  --teal:   #00bcd4;
  --amber:  #ffab00;
  --red:    #ff1744;
  --bg:     #020c18;
  --bg2:    #040f1e;
  --panel:  rgba(0,180,230,0.05);
  --border: rgba(0,229,255,0.18);
  --glow:   0 0 18px rgba(0,229,255,0.55);
  --font-hud:  'Orbitron', monospace;
  --font-mono: 'Share Tech Mono', monospace;
  --font-body: 'Rajdhani', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--cyan);
  font-family: var(--font-body); font-size: 16px;
  overflow: hidden; cursor: crosshair;
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--cyan); border-radius: 3px; }
::selection { background: var(--cyan); color: var(--bg); }

/* THREE.JS CANVAS */
#three-canvas {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0; opacity: 0.45;
}

/* GRID OVERLAY */
.grid-overlay {
  position: fixed; inset: 0; pointer-events: none; z-index: 1;
  background-image:
    linear-gradient(rgba(0,229,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,255,0.025) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black, transparent);
}

/* SCAN LINES */
.scanlines {
  position: fixed; inset: 0; pointer-events: none; z-index: 2;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 2px,
    rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px
  );
}

/* VIGNETTE */
.vignette {
  position: fixed; inset: 0; pointer-events: none; z-index: 2;
  background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 40%, rgba(2,12,24,0.7) 100%);
}

/* BOOT SCREEN */
#boot-screen {
  position: fixed; inset: 0; z-index: 100;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 20px; padding: 20px;
  transition: opacity 0.8s ease;
}

/* HUD LOGO — center label only, 3D rings are in Three.js */
.hud-logo-label {
  position: relative; z-index: 10;
  font-family: var(--font-hud); font-size: 22px; font-weight: 900;
  color: var(--cyan); text-shadow: 0 0 30px rgba(0,229,255,0.9), 0 0 60px rgba(0,229,255,0.4);
  letter-spacing: 6px; text-align: center;
  animation: logo-pulse 3s ease infinite;
}
.hud-logo-label .sub {
  display: block; font-size: 9px; letter-spacing: 5px;
  color: rgba(0,229,255,0.5); margin-top: 4px; font-weight: 400;
}
@keyframes logo-pulse {
  0%,100% { text-shadow: 0 0 30px rgba(0,229,255,0.9), 0 0 60px rgba(0,229,255,0.4); }
  50%      { text-shadow: 0 0 50px rgba(0,229,255,1),   0 0 100px rgba(0,229,255,0.6), 0 0 140px rgba(0,229,255,0.2); }

/* HUD corner decorations */
.hud-corner {
  position: fixed; width: 60px; height: 60px;
  border-color: rgba(0,229,255,0.3); border-style: solid;
  z-index: 10;
}
.hud-corner.tl { top: 20px; left: 20px; border-width: 1px 0 0 1px; }
.hud-corner.tr { top: 20px; right: 20px; border-width: 1px 1px 0 0; }
.hud-corner.bl { bottom: 20px; left: 20px; border-width: 0 0 1px 1px; }
.hud-corner.br { bottom: 20px; right: 20px; border-width: 0 1px 1px 0; }
.hud-corner::after {
  content: attr(data-label);
  font-family: var(--font-mono); font-size: 8px; letter-spacing: 2px;
  color: rgba(0,229,255,0.3); position: absolute;
}
.hud-corner.tl::after { top: 6px; left: 6px; }
.hud-corner.tr::after { top: 6px; right: 6px; }
.hud-corner.bl::after { bottom: 6px; left: 6px; }

  async function loadFacialModels() {
    const statusEl = document.getElementById('status-text');

      console.warn('[JARVIS] faceapi script pending, waiting for window load event...');
      window.addEventListener('load', loadFacialModels, { once: true });
      return;
    }

    const MODEL_URL = './models';
    if (statusEl) statusEl.innerText = 'LOADING BIOMETRIC NEURAL NETWORKS...';

    // 1. Safe Hardware Backend Negotiation (WebGL with automatic fallback)
    try {
      if (faceapi.tf) {
        try {
          await faceapi.tf.setBackend('webgl');
        } catch (webglErr) {
          console.warn('[JARVIS] WebGL busy or unsupported, negotiating CPU backend:', webglErr.message || webglErr);
          try {
            await faceapi.tf.setBackend('cpu');
          } catch (cpuErr) {
            console.warn('[JARVIS] CPU backend negotiation notice:', cpuErr.message || cpuErr);
          }
        }
        try {
          await faceapi.tf.ready();
        } catch (readyErr) {
          console.warn('[JARVIS] tf.ready() notice:', readyErr.message || readyErr);
        }
      }
    } catch (tfErr) {
      console.warn('[JARVIS] Backend negotiation non-fatal:', tfErr.message || tfErr);

    // 2. Resilient Neural Weight Loading (Local -> CDN High-Availability Fallback)

          faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
          faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),

        console.warn('[JARVIS] Local weights unreachable, attempting CDN fallback...', localLoadErr.message || localLoadErr);
        const CDN_URL = 'https://raw.githubusercontent.com/vladmandic/face-api/master/model/';
        await Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri(CDN_URL),

/* ════════════════════════════════════════
   THREE.JS — 3D JARVIS HOLOGRAM (PERFORMANCE SCALED)
════════════════════════════════════════ */
function init3D() {
  const canvas = document.getElementById('three-canvas');
  if (!canvas || typeof THREE === 'undefined') return;
  const hw = window.JARVIS_HW || { tier: 'mid', particleCount: 140, ringCount: 4, pixelRatio: 1.25 };
  const isHighEnd = hw.tier === 'high';
  const pCount = hw.particleCount;
  const ringCount = hw.ringCount;
  const pixelRatio = hw.pixelRatio;

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: isHighEnd, alpha: true });
  } catch (e) {
    console.warn('[JARVIS] WebGL unavailable for 3D hologram:', e.message);
    return;
  }
  renderer.setPixelRatio(pixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);

  const scene = new THREE.Scene();
  window.scene = scene;
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0, 5);

  const C = 0x00e5ff;

  /* ── WIREFRAME SPHERE (core) ── */
  const sphereGeo = new THREE.SphereGeometry(1.1, 16, 12);
  const sphereMat = new THREE.MeshBasicMaterial({ color: C, wireframe: true, transparent: true, opacity: 0.08 });
  const sphere = new THREE.Mesh(sphereGeo, sphereMat);
  scene.add(sphere);

  /* ── ICOSAHEDRON (inner core pulse) ── */
  const icoGeo = new THREE.IcosahedronGeometry(0.55, 1);
  const icoMat = new THREE.MeshBasicMaterial({ color: C, wireframe: true, transparent: true, opacity: 0.25 });
  const ico = new THREE.Mesh(icoGeo, icoMat);
  scene.add(ico);

  /* ── TORUS RINGS (SCALED) ── */
  function makeTorus(r, tube, tilt, speed, opacity) {
    // Lower segment count for better performance
    const geo = new THREE.TorusGeometry(r, tube, isHighEnd ? 6 : 4, isHighEnd ? 80 : 40);
    const mat = new THREE.MeshBasicMaterial({ color: C, transparent: true, opacity });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.x = tilt;
    mesh.userData.speed = speed;
    return mesh;
  }

  const allRings = [
    makeTorus(1.55, 0.008, 0,            0.004,  0.7),
    makeTorus(1.55, 0.004, Math.PI/2,   -0.006,  0.4),
    makeTorus(1.8,  0.006, Math.PI/6,   -0.003,  0.5),
    makeTorus(2.1,  0.005, Math.PI/2,   -0.002,  0.35),
    // Extra rings only for high-end devices
    makeTorus(1.55, 0.004, Math.PI/4,    0.005,  0.3),
    makeTorus(1.8,  0.004, -Math.PI/3,   0.007,  0.25),
    makeTorus(2.1,  0.003, Math.PI/5,    0.004,  0.2),
    makeTorus(2.5,  0.006, 0,           -0.0015, 0.15),
    makeTorus(2.5,  0.003, Math.PI/3,    0.003,  0.1)
  ];
  
  const rings = allRings.slice(0, ringCount);
  rings.forEach(r => scene.add(r));

  /* ── PARTICLES (SCALED) ── */
  const pPositions = new Float32Array(pCount * 3);
  const pVel = [];
  for (let i = 0; i < pCount; i++) {
    const r = 2.8 + Math.random() * 2.5;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pPositions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    pPositions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    pPositions[i*3+2] = r * Math.cos(phi);
    pVel.push({
      vx: (Math.random()-.5)*0.003,
      vy: (Math.random()-.5)*0.003,
      vz: (Math.random()-.5)*0.003
    });
  }
  const pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
  const pMat = new THREE.PointsMaterial({ color: C, size: 0.025, transparent: true, opacity: 0.6 });
  const points = new THREE.Points(pGeo, pMat);
  scene.add(points);

  /* ── MOUSE PARALLAX ── */
  let mouseX = 0, mouseY = 0;
  document.addEventListener('mousemove', e => {
    mouseX = (e.clientX / window.innerWidth  - 0.5) * 2;
    mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
  });

  /* ── RESIZE ── */
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* ── ANIMATE ── */
  let t = 0;
  function animate() {
    requestAnimationFrame(animate);
    t += 0.01;

    scene.rotation.y += (mouseX * 0.3 - scene.rotation.y) * 0.02;
    scene.rotation.x += (-mouseY * 0.2 - scene.rotation.x) * 0.02;

    rings.forEach(r => {
      r.rotation.z += r.userData.speed;
      r.rotation.y += r.userData.speed * 0.3;
    });

    sphere.rotation.y += 0.001;
    sphere.rotation.x += 0.0005;
    ico.rotation.y -= 0.008;
    ico.rotation.x += 0.005;
    ico.scale.setScalar(1 + Math.sin(t * 1.5) * 0.06);

    const pos = pGeo.attributes.position.array;
    for (let i = 0; i < pCount; i++) {
      pos[i*3]   += pVel[i].vx;
      pos[i*3+1] += pVel[i].vy;
      pos[i*3+2] += pVel[i].vz;
      const dist = Math.sqrt(pos[i*3]**2 + pos[i*3+1]**2 + pos[i*3+2]**2);
      if (dist > 6 || dist < 2.5) {
        pVel[i].vx *= -1; pVel[i].vy *= -1; pVel[i].vz *= -1;
      }
    }
    pGeo.attributes.position.needsUpdate = true;

    renderer.render(scene, camera);
  }
  animate();
}

const bootLines = [

function typeLine(text, el, cb) {
  let i = 0;
  el.innerHTML = '';
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  el.appendChild(cursor);
  const iv = setInterval(() => {
    el.insertBefore(document.createTextNode(text[i]), cursor);
    i++;
    if (i >= text.length) {
      clearInterval(iv);
      setTimeout(() => { cursor.remove(); if (cb) cb(); }, 200);
    }
  }, 38);
}

function runBootLines(container, idx, cb) {
  if (idx >= bootLines.length) { if (cb) cb(); return; }
  const line = document.createElement('div');
  line.className = 'line visible';
  container.appendChild(line);
  typeLine(bootLines[idx], line, () => {
    setTimeout(() => runBootLines(container, idx + 1, cb), 300);
  });
}

// Supabase init removed for security, routing via Cloudflare now.
function requestGPS() {
  const btn = document.getElementById('btn-gps');
  btn.textContent = "SCANNING...";
  
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const coords = `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
        window.store.sessionSet('loc', coords);
        btn.classList.add('secured');
        btn.textContent = "[X] SECURED";
      },
      async (err) => {
        console.warn("[SYS] GPS Access Denied. Attempting IP Fallback.");
        try {
          const geoRes = await fetch('https://get.geojs.io/v1/ip/geo.json');
          const geoData = await geoRes.json();
          const coords = `${parseFloat(geoData.latitude).toFixed(4)}, ${parseFloat(geoData.longitude).toFixed(4)}`;
          window.store.sessionSet('loc', coords);
          btn.classList.add('secured');
          btn.textContent = "[X] IP SECURED";
        } catch(e) {
          btn.classList.add('failed');
          btn.textContent = "[!] DENIED";
        }
      }
    );
  } else {
    btn.classList.add('failed');
    btn.textContent = "[!] OFFLINE";
  }
}

async function requestCam() {
  const btn = document.getElementById('btn-cam');
  const nameInput = document.getElementById('v-name').value.trim();
  
  if (!nameInput) {
      document.getElementById('status-text').innerText = 'PLEASE ENTER YOUR NAME FIRST TO INITIATE BIOMETRIC SCAN.';
      document.getElementById('v-name').focus();
      return;
  }
  
  btn.textContent = "UPLINKING...";

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
    const video = document.createElement('video');
    video.setAttribute('playsinline', 'playsinline');
    video.setAttribute('autoplay', 'autoplay');
    video.setAttribute('muted', 'muted');
    video.style.position = 'absolute';
    video.style.opacity = '0';
    video.style.pointerEvents = 'none';
    document.body.appendChild(video);
    
    video.srcObject = stream;
    
    await new Promise((resolve) => {
      video.onloadedmetadata = () => {
        video.play().catch(e => console.warn("Video play error:", e));
      };
      // Wait for the video to actually start playing frames (fixes Android blank canvas)
      video.onplaying = () => {
        resolve();
      };
    });

    // 1. Wait a moment for the camera to auto-adjust exposure and ensure dimensions
    await new Promise(r => setTimeout(r, 800));
    
    if (video.videoWidth === 0 || video.videoHeight === 0) {
       console.warn("Video dimensions are zero on Android.");
       // Fallback wait
       await new Promise(r => setTimeout(r, 1000));
    }

    // 2. Take the photo
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    const base64Photo = canvas.toDataURL('image/jpeg', 0.7);
    window.store.sessionSet('photo', base64Photo);

    // 3. [SYS.ADMIN] RUN FACIAL BIOMETRICS SCAN
    document.getElementById('status-text').innerText = 'EXTRACTING 128-FLOAT FACIAL GEOMETRY...';
    try {
      const modelsReady = typeof faceapi !== 'undefined' &&
                          faceapi.nets &&
                          faceapi.nets.tinyFaceDetector &&
                          faceapi.nets.tinyFaceDetector.params;

      if (modelsReady) {
        const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
                                       .withFaceLandmarks()
                                       .withFaceDescriptor();
        
        if (detection) {
          const descriptorArray = Array.from(detection.descriptor);
          window.store.sessionSet('face', JSON.stringify(descriptorArray));
          document.getElementById('status-text').innerText = 'GEOMETRY EXTRACTED. CROSS-REFERENCING DATABASE...';
          
          // 4. Send descriptor to Worker for Secure Backend Biometric Math
          try {
              const visitorNameInput = document.getElementById('v-name').value.trim();
              const res = await fetch("https://soft-thunder-2965.zgodmr.workers.dev", {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ action: "auth_biometric", faceDescriptor: descriptorArray, visitorName: visitorNameInput })
              });
              const data = await res.json();
              
if (data.match && data.matchedUser) {
                  // WE HAVE A MATCH! AUTO-LOGIN!
                  document.getElementById('status-text').innerText = `BIOMETRIC MATCH CONFIRMED. WELCOME BACK, ${data.matchedUser.toUpperCase()}.`;
                  document.getElementById('v-name').value = data.matchedUser;
                  _visitorName = data.matchedUser;

                  // Stop camera hardware immediately
                  stream.getTracks().forEach(track => track.stop());
                  if (video.parentNode) video.parentNode.removeChild(video);
                  btn.classList.add('secured');
                  btn.textContent = "[X] BIOMETRICS LOCKED";

/* ════════════════════════════════════════════════════════════════
   IIFE 1 — HUD DATA RAIN  (Easter Egg: press '1' to toggle)
   DOM Injection: hunts for body, injects its own canvas
   Ghost Mode: fully isolated inside IIFE
   Scoped: canvas id = #jv-rain-canvas, no global leakage
   Vanilla JS/CSS only
════════════════════════════════════════════════════════════════ */
(function initHudDataRain() {

  /* ── STATE ── */
  let active = false;
  let animId = null;

  /* ── INJECT CANVAS ── */
  const canvas = document.createElement('canvas');
  canvas.id = 'jv-rain-canvas';
  Object.assign(canvas.style, {
    position:      'fixed',
    top:           '0',
    left:          '0',
    width:         '100%',
    height:        '100%',
    pointerEvents: 'none',
    zIndex:        '1',           /* sits above bg, below your form */
    opacity:       '0',
    transition:    'opacity 0.6s ease',
  });
  document.body.appendChild(canvas);

  const ctx = canvas.getContext('2d');

  /* ── CHAR POOL ── hex digits + binary bursts for that ECE feel */
  const CHARS = '0123456789ABCDEF01アイウエオカキクケコ∑∆Ω∇';

  /* ── COLUMN STATE ── */
  let cols = [];

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    buildColumns();
  }

  function buildColumns() {
    const FONT_SIZE  = 13;
    const COL_WIDTH  = 18;           /* px per column */
    const numCols    = Math.floor(canvas.width / COL_WIDTH);

    cols = [];
    for (let i = 0; i < numCols; i++) {
      /* Only populate columns within two edge bands (~20% each side) */
      const frac = i / numCols;
      const inLeftBand  = frac < 0.22;
      const inRightBand = frac > 0.78;
      if (!inLeftBand && !inRightBand) continue;

      cols.push({
        x:      i * COL_WIDTH,
        y:      Math.random() * -canvas.height,   /* stagger start */
        speed:  2.5 + Math.random() * 3.5,
        chars:  [],
        len:    Math.floor(8 + Math.random() * 18),
        timer:  0,
        rate:   2 + Math.floor(Math.random() * 3), /* frames per char swap */
        bright: Math.random() > 0.85,              /* occasional hot-white leader */
        FONT_SIZE,
        COL_WIDTH,
      });
    }
  }

  /* ── DRAW LOOP ── */
  function draw() {
    /* Fade trail — semi-transparent dark rect each frame */
    ctx.fillStyle = 'rgba(2, 12, 24, 0.18)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    cols.forEach(col => {
      col.timer++;

      /* Swap a random char in the column's string every `rate` frames */
      if (col.timer % col.rate === 0) {
        col.chars.unshift(CHARS[Math.floor(Math.random() * CHARS.length)]);
        if (col.chars.length > col.len) col.chars.pop();
      }

      /* Draw each char in the column */
      col.chars.forEach((ch, j) => {
        const cy = col.y + j * col.FONT_SIZE;
        if (cy < 0 || cy > canvas.height) return;

        let color;
        if (j === 0) {
          /* Leader char — white/cyan flash */
          color = col.bright ? '#ffffff' : '#00e5ff';
          ctx.shadowBlur  = 12;
          ctx.shadowColor = '#00e5ff';
        } else {
          /* Tail fades from cyan → deep teal */
          const fade = 1 - j / col.len;
          const g    = Math.floor(180 * fade + 80);
          color = `rgba(0, ${g}, ${Math.floor(g * 1.4)}, ${0.2 + fade * 0.75})`;
          ctx.shadowBlur = 0;
        }

        ctx.fillStyle = color;
        ctx.font      = `${col.FONT_SIZE}px "Share Tech Mono", monospace`;
        ctx.fillText(ch, col.x, cy);
        ctx.shadowBlur = 0;
      });

      /* Advance column */
      col.y += col.speed;

      /* Reset when fully off screen */
      if (col.y - col.len * col.FONT_SIZE > canvas.height) {
        col.y     = Math.random() * -200;
        col.speed = 2.5 + Math.random() * 3.5;
        col.chars = [];
        col.bright = Math.random() > 0.85;
      }
    });

    animId = requestAnimationFrame(draw);
  }

  /* ── TOGGLE ── */
  function enable() {
    resize();
    canvas.style.opacity = '1';
    draw();
  }

  function disable() {
    canvas.style.opacity = '0';
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    /* Clear canvas after fade */
    setTimeout(() => ctx.clearRect(0, 0, canvas.width, canvas.height), 650);
  }

  /* ── KEYPRESS EASTER EGG ── */
  window.addEventListener('keydown', function(e) {
    if (e.key === '1' || e.code === 'Digit1') {
      active = !active;
      active ? enable() : disable();
    }
  });

  /* ── RESIZE GUARD ── */
  window.addEventListener('resize', () => { if (active) resize(); });

  /* ── CONSOLE HINT ── (shows once, then never again) */
  console.log('%c[JARVIS] Data Rain armed. Press \'1\' to activate.', 'color:#00e5ff;font-family:monospace;');

})();

/* ════════════════════════════════════════════════════════════════
    JARVIS ORBITAL BURST EMITTER — v2
   Replaces sphere-ping with sparse orbital debris + nebula wash.

   Aesthetic: asteroid belt detonation in deep space.
   - Thin elliptical debris rings (tilted orbital planes)
   - Sparse particle shards flung outward (not dense, just ~18-24)
   - One soft nebula wash: a large faint icosphere that blooms
     and dissolves like gas
   - Subtle colour shift: deep cyan → pale violet at peak

   Fires once every 60 s. First burst at 2 s after load.
   Ghost-mode: zero global pollution.
════════════════════════════════════════════════════════════════ */
(function initOrbitalBurst() {

  /* ─── wait for Three.js scene ─────────────────────────────── */
  function waitForScene(cb, n) {
    n = n || 0;
    if (typeof THREE !== 'undefined' && window.scene) {
      cb(window.scene);
    } else if (n < 25) {
      setTimeout(() => waitForScene(cb, n + 1), 100);
    }
  }

  waitForScene(function (scene) {

    /* ─── palette ─────────────────────────────────────────── */
    const COL_CORE   = new THREE.Color(0x00e5ff);   /* cyan       */
    const COL_FRINGE = new THREE.Color(0x9b7fff);   /* pale violet*/

    /* ─── live objects ─────────────────────────────────────── */
    const pool = [];   /* { mesh|points, mat, tick } */

    /* ─── util: lerp colour ─────────────────────────────────── */
    function lerpCol(a, b, t) {
      return new THREE.Color().lerpColors(a, b, t);
    }

    /* ══════════════════════════════════════════════════════════
       1. ORBITAL RING — thin torus, heavily tilted, low opacity
    ══════════════════════════════════════════════════════════ */
    function spawnRing(radius, tiltX, tiltZ, speed, initOpacity) {
      const geo = new THREE.TorusGeometry(radius, 0.012, 3, 90);
      const mat = new THREE.MeshBasicMaterial({
        color:       COL_CORE,
        transparent: true,
        opacity:     initOpacity,
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.x = tiltX;
      mesh.rotation.z = tiltZ;
      scene.add(mesh);

      let age = 0;
      pool.push({
        mesh,
        mat,
        tick() {
          age++;
          /* expand outward */
          const s = 1 + age * speed;
          mesh.scale.setScalar(s);
          /* slow drift rotation */
          mesh.rotation.y += 0.003;
          /* fade: hold briefly then dissolve */
          mat.opacity = initOpacity * Math.max(0, 1 - Math.pow(age / 120, 1.6));
          /* colour drift toward violet as it expands */
          mat.color.copy(lerpCol(COL_CORE, COL_FRINGE, Math.min(1, age / 90)));
          return mat.opacity < 0.005;
        },
      });
    }

    /* ══════════════════════════════════════════════════════════
       2. DEBRIS SHARDS — sparse Points cloud, flung outward
    ══════════════════════════════════════════════════════════ */
    function spawnDebris(count) {
      const positions = new Float32Array(count * 3);
      const velocities = [];

      for (let i = 0; i < count; i++) {
        /* start near origin with tiny random offset */
        const θ = Math.random() * Math.PI * 2;
        const φ = Math.acos(2 * Math.random() - 1);
        const r = 0.3 + Math.random() * 0.5;
        positions[i * 3]     = r * Math.sin(φ) * Math.cos(θ);
        positions[i * 3 + 1] = r * Math.sin(φ) * Math.sin(θ);
        positions[i * 3 + 2] = r * Math.cos(φ);

        /* velocity: outward + slight perpendicular drift */
        const speed = 0.022 + Math.random() * 0.028;
        velocities.push({
          vx: positions[i * 3]     / r * speed,
          vy: positions[i * 3 + 1] / r * speed * (0.6 + Math.random() * 0.8),
          vz: positions[i * 3 + 2] / r * speed,
        });
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

      const mat = new THREE.PointsMaterial({
        color:       COL_CORE,
        size:        0.06,
        transparent: true,
        opacity:     0.55,
        sizeAttenuation: true,
      });

      const pts = new THREE.Points(geo, mat);
      scene.add(pts);

      let age = 0;
      pool.push({
        mesh: pts,
        mat,
        tick() {
          age++;
          const pos = geo.attributes.position.array;
          for (let i = 0; i < count; i++) {
            pos[i * 3]     += velocities[i].vx;
            pos[i * 3 + 1] += velocities[i].vy;
            pos[i * 3 + 2] += velocities[i].vz;
            /* decelerate — asteroid drag in space */
            velocities[i].vx *= 0.985;
            velocities[i].vy *= 0.985;
            velocities[i].vz *= 0.985;
          }
          geo.attributes.position.needsUpdate = true;

          /* fade: slow hold, then dissolve */
          mat.opacity = 0.55 * Math.max(0, 1 - Math.pow(age / 140, 2.2));
          mat.color.copy(lerpCol(COL_CORE, COL_FRINGE, Math.min(1, age / 100)));
          return mat.opacity < 0.005;
        },
      });
    }

    /* ══════════════════════════════════════════════════════════
       3. NEBULA WASH — large faint icosphere bloom
    ══════════════════════════════════════════════════════════ */
    function spawnNebula() {
      const geo = new THREE.IcosahedronGeometry(1.0, 1);   /* low-poly = sparse */
      const mat = new THREE.MeshBasicMaterial({
        color:       COL_CORE,
        wireframe:   true,
        transparent: true,
        opacity:     0.0,
      });
      const mesh = new THREE.Mesh(geo, mat);
      /* random orientation so it never looks the same */
      mesh.rotation.set(
        Math.random() * Math.PI,
        Math.random() * Math.PI,
        Math.random() * Math.PI,
      );
      scene.add(mesh);

      let age = 0;
      pool.push({
        mesh,
        mat,
        tick() {
          age++;
          /* scale: blooms fast, continues drifting */
          const s = 1 + age * 0.018;
          mesh.scale.setScalar(s);
          /* slow spin */
          mesh.rotation.y += 0.001;

          /* opacity envelope: in 0→30, hold 30→70, out 70→160 */
          let op;
          if (age < 30)       op = (age / 30) * 0.11;
          else if (age < 70)  op = 0.11;
          else                op = 0.11 * Math.max(0, 1 - (age - 70) / 90);

          mat.opacity = op;
          mat.color.copy(lerpCol(COL_CORE, COL_FRINGE, Math.min(1, age / 80)));
          return op < 0.003;
        },
      });
    }

    /* ══════════════════════════════════════════════════════════
       FIRE ONE FULL BURST
    ══════════════════════════════════════════════════════════ */
    function fireBurst() {
      /* 2 orbital rings — different tilts, slight timing offset */
      spawnRing(1.0,  Math.PI / 4,  Math.PI / 6,  0.009, 0.28);
      setTimeout(() =>
        spawnRing(1.0, -Math.PI / 5, Math.PI / 3.5, 0.007, 0.18), 220);

      /* sparse debris cloud — 20 shards */
      spawnDebris(20);

      /* nebula wash, delayed slightly so rings lead it */
      setTimeout(spawnNebula, 100);
    }

    /* ─── animation loop ───────────────────────────────────── */
    function tick() {
      requestAnimationFrame(tick);
      for (let i = pool.length - 1; i >= 0; i--) {
        const done = pool[i].tick();
        if (done) {
          const obj = pool[i].mesh;
          scene.remove(obj);
          obj.geometry.dispose();
          pool[i].mat.dispose();
          pool.splice(i, 1);
        }
      }
    }
    tick();

    /* ─── schedule ─────────────────────────────────────────── */
    setTimeout(() => {
      fireBurst();
      setInterval(fireBurst, 60_000);
    }, 2000);

    console.log('%c[JARVIS] Orbital Burst online — 60 s cycle.', 'color:#00e5ff;font-family:monospace;');

  });

})();

  function applyLanguage(langCode) {
    const dict = I18N[langCode] || I18N.en;
    if (window.store) window.store.set('lang', langCode);

    const card = document.querySelector('.jv-glass-card');
    if (card) card.dir = (langCode === 'ur') ? 'rtl' : 'ltr';

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (dict[key]) el.textContent = dict[key];
    });

    document.querySelectorAll('[data-i18n-ph]').forEach(el => {
      const key = el.getAttribute('data-i18n-ph');
      if (dict[key]) el.setAttribute('placeholder', dict[key]);
    });

    const statusEl = document.getElementById('status-text');
    if (statusEl && dict.status_wait && !statusEl.textContent.includes('MATCH')) {
      statusEl.textContent = dict.status_wait;
    }
  }

  const langSelect = document.getElementById('jv-lang-select');
  if (langSelect) {
    const savedLang = (window.store && window.store.get('lang')) || 'en';
    if (I18N[savedLang]) {
      langSelect.value = savedLang;
      setTimeout(() => applyLanguage(savedLang), 100);
    }
    langSelect.addEventListener('change', (e) => applyLanguage(e.target.value));
  }
})();
