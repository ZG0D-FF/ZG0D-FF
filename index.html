<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>JARVIS — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root {
  --cyan:   #00e5ff;
  --blue:   #1565c0;
  --teal:   #00bcd4;
  --amber:  #ffab00;
  --red:    #ff1744;
  --bg:     #020c18;
  --bg2:    #040f1e;
  --panel:  rgba(0,180,230,0.05);
  --border: rgba(0,229,255,0.18);
  --glow:   0 0 18px rgba(0,229,255,0.55);
  --font-hud:  'Orbitron', monospace;
  --font-mono: 'Share Tech Mono', monospace;
  --font-body: 'Rajdhani', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--cyan);
  font-family: var(--font-body); font-size: 16px;
  overflow: hidden; cursor: crosshair;
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--cyan); border-radius: 3px; }
::selection { background: var(--cyan); color: var(--bg); }

/* THREE.JS CANVAS */
#three-canvas {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0; opacity: 0.45;
}

/* GRID OVERLAY */
.grid-overlay {
  position: fixed; inset: 0; pointer-events: none; z-index: 1;
  background-image:
    linear-gradient(rgba(0,229,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,255,0.025) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black, transparent);
}

/* SCAN LINES */
.scanlines {
  position: fixed; inset: 0; pointer-events: none; z-index: 2;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 2px,
    rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px
  );
}

/* VIGNETTE */
.vignette {
  position: fixed; inset: 0; pointer-events: none; z-index: 2;
  background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 40%, rgba(2,12,24,0.7) 100%);
}

/* BOOT SCREEN */
#boot-screen {
  position: fixed; inset: 0; z-index: 100;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 20px; padding: 20px;
  transition: opacity 0.8s ease;
}

/* HUD LOGO — center label only, 3D rings are in Three.js */
.hud-logo-label {
  position: relative; z-index: 10;
  font-family: var(--font-hud); font-size: 22px; font-weight: 900;
  color: var(--cyan); text-shadow: 0 0 30px rgba(0,229,255,0.9), 0 0 60px rgba(0,229,255,0.4);
  letter-spacing: 6px; text-align: center;
  animation: logo-pulse 3s ease infinite;
}
.hud-logo-label .sub {
  display: block; font-size: 9px; letter-spacing: 5px;
  color: rgba(0,229,255,0.5); margin-top: 4px; font-weight: 400;
}
@keyframes logo-pulse {
  0%,100% { text-shadow: 0 0 30px rgba(0,229,255,0.9), 0 0 60px rgba(0,229,255,0.4); }
  50%      { text-shadow: 0 0 50px rgba(0,229,255,1),   0 0 100px rgba(0,229,255,0.6), 0 0 140px rgba(0,229,255,0.2); }
}

/* HUD corner decorations */
.hud-corner {
  position: fixed; width: 60px; height: 60px;
  border-color: rgba(0,229,255,0.3); border-style: solid;
  z-index: 10;
}
.hud-corner.tl { top: 20px; left: 20px; border-width: 1px 0 0 1px; }
.hud-corner.tr { top: 20px; right: 20px; border-width: 1px 1px 0 0; }
.hud-corner.bl { bottom: 20px; left: 20px; border-width: 0 0 1px 1px; }
.hud-corner.br { bottom: 20px; right: 20px; border-width: 0 1px 1px 0; }
.hud-corner::after {
  content: attr(data-label);
  font-family: var(--font-mono); font-size: 8px; letter-spacing: 2px;
  color: rgba(0,229,255,0.3); position: absolute;
}
.hud-corner.tl::after { top: 6px; left: 6px; }
.hud-corner.tr::after { top: 6px; right: 6px; }
.hud-corner.bl::after { bottom: 6px; left: 6px; }
.hud-corner.br::after { bottom: 6px; right: 6px; }

/* Status bars (top) */
.hud-statusbar {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 24px; z-index: 10;
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 2px;
  color: rgba(0,229,255,0.35);
}
.hud-statusbar span { display: flex; align-items: center; gap: 5px; }
.hud-statusbar .dot {
  width: 5px; height: 5px; border-radius: 50%; background: var(--cyan);
  box-shadow: 0 0 6px var(--cyan); animation: pulse-dot 1.5s ease infinite;
}
@keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(.5)} }

/* bottom status */
.hud-bottombar {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 3px;
  color: rgba(0,229,255,0.25); z-index: 10; white-space: nowrap;
}

/* BOOT TEXT */
#boot-text {
  font-family: var(--font-mono); font-size: 13px; color: var(--cyan);
  text-align: center; min-height: 80px; line-height: 2;
  position: relative; z-index: 10;
  text-shadow: 0 0 10px rgba(0,229,255,0.5);
}
#boot-text .line { opacity: 0; }
#boot-text .line.visible { opacity: 1; }
#boot-text .cursor {
  display: inline-block; width: 8px; height: 14px; background: var(--cyan);
  vertical-align: middle; animation: blink 0.7s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* VISITOR FORM */
#visitor-form {
  display: none; flex-direction: column; gap: 14px;
  width: 100%; max-width: 360px; position: relative; z-index: 10;
}
#visitor-form.active { display: flex; }
.form-row { display: flex; flex-direction: column; gap: 5px; }
.form-row label {
  font-family: var(--font-mono); font-size: 11px;
  color: rgba(0,255,255,0.8); letter-spacing: 2px; text-transform: uppercase;
}
.form-row input, .form-row select {
  background: rgba(0,229,255,0.08); border: 1px solid var(--border);
  border-radius: 3px; color: #ffffff; font-family: var(--font-mono);
  font-size: 14px; padding: 10px 14px; outline: none;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.form-row input:focus, .form-row select:focus {
  border-color: var(--cyan); box-shadow: var(--glow);
}
.form-row input::placeholder { color: rgba(0,229,255,0.25); }
.form-row select option { background: #020c18; color: var(--cyan); }

#boot-submit {
  background: transparent; border: 1px solid var(--cyan); color: var(--cyan);
  font-family: var(--font-hud); font-size: 13px; letter-spacing: 3px;
  padding: 12px; cursor: pointer; text-transform: uppercase;
  transition: background 0.3s, box-shadow 0.3s, color 0.3s; border-radius: 3px;
  position: relative; overflow: hidden;
}
#boot-submit::before {
  content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(0,229,255,0.1), transparent);
  transition: left 0.5s;
}
#boot-submit:hover::before { left: 100%; }
#boot-submit:hover { background: var(--cyan); color: var(--bg); box-shadow: var(--glow); }

/* SCAN BAR */
.scan-bar {
  display: none; width: 100%; max-width: 360px; height: 3px;
  background: rgba(0,229,255,0.1); border-radius: 2px;
  overflow: hidden; position: relative; z-index: 10;
}
.scan-bar.active { display: block; }
.scan-bar::after {
  content: ''; position: absolute; left: -40%; width: 40%; height: 100%;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  animation: scan 1.2s linear infinite;
}
@keyframes scan { from { left: -40%; } to { left: 140%; } }

/* HOLOGRAPHIC FLICKER on form panel */
#visitor-form.active {
  animation: flicker-in 0.4s ease forwards;
}
@keyframes flicker-in {
  0%   { opacity: 0; transform: scaleY(0.95); }
  40%  { opacity: 0.6; }
  60%  { opacity: 0.3; }
  80%  { opacity: 0.9; }
  100% { opacity: 1; transform: scaleY(1); }
}

/* PULSE DOT */
.pulse-dot {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  background: var(--cyan); box-shadow: var(--glow);
  animation: pulse-dot 1.5s ease infinite;
}
</style>
</head>
