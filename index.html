<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>JARVIS — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root {
  --cyan:   #00e5ff;
  --blue:   #1565c0;
  --teal:   #00bcd4;
  --amber:  #ffab00;
  --red:    #ff1744;
  --bg:     #020c18;
  --bg2:    #040f1e;
  --panel:  rgba(0,180,230,0.05);
  --border: rgba(0,229,255,0.18);
  --glow:   0 0 18px rgba(0,229,255,0.55);
  --font-hud:  'Orbitron', monospace;
  --font-mono: 'Share Tech Mono', monospace;
  --font-body: 'Rajdhani', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--cyan);
  font-family: var(--font-body); font-size: 16px;
  overflow: hidden; cursor: crosshair;
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--cyan); border-radius: 3px; }
::selection { background: var(--cyan); color: var(--bg); }

/* THREE.JS CANVAS */
#three-canvas {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0; opacity: 0.45;
}

/* GRID OVERLAY */
.grid-overlay {
  position: fixed; inset: 0; pointer-events: none; z-index: 1;
  background-image:
    linear-gradient(rgba(0,229,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,255,0.025) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black, transparent);
}

/* SCAN LINES */
.scanlines {
  position: fixed; inset: 0; pointer-events: none; z-index: 2;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 2px,
    rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px
  );
}

/* VIGNETTE */
.vignette {
  position: fixed; inset: 0; pointer-events: none; z-index: 2;
  background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 40%, rgba(2,12,24,0.7) 100%);
}

/* BOOT SCREEN */
#boot-screen {
  position: fixed; inset: 0; z-index: 100;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 20px; padding: 20px;
  transition: opacity 0.8s ease;
}

/* HUD LOGO — center label only, 3D rings are in Three.js */
.hud-logo-label {
  position: relative; z-index: 10;
  font-family: var(--font-hud); font-size: 22px; font-weight: 900;
  color: var(--cyan); text-shadow: 0 0 30px rgba(0,229,255,0.9), 0 0 60px rgba(0,229,255,0.4);
  letter-spacing: 6px; text-align: center;
  animation: logo-pulse 3s ease infinite;
}
.hud-logo-label .sub {
  display: block; font-size: 9px; letter-spacing: 5px;
  color: rgba(0,229,255,0.5); margin-top: 4px; font-weight: 400;
}
@keyframes logo-pulse {
  0%,100% { text-shadow: 0 0 30px rgba(0,229,255,0.9), 0 0 60px rgba(0,229,255,0.4); }
  50%      { text-shadow: 0 0 50px rgba(0,229,255,1),   0 0 100px rgba(0,229,255,0.6), 0 0 140px rgba(0,229,255,0.2); }
}

/* HUD corner decorations */
.hud-corner {
  position: fixed; width: 60px; height: 60px;
  border-color: rgba(0,229,255,0.3); border-style: solid;
  z-index: 10;
}
.hud-corner.tl { top: 20px; left: 20px; border-width: 1px 0 0 1px; }
.hud-corner.tr { top: 20px; right: 20px; border-width: 1px 1px 0 0; }
.hud-corner.bl { bottom: 20px; left: 20px; border-width: 0 0 1px 1px; }
.hud-corner.br { bottom: 20px; right: 20px; border-width: 0 1px 1px 0; }
.hud-corner::after {
  content: attr(data-label);
  font-family: var(--font-mono); font-size: 8px; letter-spacing: 2px;
  color: rgba(0,229,255,0.3); position: absolute;
}
.hud-corner.tl::after { top: 6px; left: 6px; }
.hud-corner.tr::after { top: 6px; right: 6px; }
.hud-corner.bl::after { bottom: 6px; left: 6px; }
.hud-corner.br::after { bottom: 6px; right: 6px; }

/* Status bars (top) */
.hud-statusbar {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 24px; z-index: 10;
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 2px;
  color: rgba(0,229,255,0.35);
}
.hud-statusbar span { display: flex; align-items: center; gap: 5px; }
.hud-statusbar .dot {
  width: 5px; height: 5px; border-radius: 50%; background: var(--cyan);
  box-shadow: 0 0 6px var(--cyan); animation: pulse-dot 1.5s ease infinite;
}
@keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(.5)} }

/* bottom status */
.hud-bottombar {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 3px;
  color: rgba(0,229,255,0.25); z-index: 10; white-space: nowrap;
}

/* BOOT TEXT */
#boot-text {
  font-family: var(--font-mono); font-size: 13px; color: var(--cyan);
  text-align: center; min-height: 80px; line-height: 2;
  position: relative; z-index: 10;
  text-shadow: 0 0 10px rgba(0,229,255,0.5);
}
#boot-text .line { opacity: 0; }
#boot-text .line.visible { opacity: 1; }
#boot-text .cursor {
  display: inline-block; width: 8px; height: 14px; background: var(--cyan);
  vertical-align: middle; animation: blink 0.7s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* VISITOR FORM */
#visitor-form {
  display: none; flex-direction: column; gap: 14px;
  width: 100%; max-width: 360px; position: relative; z-index: 10;
}
#visitor-form.active { display: flex; }
.form-row { display: flex; flex-direction: column; gap: 5px; }
.form-row label {
  font-family: var(--font-mono); font-size: 11px;
  color: rgba(0,255,255,0.8); letter-spacing: 2px; text-transform: uppercase;
}
.form-row input, .form-row select {
  background: rgba(0,229,255,0.08); border: 1px solid var(--border);
  border-radius: 3px; color: #ffffff; font-family: var(--font-mono);
  font-size: 14px; padding: 10px 14px; outline: none;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.form-row input:focus, .form-row select:focus {
  border-color: var(--cyan); box-shadow: var(--glow);
}
.form-row input::placeholder { color: rgba(0,229,255,0.25); }
.form-row select option { background: #020c18; color: var(--cyan); }

#boot-submit {
  background: transparent; border: 1px solid var(--cyan); color: var(--cyan);
  font-family: var(--font-hud); font-size: 13px; letter-spacing: 3px;
  padding: 12px; cursor: pointer; text-transform: uppercase;
  transition: background 0.3s, box-shadow 0.3s, color 0.3s; border-radius: 3px;
  position: relative; overflow: hidden;
}
#boot-submit::before {
  content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(0,229,255,0.1), transparent);
  transition: left 0.5s;
}
#boot-submit:hover::before { left: 100%; }
#boot-submit:hover { background: var(--cyan); color: var(--bg); box-shadow: var(--glow); }

/* SCAN BAR */
.scan-bar {
  display: none; width: 100%; max-width: 360px; height: 3px;
  background: rgba(0,229,255,0.1); border-radius: 2px;
  overflow: hidden; position: relative; z-index: 10;
}
.scan-bar.active { display: block; }
.scan-bar::after {
  content: ''; position: absolute; left: -40%; width: 40%; height: 100%;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  animation: scan 1.2s linear infinite;
}
@keyframes scan { from { left: -40%; } to { left: 140%; } }

/* HOLOGRAPHIC FLICKER on form panel */
#visitor-form.active {
  animation: flicker-in 0.4s ease forwards;
}
@keyframes flicker-in {
  0%   { opacity: 0; transform: scaleY(0.95); }
  40%  { opacity: 0.6; }
  60%  { opacity: 0.3; }
  80%  { opacity: 0.9; }
  100% { opacity: 1; transform: scaleY(1); }
}

/* PULSE DOT */
.pulse-dot {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  background: var(--cyan); box-shadow: var(--glow);
  animation: pulse-dot 1.5s ease infinite;
}
</style>
</head>
<body>
<iframe src="jarvis_ui.html" style="position: fixed; bottom: 20px; right: 20px; width: 400px; height: 620px; border: none; z-index: 105; background: transparent; pointer-events: auto;"></iframe>




<!-- 3D CANVAS -->
<canvas id="three-canvas"></canvas>

<div class="grid-overlay"></div>
<div class="scanlines"></div>
<div class="vignette"></div>

<!-- HUD CORNERS -->
<div class="hud-corner tl" data-label="SYS.BOOT"></div>
<div class="hud-corner tr" data-label="SEC.LVL5"></div>
<div class="hud-corner bl" data-label="ECE.2026"></div>
<div class="hud-corner br" data-label="AI.CORE"></div>

<!-- STATUS BAR TOP -->
<div class="hud-statusbar">
  <span><div class="dot"></div>NEURAL LINK</span>
  <span><div class="dot" style="animation-delay:.3s"></div>HUD ACTIVE</span>
  <span><div class="dot" style="animation-delay:.6s"></div>SECURE COMM</span>
</div>

<!-- BOTTOM BAR -->
<div class="hud-bottombar">D.J</div>

<!-- BOOT SCREEN -->
<div id="boot-screen">
  <div class="hud-logo-label">
    J.A.R.V.I.S
    <span class="sub">JUST A RATHER VERY INTELLIGENT SYSTEM</span>
  </div>

  <div id="boot-text"></div>
  <div class="scan-bar" id="scan-bar"></div>

  <form id="visitor-form" onsubmit="return false;">
    <div class="form-row">
      <label>YOUR NAME</label>
      <input type="text" id="v-name" placeholder="Enter identification..." autocomplete="off" required/>
    </div>
    <div class="form-row">
      <label>YOUR AGE</label>
      <input type="number" id="v-age" placeholder="Years of operation..." min="1" max="120" required/>
    </div>
    <div class="form-row">
      <label>ADDRESS ME AS</label>
      <select id="v-title">
        <option value="Sir">Sir</option>
        <option value="Ma'am">Ma'am</option>
      </select>
    </div>
    <button id="boot-submit" type="button" onclick="startExperience()">INITIATE ACCESS →</button>
  </form>
</div>

<script>
/* ── YOUR AGE ── */
const MY_AGE = 21;

let _visitorName     = '';
let _visitorGreeting = '';

/* ════════════════════════════════════════
   THREE.JS — 3D JARVIS HOLOGRAM (PERFORMANCE SCALED)
════════════════════════════════════════ */
function init3D() {
  const canvas = document.getElementById('three-canvas');
  
  // 1. HARDWARE DETECTION TRICK
  // Check CPU cores to determine if this is a high-end or low-end device
  const logicalCores = navigator.hardwareConcurrency || 4;
  const isHighEnd = logicalCores >= 8; 

  // Scale variables based on device power
  const pCount = isHighEnd ? 300 : 80;        // Way fewer particles for mobile
  const ringCount = isHighEnd ? 9 : 4;        // Fewer 3D rings for mobile
  const pixelRatio = isHighEnd ? Math.min(window.devicePixelRatio, 2) : 1; // Lower resolution on mobile

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: isHighEnd, alpha: true });
  renderer.setPixelRatio(pixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);

  window.scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0, 5);

  const C = 0x00e5ff;

  /* ── WIREFRAME SPHERE (core) ── */
  const sphereGeo = new THREE.SphereGeometry(1.1, 16, 12);
  const sphereMat = new THREE.MeshBasicMaterial({ color: C, wireframe: true, transparent: true, opacity: 0.08 });
  const sphere = new THREE.Mesh(sphereGeo, sphereMat);
  scene.add(sphere);

  /* ── ICOSAHEDRON (inner core pulse) ── */
  const icoGeo = new THREE.IcosahedronGeometry(0.55, 1);
  const icoMat = new THREE.MeshBasicMaterial({ color: C, wireframe: true, transparent: true, opacity: 0.25 });
  const ico = new THREE.Mesh(icoGeo, icoMat);
  scene.add(ico);

  /* ── TORUS RINGS (SCALED) ── */
  function makeTorus(r, tube, tilt, speed, opacity) {
    // Lower segment count for better performance
    const geo = new THREE.TorusGeometry(r, tube, isHighEnd ? 6 : 4, isHighEnd ? 80 : 40);
    const mat = new THREE.MeshBasicMaterial({ color: C, transparent: true, opacity });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.x = tilt;
    mesh.userData.speed = speed;
    return mesh;
  }

  const allRings = [
    makeTorus(1.55, 0.008, 0,            0.004,  0.7),
    makeTorus(1.55, 0.004, Math.PI/2,   -0.006,  0.4),
    makeTorus(1.8,  0.006, Math.PI/6,   -0.003,  0.5),
    makeTorus(2.1,  0.005, Math.PI/2,   -0.002,  0.35),
    // Extra rings only for high-end devices
    makeTorus(1.55, 0.004, Math.PI/4,    0.005,  0.3),
    makeTorus(1.8,  0.004, -Math.PI/3,   0.007,  0.25),
    makeTorus(2.1,  0.003, Math.PI/5,    0.004,  0.2),
    makeTorus(2.5,  0.006, 0,           -0.0015, 0.15),
    makeTorus(2.5,  0.003, Math.PI/3,    0.003,  0.1)
  ];
  
  const rings = allRings.slice(0, ringCount);
  rings.forEach(r => scene.add(r));

  /* ── PARTICLES (SCALED) ── */
  const pPositions = new Float32Array(pCount * 3);
  const pVel = [];
  for (let i = 0; i < pCount; i++) {
    const r = 2.8 + Math.random() * 2.5;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pPositions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    pPositions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    pPositions[i*3+2] = r * Math.cos(phi);
    pVel.push({
      vx: (Math.random()-.5)*0.003,
      vy: (Math.random()-.5)*0.003,
      vz: (Math.random()-.5)*0.003
    });
  }
  const pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
  const pMat = new THREE.PointsMaterial({ color: C, size: 0.025, transparent: true, opacity: 0.6 });
  const points = new THREE.Points(pGeo, pMat);
  scene.add(points);

  /* ── MOUSE PARALLAX ── */
  let mouseX = 0, mouseY = 0;
  document.addEventListener('mousemove', e => {
    mouseX = (e.clientX / window.innerWidth  - 0.5) * 2;
    mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
  });

  /* ── RESIZE ── */
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* ── ANIMATE ── */
  let t = 0;
  function animate() {
    requestAnimationFrame(animate);
    t += 0.01;

    scene.rotation.y += (mouseX * 0.3 - scene.rotation.y) * 0.02;
    scene.rotation.x += (-mouseY * 0.2 - scene.rotation.x) * 0.02;

    rings.forEach(r => {
      r.rotation.z += r.userData.speed;
      r.rotation.y += r.userData.speed * 0.3;
    });

    sphere.rotation.y += 0.001;
    sphere.rotation.x += 0.0005;
    ico.rotation.y -= 0.008;
    ico.rotation.x += 0.005;
    ico.scale.setScalar(1 + Math.sin(t * 1.5) * 0.06);

    const pos = pGeo.attributes.position.array;
    for (let i = 0; i < pCount; i++) {
      pos[i*3]   += pVel[i].vx;
      pos[i*3+1] += pVel[i].vy;
      pos[i*3+2] += pVel[i].vz;
      const dist = Math.sqrt(pos[i*3]**2 + pos[i*3+1]**2 + pos[i*3+2]**2);
      if (dist > 6 || dist < 2.5) {
        pVel[i].vx *= -1; pVel[i].vy *= -1; pVel[i].vz *= -1;
      }
    }
    pGeo.attributes.position.needsUpdate = true;

    renderer.render(scene, camera);
  }
  animate();
}

/* ════════════════════════════════════════
   BOOT SEQUENCE — identical logic to original
════════════════════════════════════════ */
const bootLines = [
  "Initializing Portfolio AI...",
  "Loading Neural Interface...",
  "Calibrating HUD Systems...",
  "Please identify yourself.",
];

function typeLine(text, el, cb) {
  let i = 0;
  el.innerHTML = '';
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  el.appendChild(cursor);
  const iv = setInterval(() => {
    el.insertBefore(document.createTextNode(text[i]), cursor);
    i++;
    if (i >= text.length) {
      clearInterval(iv);
      setTimeout(() => { cursor.remove(); if (cb) cb(); }, 200);
    }
  }, 38);
}

function runBootLines(container, idx, cb) {
  if (idx >= bootLines.length) { if (cb) cb(); return; }
  const line = document.createElement('div');
  line.className = 'line visible';
  container.appendChild(line);
  typeLine(bootLines[idx], line, () => {
    setTimeout(() => runBootLines(container, idx + 1, cb), 300);
  });
}

window.addEventListener('DOMContentLoaded', () => {
  init3D();
  const bt = document.getElementById('boot-text');
  document.getElementById('visitor-form').classList.add('active');
});

/* ════════════════════════════════════════
   FORM SUBMIT → scan animation — identical logic
════════════════════════════════════════ */
function startExperience() {
  const name  = document.getElementById('v-name').value.trim();
  const age   = parseInt(document.getElementById('v-age').value) || 0;
  const title = document.getElementById('v-title').value;
  if (!name) { document.getElementById('v-name').focus(); return; }

  const diff = Math.abs(age - MY_AGE);
  let greeting;
  if (diff <= 3)          greeting = `Welcome, Fellow Engineer — ${name}`;
  else if (age > MY_AGE)  greeting = `Welcome, ${title} ${name}`;
  else                    greeting = `Welcome, Future Innovator ${name}`;

  _visitorName     = name;
  _visitorGreeting = greeting;

  document.getElementById('visitor-form').classList.remove('active');
  document.getElementById('scan-bar').classList.add('active');

  const bt = document.getElementById('boot-text');
  bt.innerHTML = '';

  launchDashboard();
}

/* ════════════════════════════════════════
   LAUNCH — identical to original
════════════════════════════════════════ */
function launchDashboard() {
  const boot = document.getElementById('boot-screen');
  boot.style.opacity = '0';
  setTimeout(() => {
    window.location.href =
      'dashboard.html' +
      '?visitor='  + encodeURIComponent(_visitorName) +
      '&greeting=' + encodeURIComponent(_visitorGreeting);
  }, 800);
}
/* ════════════════════════════════════════════════════════════════
   IIFE 1 — HUD DATA RAIN  (Easter Egg: press '1' to toggle)
   DOM Injection: hunts for body, injects its own canvas
   Ghost Mode: fully isolated inside IIFE
   Scoped: canvas id = #jv-rain-canvas, no global leakage
   Vanilla JS/CSS only
════════════════════════════════════════════════════════════════ */
(function initHudDataRain() {

  /* ── STATE ── */
  let active = false;
  let animId = null;

  /* ── INJECT CANVAS ── */
  const canvas = document.createElement('canvas');
  canvas.id = 'jv-rain-canvas';
  Object.assign(canvas.style, {
    position:      'fixed',
    top:           '0',
    left:          '0',
    width:         '100%',
    height:        '100%',
    pointerEvents: 'none',
    zIndex:        '1',           /* sits above bg, below your form */
    opacity:       '0',
    transition:    'opacity 0.6s ease',
  });
  document.body.appendChild(canvas);

  const ctx = canvas.getContext('2d');

  /* ── CHAR POOL ── hex digits + binary bursts for that ECE feel */
  const CHARS = '0123456789ABCDEF01アイウエオカキクケコ∑∆Ω∇';

  /* ── COLUMN STATE ── */
  let cols = [];

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    buildColumns();
  }

  function buildColumns() {
    const FONT_SIZE  = 13;
    const COL_WIDTH  = 18;           /* px per column */
    const numCols    = Math.floor(canvas.width / COL_WIDTH);

    cols = [];
    for (let i = 0; i < numCols; i++) {
      /* Only populate columns within two edge bands (~20% each side) */
      const frac = i / numCols;
      const inLeftBand  = frac < 0.22;
      const inRightBand = frac > 0.78;
      if (!inLeftBand && !inRightBand) continue;

      cols.push({
        x:      i * COL_WIDTH,
        y:      Math.random() * -canvas.height,   /* stagger start */
        speed:  2.5 + Math.random() * 3.5,
        chars:  [],
        len:    Math.floor(8 + Math.random() * 18),
        timer:  0,
        rate:   2 + Math.floor(Math.random() * 3), /* frames per char swap */
        bright: Math.random() > 0.85,              /* occasional hot-white leader */
        FONT_SIZE,
        COL_WIDTH,
      });
    }
  }

  /* ── DRAW LOOP ── */
  function draw() {
    /* Fade trail — semi-transparent dark rect each frame */
    ctx.fillStyle = 'rgba(2, 12, 24, 0.18)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    cols.forEach(col => {
      col.timer++;

      /* Swap a random char in the column's string every `rate` frames */
      if (col.timer % col.rate === 0) {
        col.chars.unshift(CHARS[Math.floor(Math.random() * CHARS.length)]);
        if (col.chars.length > col.len) col.chars.pop();
      }

      /* Draw each char in the column */
      col.chars.forEach((ch, j) => {
        const cy = col.y + j * col.FONT_SIZE;
        if (cy < 0 || cy > canvas.height) return;

        let color;
        if (j === 0) {
          /* Leader char — white/cyan flash */
          color = col.bright ? '#ffffff' : '#00e5ff';
          ctx.shadowBlur  = 12;
          ctx.shadowColor = '#00e5ff';
        } else {
          /* Tail fades from cyan → deep teal */
          const fade = 1 - j / col.len;
          const g    = Math.floor(180 * fade + 80);
          color = `rgba(0, ${g}, ${Math.floor(g * 1.4)}, ${0.2 + fade * 0.75})`;
          ctx.shadowBlur = 0;
        }

        ctx.fillStyle = color;
        ctx.font      = `${col.FONT_SIZE}px "Share Tech Mono", monospace`;
        ctx.fillText(ch, col.x, cy);
        ctx.shadowBlur = 0;
      });

      /* Advance column */
      col.y += col.speed;

      /* Reset when fully off screen */
      if (col.y - col.len * col.FONT_SIZE > canvas.height) {
        col.y     = Math.random() * -200;
        col.speed = 2.5 + Math.random() * 3.5;
        col.chars = [];
        col.bright = Math.random() > 0.85;
      }
    });

    animId = requestAnimationFrame(draw);
  }

  /* ── TOGGLE ── */
  function enable() {
    resize();
    canvas.style.opacity = '1';
    draw();
  }

  function disable() {
    canvas.style.opacity = '0';
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    /* Clear canvas after fade */
    setTimeout(() => ctx.clearRect(0, 0, canvas.width, canvas.height), 650);
  }

  /* ── KEYPRESS EASTER EGG ── */
  window.addEventListener('keydown', function(e) {
    if (e.key === '1' || e.code === 'Digit1') {
      active = !active;
      active ? enable() : disable();
    }
  });

  /* ── RESIZE GUARD ── */
  window.addEventListener('resize', () => { if (active) resize(); });

  /* ── CONSOLE HINT ── (shows once, then never again) */
  console.log('%c[JARVIS] Data Rain armed. Press \'1\' to activate.', 'color:#00e5ff;font-family:monospace;');

})();

/* ════════════════════════════════════════════════════════════════
    JARVIS ORBITAL BURST EMITTER — v2
   Replaces sphere-ping with sparse orbital debris + nebula wash.

   Aesthetic: asteroid belt detonation in deep space.
   - Thin elliptical debris rings (tilted orbital planes)
   - Sparse particle shards flung outward (not dense, just ~18-24)
   - One soft nebula wash: a large faint icosphere that blooms
     and dissolves like gas
   - Subtle colour shift: deep cyan → pale violet at peak

   Fires once every 60 s. First burst at 2 s after load.
   Ghost-mode: zero global pollution.
════════════════════════════════════════════════════════════════ */
(function initOrbitalBurst() {

  /* ─── wait for Three.js scene ─────────────────────────────── */
  function waitForScene(cb, n) {
    n = n || 0;
    if (typeof THREE !== 'undefined' && typeof scene !== 'undefined') {
      cb(scene);
    } else if (n < 80) {
      setTimeout(() => waitForScene(cb, n + 1), 100);
    } else {
      console.warn('[OrbitalBurst] THREE scene not found.');
    }
  }

  waitForScene(function (scene) {

    /* ─── palette ─────────────────────────────────────────── */
    const COL_CORE   = new THREE.Color(0x00e5ff);   /* cyan       */
    const COL_FRINGE = new THREE.Color(0x9b7fff);   /* pale violet*/

    /* ─── live objects ─────────────────────────────────────── */
    const pool = [];   /* { mesh|points, mat, tick } */

    /* ─── util: lerp colour ─────────────────────────────────── */
    function lerpCol(a, b, t) {
      return new THREE.Color().lerpColors(a, b, t);
    }

    /* ══════════════════════════════════════════════════════════
       1. ORBITAL RING — thin torus, heavily tilted, low opacity
    ══════════════════════════════════════════════════════════ */
    function spawnRing(radius, tiltX, tiltZ, speed, initOpacity) {
      const geo = new THREE.TorusGeometry(radius, 0.012, 3, 90);
      const mat = new THREE.MeshBasicMaterial({
        color:       COL_CORE,
        transparent: true,
        opacity:     initOpacity,
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.x = tiltX;
      mesh.rotation.z = tiltZ;
      scene.add(mesh);

      let age = 0;
      pool.push({
        mesh,
        mat,
        tick() {
          age++;
          /* expand outward */
          const s = 1 + age * speed;
          mesh.scale.setScalar(s);
          /* slow drift rotation */
          mesh.rotation.y += 0.003;
          /* fade: hold briefly then dissolve */
          mat.opacity = initOpacity * Math.max(0, 1 - Math.pow(age / 120, 1.6));
          /* colour drift toward violet as it expands */
          mat.color.copy(lerpCol(COL_CORE, COL_FRINGE, Math.min(1, age / 90)));
          return mat.opacity < 0.005;
        },
      });
    }

    /* ══════════════════════════════════════════════════════════
       2. DEBRIS SHARDS — sparse Points cloud, flung outward
    ══════════════════════════════════════════════════════════ */
    function spawnDebris(count) {
      const positions = new Float32Array(count * 3);
      const velocities = [];

      for (let i = 0; i < count; i++) {
        /* start near origin with tiny random offset */
        const θ = Math.random() * Math.PI * 2;
        const φ = Math.acos(2 * Math.random() - 1);
        const r = 0.3 + Math.random() * 0.5;
        positions[i * 3]     = r * Math.sin(φ) * Math.cos(θ);
        positions[i * 3 + 1] = r * Math.sin(φ) * Math.sin(θ);
        positions[i * 3 + 2] = r * Math.cos(φ);

        /* velocity: outward + slight perpendicular drift */
        const speed = 0.022 + Math.random() * 0.028;
        velocities.push({
          vx: positions[i * 3]     / r * speed,
          vy: positions[i * 3 + 1] / r * speed * (0.6 + Math.random() * 0.8),
          vz: positions[i * 3 + 2] / r * speed,
        });
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

      const mat = new THREE.PointsMaterial({
        color:       COL_CORE,
        size:        0.06,
        transparent: true,
        opacity:     0.55,
        sizeAttenuation: true,
      });

      const pts = new THREE.Points(geo, mat);
      scene.add(pts);

      let age = 0;
      pool.push({
        mesh: pts,
        mat,
        tick() {
          age++;
          const pos = geo.attributes.position.array;
          for (let i = 0; i < count; i++) {
            pos[i * 3]     += velocities[i].vx;
            pos[i * 3 + 1] += velocities[i].vy;
            pos[i * 3 + 2] += velocities[i].vz;
            /* decelerate — asteroid drag in space */
            velocities[i].vx *= 0.985;
            velocities[i].vy *= 0.985;
            velocities[i].vz *= 0.985;
          }
          geo.attributes.position.needsUpdate = true;

          /* fade: slow hold, then dissolve */
          mat.opacity = 0.55 * Math.max(0, 1 - Math.pow(age / 140, 2.2));
          mat.color.copy(lerpCol(COL_CORE, COL_FRINGE, Math.min(1, age / 100)));
          return mat.opacity < 0.005;
        },
      });
    }

    /* ══════════════════════════════════════════════════════════
       3. NEBULA WASH — large faint icosphere bloom
    ══════════════════════════════════════════════════════════ */
    function spawnNebula() {
      const geo = new THREE.IcosahedronGeometry(1.0, 1);   /* low-poly = sparse */
      const mat = new THREE.MeshBasicMaterial({
        color:       COL_CORE,
        wireframe:   true,
        transparent: true,
        opacity:     0.0,
      });
      const mesh = new THREE.Mesh(geo, mat);
      /* random orientation so it never looks the same */
      mesh.rotation.set(
        Math.random() * Math.PI,
        Math.random() * Math.PI,
        Math.random() * Math.PI,
      );
      scene.add(mesh);

      let age = 0;
      pool.push({
        mesh,
        mat,
        tick() {
          age++;
          /* scale: blooms fast, continues drifting */
          const s = 1 + age * 0.018;
          mesh.scale.setScalar(s);
          /* slow spin */
          mesh.rotation.y += 0.001;

          /* opacity envelope: in 0→30, hold 30→70, out 70→160 */
          let op;
          if (age < 30)       op = (age / 30) * 0.11;
          else if (age < 70)  op = 0.11;
          else                op = 0.11 * Math.max(0, 1 - (age - 70) / 90);

          mat.opacity = op;
          mat.color.copy(lerpCol(COL_CORE, COL_FRINGE, Math.min(1, age / 80)));
          return op < 0.003;
        },
      });
    }

    /* ══════════════════════════════════════════════════════════
       FIRE ONE FULL BURST
    ══════════════════════════════════════════════════════════ */
    function fireBurst() {
      /* 2 orbital rings — different tilts, slight timing offset */
      spawnRing(1.0,  Math.PI / 4,  Math.PI / 6,  0.009, 0.28);
      setTimeout(() =>
        spawnRing(1.0, -Math.PI / 5, Math.PI / 3.5, 0.007, 0.18), 220);

      /* sparse debris cloud — 20 shards */
      spawnDebris(20);

      /* nebula wash, delayed slightly so rings lead it */
      setTimeout(spawnNebula, 100);
    }

    /* ─── animation loop ───────────────────────────────────── */
    function tick() {
      requestAnimationFrame(tick);
      for (let i = pool.length - 1; i >= 0; i--) {
        const done = pool[i].tick();
        if (done) {
          const obj = pool[i].mesh;
          scene.remove(obj);
          obj.geometry.dispose();
          pool[i].mat.dispose();
          pool.splice(i, 1);
        }
      }
    }
    tick();

    /* ─── schedule ─────────────────────────────────────────── */
    setTimeout(() => {
      fireBurst();
      setInterval(fireBurst, 60_000);
    }, 2000);

    console.log('%c[JARVIS] Orbital Burst online — 60 s cycle.', 'color:#00e5ff;font-family:monospace;');

  });

})();

            /* Keeps the subtle breathing effect while it orbits */
            animation: flare-pulse 4s ease-in-out infinite alternate;
        }

        @keyframes cosmic-drift {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(15deg); } 
        }

        /* Maps the intensity (opacity) to the orbit angle */
        @keyframes orbit-and-fade {
            0%   { transform: rotate(0deg); opacity: 0; }       /* Top: Hidden in shadow */
            25%  { transform: rotate(90deg); opacity: 0.3; }    /* Right: Starting to glow */
            40%  { transform: rotate(144deg); opacity: 1; }     /* Bottom-Right: Peak flare matches crescent */
            60%  { transform: rotate(216deg); opacity: 0.4; }   /* Bottom-Left: Fading out */
            75%  { transform: rotate(270deg); opacity: 0; }     /* Left: Dark side of the planet */
            100% { transform: rotate(360deg); opacity: 0; }     /* Back to top */
        }

        @keyframes flare-pulse {
            0% { transform: translate(-50%, -50%) scale(0.9); }
            100% { transform: translate(-50%, -50%) scale(1.1); }
        }
    `;
    document.head.appendChild(style);

    // Build the system
    const eclipseSys = document.createElement('div');
    eclipseSys.id = 'eclipse-system';

    const orbit = document.createElement('div');
    orbit.id = 'flare-orbit';

    const flare = document.createElement('div');
    flare.id = 'eclipse-flare';

    // Inject into the DOM
    orbit.appendChild(flare);
    eclipseSys.appendChild(orbit);
    document.body.appendChild(eclipseSys);
})();
</script>
</body>
</html>
