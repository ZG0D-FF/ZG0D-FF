name: "🐛 Bug Report"
description: "File a bug report for code, edge deployment scripts, web dashboards, or circuits."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report! Please provide as much detail as possible to help isolate and resolve the issue quickly.

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Select which section of the repository has the bug.
      options:
        - "Edge AI / Bioacoustics / TinyML"
        - "Hardware / Microcontrollers (8051, 8085, Arduino, ESP32, Pi)"
        - "Web HUD / Dashboard / UI"
        - "Cloud / Serverless / Database (Cloudflare, Supabase, Redis)"
        - "Academic / Curriculum Notes"
        - "Build / Tooling / Scripts"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Severity / Priority
      description: Impact on current deployment or build.
      options:
        - "P0-Critical (System crash, data loss, build broken)"
        - "P1-High (Feature broken, no workaround)"
        - "P2-Medium (Bug present, workaround exists)"
        - "P3-Low (Cosmetic, minor UI glitch)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "e.g., Audio preprocessing script fails when handling mono WAV input on Raspberry Pi..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run command '...'
        2. Set input parameter to '...'
        3. See error '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: System & Environment
      description: Relevant OS, board revision, hardware specs, runtime, or browser versions.
      placeholder: |
        - OS: Windows 11 / Linux Ubuntu 22.04 / Raspberry Pi OS
        - Hardware: Raspberry Pi 4B (4GB) / ESP32-WROOM-32 / Keil μVision Simulator
        - Python/Node Version: Python 3.10 / Node 20
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Verification Checklist
      options:
        - label: "I have confirmed that this issue has not been previously reported."
          required: true
        - label: "I have verified that no private keys, passwords, or secrets are included in this report."
          required: true
