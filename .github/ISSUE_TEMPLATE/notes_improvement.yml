name: "📚 Academic Notes Improvement"
description: "Suggest a correction, clarification, or addition to curriculum & engineering notes."
title: "[Notes]: "
labels: ["documentation", "notes"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping keep the engineering and ECE notes accurate and rigorous!

  - type: dropdown
    id: subject
    attributes:
      label: Subject / Course Area
      description: Select which subject folder or document is involved.
      options:
        - "8085 Microprocessor Notes / Assembly"
        - "8051 Microcontroller Experiments / Routines"
        - "VLSI Design & CMOS Circuitry"
        - "Digital Logic & ADC/DAC"
        - "DBMS / SQL Architecture"
        - "Engineering Economics"
        - "TinyML / AI & Machine Learning"
        - "ITC (Information Theory & Coding)"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Description of Correction or Addition
      description: Describe what needs to be changed, added, or clarified.
      placeholder: "e.g., In the 8085 timing diagram notes, the T-state count for CALL instruction specifies 18 T-states, but standard 8085 executes it in 18 T-states with 5 machine cycles..."
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: Textbook / Datasheet Reference
      description: Please provide academic references (author, book title, edition, or datasheet URL) backing up this correction.
      placeholder: "e.g., Ramesh Gaonkar, 'Microprocessor Architecture, Programming, and Applications with the 8085', 5th Edition, Page 142"
    validations:
      required: true
