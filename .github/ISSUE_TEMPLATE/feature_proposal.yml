name: "✨ Feature / Hardware Proposal"
description: "Suggest an idea, architectural improvement, or new hardware module."
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new edge deployment, embedded circuit, or dashboard upgrade? Share it below!

  - type: dropdown
    id: category
    attributes:
      label: Proposal Domain
      description: Select the primary domain for this proposal.
      options:
        - "Edge AI & Signal Processing Pipeline"
        - "Embedded Hardware & Sensor Circuit"
        - "Web HUD & Live Dashboard Visualization"
        - "Cloud-Native Serverless & Microservices"
        - "Systems Optimization (C++ / GIL Bypass / Low-Latency)"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Suggested Priority
      description: Initial priority estimate for project board triage.
      options:
        - "P1-High (Core blocker or critical milestone)"
        - "P2-Medium (Standard feature increment)"
        - "P3-Low (Nice-to-have / polish)"

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or limitation? A clear description of the pain point.
      placeholder: "e.g., I'm always frustrated when sensor telemetry buffers overflow under burst conditions..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Architecture
      description: Describe your proposed design, algorithm, sensor schematic, or feature.
      placeholder: "e.g., Implement an asynchronous ring buffer in C++ using atomic pointers..."
    validations:
      required: true

  - type: textarea
    id: implementation_tasks
    attributes:
      label: Implementation Task List
      description: Break down into actionable checklist items (convertible to sub-issues).
      placeholder: |
        - [ ] Task 1: Architecture draft / schematic review
        - [ ] Task 2: Core implementation & test harness
        - [ ] Task 3: Dashboard HUD integration & docs

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false
