name: JARVIS Supabase Keep-Alive

on:
  schedule:
    # Runs at 00:00 every 4 days to prevent the 7-day pause
    - cron: '0 0 */4 * *'
  workflow_dispatch: # Allows you to run it manually from GitHub

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Transmit Telemetry Ping
        run: |
          curl -X POST 'https://btqzwsuuxycpgkzddure.supabase.co/rest/v1/session_logs' \
          -H "apikey: sb_publishable_spGOgKNNafm_foemNcs6WA_dmPpaNLO" \
          -H "Authorization: Bearer sb_publishable_spGOgKNNafm_foemNcs6WA_dmPpaNLO" \
          -H "Content-Type: application/json" \
          -d '{"visitor_name": "GITHUB_ACTION", "page_section": "AUTO_PING", "device_info": "CRON_JOB"}'
