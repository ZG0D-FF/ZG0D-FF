name: Auto-Sync & Deploy Config

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours

jobs:
  sync-config:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: 🔄 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: ⚙️ Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      
      - name: 📋 Check for Changes
        id: changes
        run: |
          if [ $(git rev-list --count HEAD) -gt 1 ]; then
            if git diff HEAD~1 HEAD --quiet; then
              echo "changed=false" >> $GITHUB_OUTPUT
            else
              echo "changed=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: 🏷️ Create Version Tag
        if: steps.changes.outputs.changed == 'true'
        run: |
          VERSION="v$(date +%Y.%m.%d-%H%M%S)"
          git tag -a "$VERSION" -m "Auto-tagged: $VERSION"
          git push origin "$VERSION" || echo "Tag already exists"
          echo "✅ Tagged: $VERSION"
      
      - name: 📢 Sync Status
        run: |
          echo "✅ Config sync completed!"
          echo "📦 Latest version: $(git describe --tags --always)"
