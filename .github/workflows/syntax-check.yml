name: Node Syntax Check

# This tells GitHub to run the check every time you push to the 'main' branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check-syntax:
    runs-on: ubuntu-latest
    steps:
    # 1. Grabs your repository's code
    - uses: actions/checkout@v4
    
    # 2. Installs Node.js on the temporary GitHub server
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        
    # 3. Runs your exact syntax check command!
    - name: Check worker.js for syntax errors
      run: node -c worker.js
